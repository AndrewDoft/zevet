<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eae7e2'/%3E%3Ccircle cx='4.5' cy='8' r='2' fill='%232f6f8f'/%3E%3Ccircle cx='9.5' cy='5' r='1.6' fill='%239a5b3d'/%3E%3Ccircle cx='10.5' cy='11' r='1.6' fill='%234f7a4a'/%3E%3C/svg%3E" />
<style>
  /* Type: Jost, at 200 and 300 only.
     The landing page's own rule, quoted from its layout.tsx: "ONE FAMILY
     CARRIES THE WHOLE SITE. Jost, a Futura-line geometric, set at 200 and 300
     only. Hierarchy comes from size, tracking and air — never from weight, and
     never from a second face." Mono is for paths and commands, which are data,
     not prose. Self-hosted: a workspace that blanks its own labels because a
     CDN is slow has stopped being a workspace. */
  @font-face {
    font-family: "Jost";
    src: url("/fonts/jost-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: light;

    /* From masora-landing/src/app/globals.css, unchanged. */
    --paper: #eae7e2;
    --ink: #2c2f44;
    --muted: #5f6274;
    --faint: #9c9992;
    --line: #cfccc6;
    --fill: #dbdae1;

    /* The one addition. The landing page defines no accent at all — six
       tokens, no colour beyond the ink. Cerulean is chosen to sit beside
       #2c2f44 rather than argue with it: same blue family, more saturation,
       enough darker than the eggshell to hold small text. */
    --cerulean: #2f6f8f;
    --cerulean-soft: #d9e4ea;
    --alert: #a8442f;

    /* Identity, and it has to work on a LIGHT ground: these are mid-dark and
       muted, not the bright hues a dark board can afford. Andrew gets the
       house cerulean. */
    --who-0: #2f6f8f;
    --who-1: #9a5b3d;
    --who-2: #4f7a4a;
    --who-3: #7a5a92;
    --who-4: #a8743a;

    --rail: 224px;
    --tree: 330px;
    --streams: 380px;

    --font-sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cerulean); outline-offset: 2px; }

  /* ---- title bar ---------------------------------------------------- */
  .titlebar {
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px; height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .wordmark { font-weight: 200; font-size: 19px; letter-spacing: 0.16em; text-transform: lowercase; }
  .scope { color: var(--muted); font-size: 12.5px; letter-spacing: 0.02em; }
  .spacer { flex: 1 1 auto; }

  .presence { display: flex; align-items: center; gap: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 9px; border-radius: 100px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid transparent;
  }
  .chip[data-active="true"] { color: var(--ink); border-color: var(--line); background: #fff8; }
  .chip .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .chip[data-active="false"] .bead { opacity: 0.32; }
  .chip[data-dim="true"] { opacity: 0.5; }

  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .conn[data-state="live"] .dot { background: #4f7a4a; }
  .conn[data-state="down"] .dot { background: var(--alert); }

  /* ---- shell ---------------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: var(--rail) 1fr var(--streams);
    min-height: 0;
  }
  .middle { display: grid; grid-template-columns: var(--tree) 1fr; min-height: 0; min-width: 0; }
  .treecol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .rail { border-right: 1px solid var(--line); }
  .streams { border-left: 1px solid var(--line); }

  .pane-title {
    padding: 15px 16px 9px;
    font-size: 10.5px; font-weight: 300;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* ---- people rail ---------------------------------------------------- */
  .person {
    display: grid; grid-template-columns: 10px 1fr; gap: 10px;
    align-items: start;
    width: 100%; text-align: left;
    padding: 9px 16px;
    border-left: 2px solid transparent;
  }
  .person:hover { background: #fff6; }
  .person[data-sel="true"] { background: #fff9; border-left-color: var(--who); }
  .person .bead { width: 9px; height: 9px; border-radius: 50%; background: var(--who); margin-top: 5px; }
  .person[data-idle="true"] .bead { opacity: 0.3; }
  .person .nm { display: block; font-size: 13.5px; letter-spacing: 0.01em; }
  .person[data-idle="true"] .nm { color: var(--muted); }
  .person .sub {
    display: block;
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person .sub .verb { margin-right: 6px; }
  .person .sub .verb { color: var(--ink); }

  .ws { padding: 6px 16px 10px; }
  .ws-item {
    display: block; width: 100%; text-align: left;
    padding: 6px 0; font-size: 13px; color: var(--muted);
  }
  .ws-item[data-sel="true"] { color: var(--ink); }
  .ws-item .branch { font-size: 11px; color: var(--faint); }

  /* ---- file tree ------------------------------------------------------ */
  .tree { padding: 2px 0 20px; }
  .node {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 3px 16px 3px 0;
    font-size: 13px;
  }
  .node[data-sel="true"] { background: var(--cerulean-soft); }
  .node:hover { background: #fff7; }
  .node .label { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; }
  .node .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node[data-kind="dir"] .name { color: var(--ink); }
  .node[data-kind="file"] .name { color: var(--muted); }
  .node[data-touched="true"][data-kind="file"] .name { color: var(--ink); }
  .caret { width: 9px; color: var(--faint); flex: none; font-size: 9px; }
  .ficon { width: 13px; height: 13px; flex: none; opacity: 0.55; }

  .marks { display: flex; align-items: center; gap: 3px; flex: none; }
  .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--who); }
  .mark[data-stale="true"] { opacity: 0.28; }
  .node[data-collide="true"] { background: color-mix(in srgb, var(--alert) 9%, transparent); }
  .node[data-collide="true"] .name { color: var(--alert); }

  .empty-tree { padding: 30px 18px; color: var(--muted); font-size: 13px; max-width: 46ch; }

  /* ---- agent streams --------------------------------------------------- */
  .stream {
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 14px;
  }
  .stream-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .stream-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .stream-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .dwho > span + span { margin-left: 0; }
  .stream-head .agent {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-left: auto;
  }
  .bubble {
    background: #fff9; border: 1px solid var(--line);
    border-left: 2px solid var(--who);
    padding: 8px 11px; margin-bottom: 7px;
    font-size: 13px; line-height: 1.55;
  }
  .bubble.prompt { background: var(--cerulean-soft); border-color: transparent; border-left-color: var(--who); }
  .step {
    display: grid; grid-template-columns: 78px 1fr; gap: 10px;
    align-items: baseline; padding: 2.5px 0; font-size: 12px;
  }
  .step .t { color: var(--faint); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .step .v { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .v b { font-weight: 400; color: var(--ink); }
  /* The house "working" mark. No spinners: a spinner claims progress it
     cannot measure, and this one is measured — it is on while a turn is. */
  .typing { display: inline-flex; gap: 3px; align-items: center; margin-left: 2px; }
  .typing i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--who);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.7; } }

  .idle-note { font-size: 12px; color: var(--faint); }

  /* ---- collisions ------------------------------------------------------ */
  .collide-bar {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 9px 16px;
    background: color-mix(in srgb, var(--alert) 8%, var(--paper));
    border-bottom: 1px solid color-mix(in srgb, var(--alert) 28%, var(--line));
    font-size: 12.5px;
  }
  .collide-bar .file { color: var(--alert); }
  .collide-bar .who-list { color: var(--muted); display: flex; gap: 14px; }
  .collide-bar b { font-weight: 400; color: var(--who); }

  /* ---- file detail ----------------------------------------------------- */
  .detail-who { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 18px 14px; }
  .dwho {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 100px;
    font-size: 12.5px; background: #fff8;
  }
  .dwho .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); }
  .dwho .when { color: var(--faint); font-size: 11.5px; margin-left: 2px; }
  .detail-events { padding: 0 18px 24px; }
  .devent {
    display: grid; grid-template-columns: 70px 90px 74px 1fr;
    gap: 12px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .devent .dt { color: var(--faint); font-size: 11px; }
  .devent .da { color: var(--who); }
  .devent .dv { color: var(--ink); }
  .devent .dd { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- empty / onboarding --------------------------------------------- */
  .blank { padding: 56px 28px; max-width: 58ch; }
  .blank h2 { font-weight: 200; font-size: 26px; letter-spacing: 0.01em; margin: 0 0 12px; }
  .blank p { color: var(--muted); margin: 0 0 12px; line-height: 1.65; }
  .blank code {
    font-family: var(--font-mono); font-size: 12px;
    background: #fff9; border: 1px solid var(--line); padding: 2px 6px;
  }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 180px 1fr; }
    .streams { display: none; }
  }
  @media (max-width: 700px) {
    .shell { grid-template-columns: 1fr; }
    .rail { display: none; }
  }
</style>
</head>
<body>
<div class="titlebar">
  <span class="wordmark">zevet</span>
  <span class="scope" id="scope"></span>
  <span class="spacer"></span>
  <span class="presence" id="presence"></span>
  <span class="conn" id="conn" data-state="init"><span class="dot"></span><span id="connText">connecting</span></span>
</div>

<div class="shell">
  <aside class="pane rail">
    <div class="pane-title">People</div>
    <div class="pane-body" id="people"></div>
    <div class="pane-title" style="border-top:1px solid var(--line)">Workspaces</div>
    <div class="ws" id="workspaces"></div>
  </aside>

  <div class="middle">
    <div class="treecol">
      <div class="pane-title" id="filesTitle">Files</div>
      <div class="pane-body"><div class="tree" id="tree"></div></div>
    </div>
    <main class="detail">
      <div id="collisions"></div>
      <div class="pane-title" id="detailTitle">Nothing selected</div>
      <div class="pane-body" id="detail"></div>
    </main>
  </div>

  <aside class="pane streams">
    <div class="pane-title">Agents</div>
    <div class="pane-body" id="streams"></div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var HUES = 5;
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var IDLE_FALLBACK = 90000;

  var events = [];
  var roster = [];
  var collisions = [];
  var idleAfterMs = IDLE_FALLBACK;
  var skewMs = 0;
  var conn = "init";
  var needsToken = false;
  var selectedActor = null;
  var selectedRepo = null;
  var collapsed = Object.create(null);
  var selectedPath = null;

  function $(id) { return document.getElementById(id); }
  function el(t, c) { var n = document.createElement(t); if (c) n.className = c; return n; }
  function tx(n, s) { n.textContent = s == null ? "" : String(s); return n; }
  function serverNow() { return Date.now() + skewMs; }

  function hueOf(actor) {
    var i = roster.findIndex(function (r) { return r.actor === actor; });
    return "var(--who-" + ((i < 0 ? 0 : i) % HUES) + ")";
  }
  /**
   * A relative-time label that can be refreshed without rebuilding the DOM.
   *
   * The board used to re-render everything once a second, purely so "3s ago"
   * stayed true. That threw away text selection mid-drag, made every click a
   * race against the next tick, and rebuilt a file tree nobody had touched.
   * Now the timer only rewrites elements carrying data-ago, and a full render
   * happens when the DATA changes.
   */
  function agoEl(node, ts) {
    node.dataset.ago = String(ts);
    tx(node, ago(serverNow() - ts) + " ago");
    return node;
  }

  function tickAgo() {
    var now = serverNow();
    document.querySelectorAll("[data-ago]").forEach(function (n) {
      tx(n, ago(now - Number(n.dataset.ago)) + " ago");
    });
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m";
    return Math.round(m / 60) + "h";
  }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString([], { hour12: false }); }
  function verbFor(e) {
    if (e.kind === "prompt") return "asked";
    if (e.kind === "turn_end") return "finished";
    return e.tool || "working";
  }
  function isIdle(r, now) { return now - r.lastTs > idleAfterMs; }

  /** Events for the workspace currently being looked at. */
  function scoped() {
    return events.filter(function (e) { return !selectedRepo || e.repo === selectedRepo; });
  }

  // ---- data -------------------------------------------------------------

  function applySnapshot(s) {
    if (typeof s.now === "number") skewMs = s.now - Date.now();
    roster = s.roster || [];
    collisions = s.collisions || [];
    idleAfterMs = s.idleAfterMs || IDLE_FALLBACK;
    events = s.events || [];
    if (!selectedRepo) selectedRepo = lastRepo();
    render();
  }

  function pushEvent(e) {
    events.push(e);
    if (events.length > 900) events.shift();
    if (!roster.some(function (r) { return r.actor === e.actor; })) {
      roster = roster.concat([{ actor: e.actor, lastTs: e.ts, lastEvent: e }]);
      roster.sort(function (a, b) { return a.actor.localeCompare(b.actor); });
    }
    var r = roster.find(function (x) { return x.actor === e.actor; });
    if (r) { r.lastTs = e.ts; r.lastEvent = e; }
    if (!selectedRepo) selectedRepo = e.repo || null;
    render();
  }

  function lastRepo() {
    for (var i = events.length - 1; i >= 0; i--) if (events[i].repo) return events[i].repo;
    return null;
  }

  function workspaces() {
    var seen = [];
    events.forEach(function (e) {
      if (!e.repo) return;
      var hit = seen.find(function (w) { return w.repo === e.repo; });
      if (!hit) seen.push({ repo: e.repo, branch: e.branch, lastTs: e.ts });
      else { hit.lastTs = Math.max(hit.lastTs, e.ts); if (e.branch) hit.branch = e.branch; }
    });
    return seen.sort(function (a, b) { return b.lastTs - a.lastTs; });
  }

  /**
   * The file tree, built from what people have actually touched.
   *
   * This is the multiplayer view the activity log could not be: a folder
   * structure with WHO is in it, rather than a list of what happened. It is
   * built from observed paths rather than a directory listing on purpose —
   * the hub never receives anyone's files, only the paths their agents named,
   * so this shows exactly the part of the tree the team is working in and
   * nothing else.
   */
  function buildTree() {
    var now = serverNow();
    var root = { name: "", kind: "dir", children: Object.create(null), who: Object.create(null), lastTs: 0 };
    scoped().forEach(function (e) {
      if (!e.target || e.kind !== "tool") return;
      var parts = String(e.target).split("/").filter(Boolean);
      var node = root;
      parts.forEach(function (part, i) {
        var isFile = i === parts.length - 1;
        if (!node.children[part]) {
          node.children[part] = {
            name: part,
            kind: isFile ? "file" : "dir",
            children: Object.create(null),
            who: Object.create(null),
            lastTs: 0,
          };
        }
        node = node.children[part];
        var prev = node.who[e.actor] || 0;
        if (e.ts > prev) node.who[e.actor] = e.ts;
        node.lastTs = Math.max(node.lastTs, e.ts);
      });
    });
    return { root: root, now: now };
  }

  function collisionSet() {
    var s = Object.create(null);
    collisions.forEach(function (c) {
      if (selectedRepo && c.repo && c.repo !== selectedRepo) return;
      s[c.target] = true;
    });
    return s;
  }

  // ---- render ------------------------------------------------------------

  function renderPresence(now) {
    var host = $("presence");
    host.textContent = "";
    roster.forEach(function (r) {
      var b = el("button", "chip");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.active = String(!isIdle(r, now));
      b.dataset.dim = String(Boolean(selectedActor) && selectedActor !== r.actor);
      b.appendChild(el("span", "bead"));
      b.appendChild(tx(el("span"), r.actor));
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
  }

  function renderPeople(now) {
    var host = $("people");
    host.textContent = "";
    roster.forEach(function (r) {
      var idle = isIdle(r, now);
      var b = el("button", "person");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.idle = String(idle);
      b.dataset.sel = String(selectedActor === r.actor);
      b.appendChild(el("span", "bead"));
      var col = el("span");
      col.appendChild(tx(el("span", "nm"), r.actor));
      var sub = el("span", "sub");
      var last = r.lastEvent;
      if (idle) tx(sub, "idle " + ago(now - r.lastTs));
      else if (last) {
        var v = el("span", "verb");
        tx(v, verbFor(last));
        sub.appendChild(v);
        sub.appendChild(document.createTextNode("  " + folderOf(last)));
      }
      col.appendChild(sub);
      b.appendChild(col);
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
    if (!roster.length) {
      var p = el("div");
      p.style.cssText = "padding:14px 16px;color:var(--faint);font-size:12.5px";
      tx(p, "nobody yet");
      host.appendChild(p);
    }
  }

  /** The folder a teammate is working in — the thing you want at a glance. */
  function folderOf(e) {
    if (!e || !e.target) return e && e.detail ? String(e.detail).slice(0, 40) : "";
    var parts = String(e.target).split("/");
    parts.pop();
    return parts.length ? parts.join("/") + "/" : "./";
  }

  function renderWorkspaces() {
    var host = $("workspaces");
    host.textContent = "";
    var list = workspaces();
    list.forEach(function (w) {
      var b = el("button", "ws-item");
      b.dataset.sel = String(selectedRepo === w.repo);
      b.appendChild(tx(el("span"), w.repo));
      if (w.branch) {
        b.appendChild(document.createElement("br"));
        b.appendChild(tx(el("span", "branch"), w.branch));
      }
      b.addEventListener("click", function () {
        selectedRepo = selectedRepo === w.repo ? null : w.repo;
        render();
      });
      host.appendChild(b);
    });
    if (!list.length) {
      var p = el("div");
      p.style.cssText = "color:var(--faint);font-size:12.5px";
      tx(p, "none yet");
      host.appendChild(p);
    }
  }

  var FILE_SVG =
    '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">' +
    '<path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5L9 1.5Z"/>' +
    '<path d="M9 1.5V5a.5.5 0 0 0 .5.5H13"/></svg>';

  function renderTree(now) {
    var host = $("tree");
    host.textContent = "";
    var built = buildTree();
    var collide = collisionSet();
    var any = Object.keys(built.root.children).length > 0;

    tx($("filesTitle"), selectedRepo ? "Files — " + selectedRepo : "Files");

    if (!any) {
      var box = el("div", "empty-tree");
      tx(box, needsToken
        ? "Sign in to see what the team is working on."
        : "No files touched yet. The tree fills in as agents read and edit — it shows the part of the repo the team is actually in, never file contents.");
      host.appendChild(box);
      return;
    }

    function walk(node, depth, prefix) {
      var names = Object.keys(node.children).sort(function (a, b) {
        var A = node.children[a], B = node.children[b];
        if (A.kind !== B.kind) return A.kind === "dir" ? -1 : 1;
        return a.localeCompare(b);
      });
      names.forEach(function (name) {
        var child = node.children[name];
        var path = prefix ? prefix + "/" + name : name;
        var isDir = child.kind === "dir";
        var open = !collapsed[path];

        var row = el("button", "node");
        row.dataset.kind = child.kind;
        row.dataset.collide = String(Boolean(collide[path]));
        var actorsHere = Object.keys(child.who);
        row.dataset.touched = String(actorsHere.length > 0);
        row.style.paddingLeft = 16 + depth * 14 + "px";

        var label = el("span", "label");
        var caret = el("span", "caret");
        tx(caret, isDir ? (open ? "▾" : "▸") : "");
        label.appendChild(caret);
        if (!isDir) {
          var icon = el("span");
          icon.innerHTML = FILE_SVG;
          label.appendChild(icon.firstChild);
        }
        label.appendChild(tx(el("span", "name"), name));
        row.appendChild(label);

        var marks = el("span", "marks");
        actorsHere
          .filter(function (a) { return !selectedActor || a === selectedActor; })
          .sort(function (a, b) { return child.who[b] - child.who[a]; })
          .slice(0, 4)
          .forEach(function (a) {
            var m = el("span", "mark");
            m.style.setProperty("--who", hueOf(a));
            m.dataset.stale = String(now - child.who[a] > idleAfterMs);
            m.title = a + " · " + ago(now - child.who[a]) + " ago";
            marks.appendChild(m);
          });
        row.appendChild(marks);

        row.dataset.sel = String(!isDir && selectedPath === path);
        row.addEventListener("click", function () {
          if (isDir) collapsed[path] = open;
          else selectedPath = selectedPath === path ? null : path;
          render();
        });
        host.appendChild(row);

        if (isDir && open) walk(child, depth + 1, path);
      });
    }
    walk(built.root, 0, "");
  }

  /**
   * What is known about one file.
   *
   * NOT its contents: the hub never receives a byte of anyone's source, by
   * design, and inventing a preview here would be a lie about what this
   * system holds. What it does know — and what you actually want when two
   * people are in one file — is who has been in it, when, and with which
   * tool. The desktop app can show real contents because it reads your own
   * disk; that is a separate surface and is marked as such.
   */
  function renderDetail(now) {
    var host = $("detail");
    host.textContent = "";
    if (!selectedPath) {
      tx($("detailTitle"), "Nothing selected");
      var hint = el("div", "blank");
      hint.appendChild(tx(el("h2"), "Pick a file."));
      hint.appendChild(tx(el("p"), "The tree shows the part of the repo the team is actually working in, built from what everyone's agents have touched. Select a file to see who has been in it."));
      host.appendChild(hint);
      return;
    }

    tx($("detailTitle"), selectedPath);
    var touching = scoped().filter(function (e) { return e.target === selectedPath; });

    var whoLast = Object.create(null);
    touching.forEach(function (e) {
      if (!whoLast[e.actor] || e.ts > whoLast[e.actor]) whoLast[e.actor] = e.ts;
    });

    var summary = el("div", "detail-who");
    Object.keys(whoLast)
      .sort(function (a, b) { return whoLast[b] - whoLast[a]; })
      .forEach(function (a) {
        var chip = el("span", "dwho");
        chip.style.setProperty("--who", hueOf(a));
        chip.appendChild(el("span", "bead"));
        chip.appendChild(tx(el("span"), a));
        chip.appendChild(agoEl(el("span", "when"), whoLast[a]));
        summary.appendChild(chip);
      });
    host.appendChild(summary);

    var list = el("div", "detail-events");
    touching.slice(-40).reverse().forEach(function (e) {
      var row = el("div", "devent");
      row.style.setProperty("--who", hueOf(e.actor));
      row.appendChild(tx(el("span", "dt"), hhmm(e.ts)));
      row.appendChild(tx(el("span", "da"), e.actor));
      row.appendChild(tx(el("span", "dv"), e.tool || verbFor(e)));
      row.appendChild(tx(el("span", "dd mono"), e.detail || ""));
      list.appendChild(row);
    });
    host.appendChild(list);
  }

  function renderCollisions(now) {
    var host = $("collisions");
    host.textContent = "";
    collisions
      .filter(function (c) { return !selectedRepo || !c.repo || c.repo === selectedRepo; })
      .slice(0, 3)
      .forEach(function (c) {
        var bar = el("div", "collide-bar");
        bar.appendChild(tx(el("span", "file mono"), c.target));
        var list = el("span", "who-list");
        (c.actors || []).forEach(function (a) {
          var s = el("span");
          s.style.setProperty("--who", hueOf(a.actor));
          var b = el("b");
          tx(b, a.label || a.actor);
          s.appendChild(b);
          s.appendChild(document.createTextNode(" "));
          s.appendChild(agoEl(el("span"), a.ts));
          list.appendChild(s);
        });
        bar.appendChild(list);
        host.appendChild(bar);
      });
  }

  /**
   * One card per person: their prompt, then the steps their agent has taken
   * since — which is what a Codex or Claude Code pane shows, except there are
   * three of them and each is somebody else.
   */
  function renderStreams(now) {
    var host = $("streams");
    host.textContent = "";
    var shown = roster.filter(function (r) { return !selectedActor || r.actor === selectedActor; });

    shown.forEach(function (r) {
      var mine = scoped().filter(function (e) { return e.actor === r.actor; });
      if (!mine.length) return;

      // Everything since this person's most recent prompt is the current turn.
      var startIdx = 0;
      for (var i = mine.length - 1; i >= 0; i--) {
        if (mine[i].kind === "prompt") { startIdx = i; break; }
      }
      var turn = mine.slice(startIdx);
      var prompt = turn[0] && turn[0].kind === "prompt" ? turn[0] : null;
      var steps = turn.filter(function (e) { return e.kind === "tool"; }).slice(-7);
      var ended = turn.some(function (e) { return e.kind === "turn_end"; });
      var idle = isIdle(r, now);

      var card = el("div", "stream");
      card.style.setProperty("--who", hueOf(r.actor));

      var head = el("div", "stream-head");
      head.appendChild(el("span", "bead"));
      head.appendChild(tx(el("span", "nm"), r.actor));
      var agentTag = el("span", "agent");
      tx(agentTag, (r.lastEvent && r.lastEvent.agent) || "");
      head.appendChild(agentTag);
      card.appendChild(head);

      if (prompt && prompt.detail) {
        var bub = el("div", "bubble prompt");
        tx(bub, prompt.detail);
        card.appendChild(bub);
      }

      steps.forEach(function (e) {
        var row = el("div", "step");
        row.appendChild(tx(el("span", "t"), e.tool || "tool"));
        var v = el("span", "v mono");
        tx(v, e.target || e.detail || "");
        row.appendChild(v);
        card.appendChild(row);
      });

      var foot = el("div", "step");
      foot.appendChild(tx(el("span", "t"), hhmm(r.lastTs)));
      var state = el("span", "v");
      if (idle) {
        state.className = "v idle-note";
        tx(state, "idle " + ago(now - r.lastTs));
      } else if (ended) {
        tx(state, "turn finished");
      } else {
        var w = el("b");
        tx(w, "working");
        state.appendChild(w);
        var dots = el("span", "typing");
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        state.appendChild(dots);
      }
      foot.appendChild(state);
      card.appendChild(foot);

      host.appendChild(card);
    });

    if (!host.childNodes.length) {
      var p = el("div");
      p.style.cssText = "padding:16px;color:var(--faint);font-size:12.5px";
      tx(p, roster.length ? "nothing in this workspace yet" : "no agents yet");
      host.appendChild(p);
    }
  }

  function renderScope() {
    var repos = [];
    var branches = [];
    events.forEach(function (e) {
      if (e.repo && repos.indexOf(e.repo) < 0) repos.push(e.repo);
      if (e.branch && branches.indexOf(e.branch) < 0) branches.push(e.branch);
    });
    var label = selectedRepo || repos.join(", ");
    var br = selectedRepo
      ? (workspaces().find(function (w) { return w.repo === selectedRepo; }) || {}).branch
      : branches.length === 1 ? branches[0] : "";
    tx($("scope"), label ? label + (br ? "   " + br : "") : "");
  }

  function renderBlank() {
    if (roster.length) return false;
    var main = $("tree");
    main.textContent = "";
    var box = el("div", "blank");
    if (needsToken) {
      box.appendChild(tx(el("h2"), "Not signed in."));
      box.appendChild(tx(el("p"), "This board needs the shared token. Open the link you were sent, or ask whoever runs the hub for it."));
    } else if (conn === "down") {
      box.appendChild(tx(el("h2"), "Can't reach the hub."));
      box.appendChild(tx(el("p"), "Retrying on its own. If this stays red, the hub is probably off."));
    } else {
      box.appendChild(tx(el("h2"), "Connected. Nobody is working yet."));
      box.appendChild(tx(el("p"), "This is the hub working, not failing. Start an agent in a wired repo and the tree fills in with who is in which folder."));
      var p = el("p");
      p.appendChild(document.createTextNode("To wire a repo: "));
      p.appendChild(tx(el("code"), "node client/install.mjs <repo>"));
      box.appendChild(p);
    }
    main.appendChild(box);
    return true;
  }

  function render() {
    var now = serverNow();
    renderPresence(now);
    renderPeople(now);
    renderWorkspaces();
    renderCollisions(now);
    renderScope();
    if (!renderBlank()) { renderTree(now); renderDetail(now); }
    renderStreams(now);
  }

  function setConn(state, label) {
    conn = state;
    $("conn").dataset.state = state;
    tx($("connText"), label);
  }

  function connect() {
    var es = new EventSource("/events");
    es.addEventListener("hello", function (m) { setConn("live", "live"); applySnapshot(JSON.parse(m.data)); });
    es.addEventListener("activity", function (m) { pushEvent(JSON.parse(m.data)); });
    es.onopen = function () { setConn("live", "live"); render(); };
    es.onerror = function () {
      fetch("/api/state", { credentials: "same-origin" })
        .then(function (r) {
          if (r.status === 401) { es.close(); needsToken = true; setConn("down", "not signed in"); }
          else if (r.status === 429) { es.close(); setConn("down", "rate limited"); }
          else setConn("down", "reconnecting");
          render();
        })
        .catch(function () { setConn("down", "reconnecting"); render(); });
    };
  }

  // Cheap every second; a full render only when something actually changed,
  // or every 15s so idle transitions still surface.
  var lastFull = 0;
  setInterval(function () {
    tickAgo();
    if (serverNow() - lastFull > 15000) render();
  }, 1000);

  var _render = render;
  render = function () {
    lastFull = serverNow();
    _render();
  };

  render();
  connect();
})();
</script>
</body>
</html>
