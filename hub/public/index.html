<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d0a0a'/%3E%3Crect x='1' y='3' width='13' height='2' rx='1' fill='%23e07a62'/%3E%3Crect x='1' y='7' width='9' height='2' rx='1' fill='%23d9a430'/%3E%3Crect x='1' y='11' width='11' height='2' rx='1' fill='%23c2708f'/%3E%3C/svg%3E" />
<style>
  /* Type, self-hosted. Masora's system bans external font loading (lint 5): a
     board that blanks its labels because a CDN is slow has stopped monitoring.
     All three faces are SIL OFL-1.1 — see fonts/LICENSE. */
  @font-face {
    font-family: "Hanken Grotesk";
    src: url("/fonts/hanken-grotesk-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Frank Ruhl Libre";
    src: url("/fonts/frank-ruhl-libre-variable.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: dark;

    /* Masora's tokens, unchanged. apps/web/src/app/tokens.css is the source. */
    --paper: #0d0a0a;
    --surface: #16110f;
    --surface-2: #1e1715;
    --line: #33221e;
    --grid: #1a1312;
    --ink: #f2e6e1;
    --muted: #8f7d78;
    --rust: #e07a62;
    --rust-deep: #b0523c;
    --rust-bright: #f09c86;
    --fill: #2e1611;
    --fill-soft: #1b1210;
    --warn: #d9a430;
    --danger: #ef6a52;
    --ok: #74bd94;

    /* IDENTITY — the one place this steps outside masora's single-hue ramp,
       deliberately and for a functional reason worth stating.

       The house palette pins hue at 6-14 degrees with saturation falling as
       value rises; that inversion is what makes the bright end read as heat.
       Telling three people apart by value alone inside that ramp is legible
       in a spec and not legible at a glance across three lanes, which is the
       one thing this surface exists to do. The collision warning is only
       useful if you can see WHOSE lane it ties together without reading.

       So: hue spreads, but everything stays warm-biased and desaturated
       enough to sit on --paper without shouting. --who-0 is the house rust,
       so the most common case is still exactly on-system. */
    --who-0: #e07a62;
    --who-1: #d9a430;
    --who-2: #c2708f;
    --who-3: #8fae7a;
    --who-4: #a78bc0;

    /* §7 density: chrome and data at 11px, prose at 15px, 4px rhythm. */
    --t-2xs: 11px;
    --t-xs: 12px;
    --t-sm: 13px;
    --t-base: 15px;

    --font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Frank Ruhl Libre", Georgia, serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    /* The dot grid, as on masora's own body. */
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--t-sm);
    line-height: 1.5;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* §6: motion is opacity and transform only, and short. Colour snaps. */
  * { transition-property: opacity, transform; transition-duration: 140ms; }

  .mono { font-family: var(--font-mono); font-size: var(--t-xs); }
  .num { font-variant-numeric: tabular-nums; }

  button {
    border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  /* ---- header: one rule, no gap ---------------------------------------- */
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    background: rgb(13 10 10 / 0.86);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 21px; font-weight: 400; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .scope { color: var(--muted); font-size: var(--t-xs); }
  .spacer { flex: 1 1 auto; }
  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-2xs); color: var(--muted); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .conn[data-state="live"] .dot { background: var(--ok); }
  .conn[data-state="down"] .dot { background: var(--danger); }
  .clock { font-size: var(--t-2xs); color: var(--muted); }

  /* ---- lanes: the hero -------------------------------------------------- */
  .lanes { border-bottom: 1px solid var(--line); }
  .lane {
    display: grid;
    grid-template-columns: 132px 1fr 232px;
    align-items: center;
    gap: 16px;
    height: 48px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    width: 100%;
    text-align: left;
  }
  .lane:last-child { border-bottom: 0; }
  .lane:hover { background: var(--fill-soft); }
  .lane[data-dimmed="true"] { opacity: 0.4; }

  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who .chip {
    width: 3px; height: 15px; border-radius: 1px; flex: none;
    background: var(--who);
  }
  .who .name {
    font-size: var(--t-sm); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lane[data-idle="true"] .name { color: var(--muted); font-weight: 400; }
  .lane[data-idle="true"] .chip { opacity: 0.35; }

  .track { position: relative; height: 100%; overflow: hidden; }
  .tick {
    position: absolute; bottom: 12px; width: 2px;
    background: var(--who); border-radius: 1px;
  }
  .tick[data-kind="prompt"] { width: 3px; background: var(--ink); opacity: 0.9; }
  .tick[data-kind="turn_end"] { background: var(--line); }

  .now {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    min-width: 0; font-size: var(--t-xs); color: var(--muted);
  }
  .now .verb { color: var(--ink); flex: none; }
  .now .obj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Masora has no spinners (lint 7) — a spinner claims progress it cannot
     measure. The blinking caret is the house "working" mark. */
  .caret {
    width: 2px; height: 13px; flex: none; background: var(--who);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  .axis {
    display: flex; justify-content: space-between;
    padding: 7px 18px 9px;
    /* The lane's first column (132px) PLUS its grid gap (16px). Omitting the
       gap left every label 16px to the left of the track it measures. */
    margin-left: 148px; margin-right: 248px;
    font-size: var(--t-2xs); color: var(--muted); opacity: 0.55;
  }

  /* ---- collisions ------------------------------------------------------- */
  .collision {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 11px 18px 11px 15px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid var(--rust-deep);
    background: var(--fill);
  }
  .collision .file { font-size: var(--t-sm); color: var(--ink); }
  .collision .parties { display: flex; gap: 20px; font-size: var(--t-xs); color: var(--muted); flex-wrap: wrap; }
  .collision .parties b { font-weight: 500; color: var(--who); }

  /* ---- feed ------------------------------------------------------------- */
  .feed-head {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 18px 9px;
    font-size: var(--t-2xs); color: var(--muted);
  }
  .pill {
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px;
    font-size: var(--t-2xs); color: var(--muted);
  }
  .pill:hover { color: var(--ink); border-color: var(--rust-deep); }

  .feed { flex: 1 1 auto; overflow-y: auto; border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 74px 104px 84px 1fr;
    gap: 14px; align-items: baseline;
    padding: 6px 18px;
    border-bottom: 1px solid var(--line);
    font-size: var(--t-xs);
  }
  .row:hover { background: var(--fill-soft); }
  .row .t { color: var(--muted); opacity: 0.7; }
  .row .a { color: var(--who); }
  .row .k { color: var(--muted); }
  .row .d { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row[data-kind="turn_end"] .d { color: var(--muted); opacity: 0.7; }

  /* ---- empty states: three cases, never conflated (masora §10) ---------- */
  .empty { padding: 56px 18px; max-width: 60ch; }
  .empty h2 {
    font-family: var(--font-display); font-weight: 400;
    font-size: 23px; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .empty p { color: var(--muted); font-size: var(--t-base); line-height: 1.65; margin: 0 0 12px; max-width: 58ch; }
  .empty code {
    font-family: var(--font-mono); font-size: var(--t-xs);
    background: var(--surface); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 3px; color: var(--ink);
  }
  .empty.failed h2 { color: var(--danger); }

  @media (max-width: 800px) {
    .lane { grid-template-columns: 96px 1fr; }
    .now { display: none; }
    .axis { margin-right: 18px; margin-left: 96px; }
    .row { grid-template-columns: 62px 92px 1fr; }
    .row .k { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark">zevet</span>
  <span class="scope" id="scope"></span>
  <span class="spacer"></span>
  <span class="conn" id="conn" data-state="init"><span class="dot"></span><span id="connText">connecting</span></span>
  <span class="clock mono num" id="clock"></span>
</header>

<main id="main" style="flex:1 1 auto; display:flex; flex-direction:column; min-height:0;">
  <section class="lanes" id="lanes" hidden></section>
  <div class="axis" id="axis" hidden></div>
  <section id="collisions"></section>
  <div class="feed-head" id="feedHead" hidden>
    <span>Activity</span>
    <span class="spacer"></span>
    <button class="pill" id="clearFilter" hidden>Show everyone</button>
  </div>
  <div class="feed" id="feed" hidden></div>
  <div id="empty"></div>
</main>

<script>
(function () {
  "use strict";

  var HUE_COUNT = 5;
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  // How much history the lanes show. Eight minutes suits a team mid-session;
  // a shorter span is better when you are watching one thing land.
  var WINDOW_MIN = Math.min(120, Math.max(1, Number(params.get("minutes")) || 8));
  var WINDOW_MS = WINDOW_MIN * 60 * 1000;

  var events = [];
  var roster = [];
  var collisions = [];
  var idleAfterMs = 90000;
  var filterActor = null;
  var conn = "init"; // init | live | down
  var lastError = "";
  /**
   * Hub clock minus this browser's clock.
   *
   * Event timestamps are stamped hub-side on purpose — one clock means one
   * ordering for everybody. But every comparison here was against the
   * BROWSER's Date.now(), so a laptop whose clock had drifted (asleep for an
   * hour, a dual-boot RTC, a bad NTP) rendered:
   *   - every lane empty, because `age > WINDOW_MS` for all of it, while the
   *     feed below scrolled happily — which reads as "the lanes are broken";
   *   - or everyone permanently idle while actively working;
   *   - or "-34s ago" on a collision card.
   * The hub already sends its own `now` in every snapshot. It was being
   * discarded. Ninety seconds of drift is unremarkable on a laptop.
   */
  var skewMs = 0;
  function serverNow() { return Date.now() + skewMs; }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; }
  function text(node, s) { node.textContent = s == null ? "" : String(s); return node; }

  function hueVar(actor) {
    var i = roster.findIndex(function (r) { return r.actor === actor; });
    return "var(--who-" + ((i < 0 ? 0 : i) % HUE_COUNT) + ")";
  }
  function hhmmss(ts) { return new Date(ts).toLocaleTimeString([], { hour12: false }); }
  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m";
    return Math.round(m / 60) + "h";
  }
  function verbFor(e) {
    if (e.kind === "prompt") return "asked";
    if (e.kind === "turn_end") return "finished";
    return e.tool || "working";
  }
  function shortPath(p) {
    var parts = String(p).split(/[\\/]/).filter(Boolean);
    return parts.slice(-2).join("/");
  }
  function objFor(e) {
    if (e.target) return shortPath(e.target);
    if (e.detail) return e.detail;
    return "";
  }

  function applySnapshot(s) {
    if (typeof s.now === "number") skewMs = s.now - Date.now();
    roster = s.roster || [];
    collisions = s.collisions || [];
    idleAfterMs = s.idleAfterMs || idleAfterMs;
    events = s.events || [];
    render();
  }

  function pushEvent(e) {
    events.push(e);
    if (events.length > 600) events.shift();
    var known = roster.some(function (r) { return r.actor === e.actor; });
    if (!known) {
      roster = roster.concat([{ actor: e.actor, lastTs: e.ts, lastEvent: e }]);
      roster.sort(function (a, b) { return a.actor.localeCompare(b.actor); });
    }
    var r = roster.find(function (x) { return x.actor === e.actor; });
    if (r) { r.lastTs = e.ts; r.lastEvent = e; }
    render();
  }

  function renderLanes(now) {
    var host = $("lanes");
    host.textContent = "";
    roster.forEach(function (r) {
      var idle = now - r.lastTs > idleAfterMs;
      var lane = el("button", "lane");
      lane.style.setProperty("--who", hueVar(r.actor));
      lane.dataset.idle = String(idle);
      lane.dataset.dimmed = String(Boolean(filterActor) && filterActor !== r.actor);
      lane.setAttribute("aria-label", "Show only " + r.actor);

      var who = el("div", "who");
      who.appendChild(el("span", "chip"));
      who.appendChild(text(el("span", "name"), r.actor));
      lane.appendChild(who);

      var track = el("div", "track");
      events.forEach(function (e) {
        if (e.actor !== r.actor) return;
        var age = now - e.ts;
        if (age > WINDOW_MS) return;
        // Clamp instead of dropping: a tiny negative age is an event that
        // landed between the snapshot and this frame, not a broken event.
        if (age < 0) age = 0;
        var tick = el("div", "tick");
        tick.dataset.kind = e.kind;
        tick.style.left = "calc(" + ((1 - age / WINDOW_MS) * 100).toFixed(3) + "% - 1px)";
        tick.style.height = e.kind === "prompt" ? "24px" : e.kind === "turn_end" ? "9px" : "15px";
        tick.title = hhmmss(e.ts) + "  " + verbFor(e) + (objFor(e) ? "  " + objFor(e) : "");
        track.appendChild(tick);
      });
      lane.appendChild(track);

      var now_ = el("div", "now");
      if (idle) {
        now_.appendChild(text(el("span", "obj"), "idle " + ago(now - r.lastTs)));
      } else {
        var last = r.lastEvent || {};
        now_.appendChild(el("span", "caret"));
        now_.appendChild(text(el("span", "verb"), verbFor(last)));
        var obj = el("span", last.kind === "prompt" ? "obj" : "obj mono");
        now_.appendChild(text(obj, objFor(last)));
      }
      lane.appendChild(now_);

      lane.addEventListener("click", function () {
        filterActor = filterActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(lane);
    });

    var axis = $("axis");
    axis.textContent = "";
    for (var step = 4; step >= 0; step--) {
      var mins = (WINDOW_MIN * step) / 4;
      var label = step === 0 ? "now" : "-" + (Number.isInteger(mins) ? mins : mins.toFixed(1)) + "m";
      axis.appendChild(text(el("span"), label));
    }
  }

  function renderCollisions(now) {
    var host = $("collisions");
    host.textContent = "";
    collisions.slice(0, 5).forEach(function (c) {
      var div = el("div", "collision");
      div.appendChild(text(el("span", "file mono"), c.target));
      var p = el("span", "parties");
      c.actors.forEach(function (a) {
        // One span per party, spaced by CSS. Three literal spaces collapse to
        // one in HTML, which ran the names together: "michael 4s ago andrew 4s ago".
        var party = el("span", "party");
        party.style.setProperty("--who", hueVar(a.actor));
        var b = el("b");
        text(b, a.label || a.actor);
        party.appendChild(b);
        party.appendChild(text(el("span"), " " + ago(now - a.ts) + " ago"));
        p.appendChild(party);
      });
      div.appendChild(p);
      host.appendChild(div);
    });
  }

  function renderFeed() {
    var feed = $("feed");
    $("clearFilter").hidden = !filterActor;
    feed.textContent = "";
    events
      .filter(function (e) { return !filterActor || e.actor === filterActor; })
      .slice(-240)
      .reverse()
      .forEach(function (e) {
        var row = el("div", "row");
        row.dataset.kind = e.kind;
        row.style.setProperty("--who", hueVar(e.actor));
        row.appendChild(text(el("span", "t mono num"), hhmmss(e.ts)));
        row.appendChild(text(el("span", "a"), e.actor));
        row.appendChild(text(el("span", "k"), verbFor(e)));
        // Mono is for paths and shell commands. A prompt is prose, and setting
        // English in a monospace face makes it read as data the reader has to
        // decode rather than a sentence somebody typed.
        var isProse = e.kind === "prompt";
        var d = el("span", isProse ? "d" : "d mono");
        text(d, e.target || e.detail || (e.kind === "turn_end" ? "turn ended" : ""));
        row.appendChild(d);
        feed.appendChild(row);
      });
  }

  /**
   * Three cases, never conflated (masora DESIGN.md §10). "Nothing here" and
   * "we could not ask" call for completely different actions, and showing one
   * when it is the other is how a working product looks broken.
   */
  function renderEmpty() {
    var host = $("empty");
    var hasPeople = roster.length > 0;
    $("lanes").hidden = !hasPeople;
    $("axis").hidden = !hasPeople;
    $("feed").hidden = !hasPeople;
    $("feedHead").hidden = !hasPeople;
    if (hasPeople) { host.textContent = ""; host.hidden = true; return; }
    host.hidden = false;
    host.textContent = "";

    var box = el("div", "empty");
    if (!token) {
      box.className = "empty failed";
      box.appendChild(text(el("h2"), "This board needs a token."));
      var p1 = el("p");
      p1.appendChild(document.createTextNode("Open it with the shared token on the end of the URL: "));
      p1.appendChild(text(el("code"), location.origin + "/?token=…"));
      box.appendChild(p1);
      box.appendChild(text(el("p"), "Ask whoever runs the hub for it. It is the same value their ZEVET_TOKEN is set to."));
    } else if (conn === "down") {
      box.className = "empty failed";
      box.appendChild(text(el("h2"), "Can't reach the hub."));
      box.appendChild(text(el("p"), lastError || "The connection dropped. Retrying on its own — nothing to do unless this stays red."));
      box.appendChild(text(el("p"), "If it does: check the hub is still running, and that the token in this URL matches the one it was started with."));
    } else {
      box.appendChild(text(el("h2"), "Connected. Nothing running yet."));
      box.appendChild(text(el("p"), "The hub is up and this board is listening. Nobody's agent has done anything yet — that is this working, not this broken."));
      var p2 = el("p");
      p2.appendChild(document.createTextNode("Start Claude Code in a repo where the hook is installed. To wire one up: "));
      p2.appendChild(text(el("code"), "node client/install.mjs <repo>"));
      box.appendChild(p2);
    }
    host.appendChild(box);
  }

  function render() {
    var now = serverNow();
    renderLanes(now);
    renderCollisions(now);
    renderFeed();
    renderEmpty();

    var repos = [];
    var branches = [];
    events.forEach(function (e) {
      if (e.repo && repos.indexOf(e.repo) < 0) repos.push(e.repo);
      if (e.branch && branches.indexOf(e.branch) < 0) branches.push(e.branch);
    });
    text($("scope"), repos.length ? repos.join(", ") + (branches.length === 1 ? "  ·  " + branches[0] : "") : "");
  }

  function setConn(stateName, label, err) {
    conn = stateName;
    lastError = err || "";
    $("conn").dataset.state = stateName;
    text($("connText"), label);
  }

  function connect() {
    var es = new EventSource("/events?token=" + encodeURIComponent(token));
    es.addEventListener("hello", function (m) {
      setConn("live", "live");
      applySnapshot(JSON.parse(m.data));
    });
    es.addEventListener("activity", function (m) { pushEvent(JSON.parse(m.data)); });
    es.onopen = function () { setConn("live", "live"); render(); };
    es.onerror = function () {
      // EventSource reconnects on its own. Saying so beats a board that looks
      // live while receiving nothing.
      setConn("down", "reconnecting", "Lost the connection to the hub. It retries automatically.");
      render();
    };
  }

  $("clearFilter").addEventListener("click", function () { filterActor = null; render(); });

  setInterval(function () {
    text($("clock"), hhmmss(serverNow()));
    render();
  }, 1000);

  text($("clock"), hhmmss(serverNow()));
  if (!token) { setConn("down", "no token"); render(); } else { render(); connect(); }
})();
</script>
</body>
</html>
