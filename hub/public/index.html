<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eae7e2'/%3E%3Ccircle cx='4.5' cy='8' r='2' fill='%232f6f8f'/%3E%3Ccircle cx='9.5' cy='5' r='1.6' fill='%239a5b3d'/%3E%3Ccircle cx='10.5' cy='11' r='1.6' fill='%234f7a4a'/%3E%3C/svg%3E" />
<style>
  /* Type: Jost, at 200 and 300 only.
     The landing page's own rule, quoted from its layout.tsx: "ONE FAMILY
     CARRIES THE WHOLE SITE. Jost, a Futura-line geometric, set at 200 and 300
     only. Hierarchy comes from size, tracking and air — never from weight, and
     never from a second face." Mono is for paths and commands, which are data,
     not prose. Self-hosted: a workspace that blanks its own labels because a
     CDN is slow has stopped being a workspace. */
  @font-face {
    font-family: "Jost";
    src: url("/fonts/jost-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: light;

    /* From masora-landing/src/app/globals.css, unchanged. */
    --paper: #eae7e2;
    --ink: #2c2f44;
    --muted: #5f6274;
    --faint: #9c9992;
    --line: #cfccc6;
    --fill: #dbdae1;

    /* The one addition. The landing page defines no accent at all — six
       tokens, no colour beyond the ink. Cerulean is chosen to sit beside
       #2c2f44 rather than argue with it: same blue family, more saturation,
       enough darker than the eggshell to hold small text. */
    --cerulean: #2f6f8f;
    --cerulean-soft: #d9e4ea;
    --alert: #a8442f;

    /* Identity, and it has to work on a LIGHT ground: these are mid-dark and
       muted, not the bright hues a dark board can afford. Andrew gets the
       house cerulean. */
    --who-0: #2f6f8f;
    --who-1: #9a5b3d;
    --who-2: #4f7a4a;
    --who-3: #7a5a92;
    --who-4: #a8743a;

    --rail: 224px;
    --tree: 286px;
    --streams: 340px;

    --font-sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    /* Three rows: the title bar, the status strip, and the shell taking the
       rest. ⚠️ THE COUNT MATTERS. This was `auto 1fr` for two children, and
       adding the strip as a third silently gave the STRIP the 1fr row and left
       the shell on an implicit auto one -- a 400px void above the panes and a
       board pushed off the bottom of the window. Adding a fourth child means
       adding a fourth row here. */
    grid-template-rows: auto auto 1fr;
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cerulean); outline-offset: 2px; }

  /* ---- title bar ---------------------------------------------------- */
  .titlebar {
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px; height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .wordmark { font-weight: 200; font-size: 19px; letter-spacing: 0.16em; text-transform: lowercase; }
  .scope { color: var(--muted); font-size: 12.5px; letter-spacing: 0.02em; }
  .spacer { flex: 1 1 auto; }

  .presence { display: flex; align-items: center; gap: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 9px; border-radius: 100px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid transparent;
  }
  .chip[data-active="true"] { color: var(--ink); border-color: var(--line); background: #fff8; }
  .chip .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .chip[data-active="false"] .bead { opacity: 0.32; }
  .chip[data-dim="true"] { opacity: 0.5; }

  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .conn[data-state="live"] .dot { background: #4f7a4a; }
  .conn[data-state="down"] .dot { background: var(--alert); }

  /* ---- shell ---------------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: var(--rail) 1fr var(--streams);
    min-height: 0;
  }
  .middle { display: grid; grid-template-columns: var(--tree) 1fr; min-height: 0; min-width: 0; }
  .treecol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .rail { border-right: 1px solid var(--line); }
  .streams { border-left: 1px solid var(--line); }

  .pane-title {
    padding: 15px 16px 9px;
    font-size: 10.5px; font-weight: 300;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* ---- people rail ---------------------------------------------------- */
  .person {
    display: grid; grid-template-columns: 10px 1fr; gap: 10px;
    align-items: start;
    width: 100%; text-align: left;
    padding: 9px 16px;
    border-left: 2px solid transparent;
  }
  .person:hover { background: #fff6; }
  .person[data-sel="true"] { background: #fff9; border-left-color: var(--who); }
  .person .bead { width: 9px; height: 9px; border-radius: 50%; background: var(--who); margin-top: 5px; }
  .person[data-idle="true"] .bead { opacity: 0.3; }
  .person .nm { display: block; font-size: 13.5px; letter-spacing: 0.01em; }
  .person[data-idle="true"] .nm { color: var(--muted); }
  .person .sub {
    display: block;
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person .sub .verb { margin-right: 6px; }
  .person .sub .verb { color: var(--ink); }

  .ws { padding: 6px 16px 10px; }
  .ws-item {
    display: block; width: 100%; text-align: left;
    padding: 6px 0; font-size: 13px; color: var(--muted);
  }
  .ws-item[data-sel="true"] { color: var(--ink); }
  .ws-item .branch { font-size: 11px; color: var(--faint); }

  .ws-add {
    display: block; width: 100%; text-align: left;
    padding: 8px 0 2px; font-size: 12.5px; color: var(--cerulean);
  }
  .ws-note { font-size: 11px; color: var(--faint); padding-top: 6px; }

  /* ---- file tree ------------------------------------------------------ */
  .tree { padding: 2px 0 20px; }
  .node {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 3px 16px 3px 0;
    font-size: 13px;
  }
  .node[data-sel="true"] { background: var(--cerulean-soft); }
  .node:hover { background: #fff7; }
  .node .label { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; }
  .node .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node[data-kind="dir"] .name { color: var(--ink); }
  .node[data-kind="file"] .name { color: var(--muted); }
  .node[data-touched="true"][data-kind="file"] .name { color: var(--ink); }
  .caret { width: 9px; color: var(--faint); flex: none; font-size: 9px; }
  .ficon { width: 13px; height: 13px; flex: none; opacity: 0.55; }

  .marks { display: flex; align-items: center; gap: 3px; flex: none; }
  .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--who); }
  .mark[data-stale="true"] { opacity: 0.28; }
  .node[data-collide="true"] { background: color-mix(in srgb, var(--alert) 9%, transparent); }
  .node[data-collide="true"] .name { color: var(--alert); }

  .empty-tree { padding: 30px 18px; color: var(--muted); font-size: 13px; max-width: 46ch; }

  /* ---- the status strip -------------------------------------------------
     Andrew's own Claude Code status line, brought inside zevet. Segments
     separated by a dim pipe, monospace numerals, nothing that reflows when a
     number changes width -- it updates constantly and a strip that jitters is
     a strip you learn to ignore. */
  .strip {
    display: flex; align-items: center; gap: 0;
    flex: none; overflow-x: auto; scrollbar-width: none;
    padding: 5px 16px; border-bottom: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .strip::-webkit-scrollbar { display: none; }
  /* Nothing to say, no bar. In a plain browser tab there is no agent stream and
     no machine to probe, so the strip is empty -- and an empty 10px bar with a
     rule under it reads as a rendering fault rather than as an absence.
     ⚠️ COLLAPSED, NOT `display: none`. Removing it from the layout takes it out
     of the body grid too, which leaves three declared rows with two children:
     the shell then lands on an auto row instead of the 1fr one and stops
     halfway down the window. Zero height keeps the slot and shows nothing. */
  .strip:empty { height: 0; padding: 0; border-bottom: 0; }
  .strip .seg { display: inline-flex; align-items: baseline; gap: 5px; }
  .strip .sep { color: var(--line); padding: 0 10px; }
  .strip .k { color: var(--faint); }
  .strip .v { color: var(--ink); }
  .strip .ok { color: #4f7a4a; }
  .strip .warn { color: var(--who-4); }
  .strip .bad { color: var(--alert); }
  .strip .dim { color: var(--faint); }
  /* The bar is drawn with block characters rather than a div, so it sits on the
     same baseline as the number beside it and needs no vertical alignment
     fiddling at 10px. */
  .strip .bar { letter-spacing: -0.5px; }

  /* ---- tree badges: how long a file is, and what git thinks changed -----
     Pushed to the right with margin-left:auto so the names stay a clean
     left-hand column and the numbers a clean right-hand one; a badge inline
     after the name would ragged-edge every row. Tabular numerals so 9 and 412
     occupy the same column and the eye can compare them. */
  .node .stat { margin-left: auto; display: flex; align-items: baseline; gap: 7px; flex: none;
                font-family: var(--font-mono); font-size: 10px; font-variant-numeric: tabular-nums; }
  .stat .loc { color: var(--faint); }
  .stat .add { color: #4f7a4a; }
  .stat .del { color: var(--alert); }
  .stat .new { color: var(--cerulean); }
  .node[data-sel="true"] .stat .loc { color: var(--muted); }
  /* A directory gets no badge. Summing a folder's lines invites the question
     of whether it counts what is collapsed underneath it, and either answer is
     wrong half the time. */

  /* ---- the editor -------------------------------------------------------
     CodeMirror is given no theme of its own beyond this: the board already has
     a palette and a mono face, and a second one fighting it would be obvious.
     Everything below is either "inherit" or an existing token. */
  .ed { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; min-width: 0; }
  .ed-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 18px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted); flex: none;
  }
  .ed-bar .grow { flex: 1 1 auto; }
  .ed-state { display: inline-flex; align-items: center; gap: 6px; }
  .ed-state .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .ed-state[data-state="open"] .dot { background: #4f7a4a; }
  .ed-state[data-state="connecting"] .dot,
  .ed-state[data-state="retrying"] .dot { background: var(--who-4); }
  .ed-state[data-state="error"] .dot,
  .ed-state[data-state="undecipherable"] .dot { background: var(--alert); }
  .ed-saved { color: var(--faint); }
  .ed-saved[data-dirty="true"] { color: var(--who-4); }

  .ed-host { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .cm-editor { height: 100%; }
  .cm-editor .cm-scroller { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
  .cm-editor.cm-focused { outline: none; }
  .cm-gutters { background: transparent; border-right: 1px solid var(--line); color: var(--faint); }
  .cm-activeLine { background: #ffffff55; }
  .cm-activeLineGutter { background: transparent; color: var(--muted); }
  .cm-selectionBackground, .cm-editor ::selection { background: var(--cerulean-soft); }
  /* y-codemirror.next draws remote carets and a name flag; both take the
     colour from the inline style it sets per user, which is the teammate hue
     handed to awareness. Only the typography is ours. */
  .cm-ySelectionInfo { font-family: var(--font-sans); font-size: 9.5px; letter-spacing: 0.04em; }

  /* ---- the riders -------------------------------------------------------
     One figure per agent or teammate, floated over the editor's left margin at
     the line they are on. `pointer-events: none` throughout: these are a
     readout, and a sprite that swallowed a click on the gutter would be
     maddening. The transition is on transform only — animating `top` would
     make every one of them a layout pass on every keystroke. */
  .riders { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .rider {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px;
    transform: translateY(-100px);
    transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }
  .rider .who {
    font-family: var(--font-sans); font-size: 9.5px; letter-spacing: 0.05em;
    color: currentColor; opacity: 0.75; white-space: nowrap;
  }
  .rider[data-fading="true"] { opacity: 0; transition: transform 320ms, opacity 900ms; }

  .ed-note { padding: 10px 18px; font-size: 11.5px; color: var(--muted); }
  .ed-note b { font-weight: 500; color: var(--ink); }

  /* ---- agent streams --------------------------------------------------- */
  .stream {
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 14px;
  }
  .stream-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .stream-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .stream-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .dwho > span + span { margin-left: 0; }
  .stream-head .agent {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-left: auto;
  }
  .bubble {
    background: #fff9; border: 1px solid var(--line);
    border-left: 2px solid var(--who);
    padding: 8px 11px; margin-bottom: 7px;
    font-size: 13px; line-height: 1.55;
  }
  .bubble.prompt { background: var(--cerulean-soft); border-color: transparent; border-left-color: var(--who); }
  .step {
    display: grid; grid-template-columns: 78px 1fr; gap: 10px;
    align-items: baseline; padding: 2.5px 0; font-size: 12px;
  }
  .step .t { color: var(--faint); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .step .v { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .v b { font-weight: 400; color: var(--ink); }
  /* The house "working" mark. No spinners: a spinner claims progress it
     cannot measure, and this one is measured — it is on while a turn is. */
  .typing { display: inline-flex; gap: 3px; align-items: center; margin-left: 2px; }
  .typing i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--who);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.7; } }

  .idle-note { font-size: 12px; color: var(--faint); }

  /* ---- your own agent, running here ------------------------------------ */
  .newagent { display: flex; flex-direction: column; gap: 9px; padding: 4px 16px 16px; }
  .launch-controls { display: flex; gap: 8px; }
  .launch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .launch-select, .launch-model {
    font: inherit; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .launch-select { flex: 0 0 auto; }
  .launch-model { flex: 1 1 auto; min-width: 0; }
  .launch-warn { font-size: 11.5px; color: var(--alert); }
  .newagent-btn[data-danger="true"] { border-color: var(--alert); color: var(--alert); }
  .newagent-btn[data-danger="true"]:hover { background: var(--alert); color: var(--paper); }
  .posture { margin-left: 8px; font-size: 11px; color: var(--faint); }
  .posture[data-danger="true"] { color: var(--alert); }
  .newagent-btn {
    padding: 6px 13px; border: 1px solid var(--cerulean);
    color: var(--cerulean); font-size: 12.5px; border-radius: 100px;
  }
  .newagent-btn:hover { background: var(--cerulean); color: var(--paper); }
  .newagent-none { font-size: 12px; color: var(--faint); }
  .signin-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn, #a8743a); margin-left: 7px; vertical-align: middle;
  }

  .console { border-bottom: 1px solid var(--line); padding: 12px 16px 14px; background: #fff7; }
  .console-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .console-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .console-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .console { border-left: 2px solid var(--who); }
  .console-head .where { font-size: 11px; color: var(--faint); }
  .console-stop {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 100px; padding: 3px 10px;
  }
  .console-stop:hover { color: var(--alert); border-color: var(--alert); }
  .console-err { font-size: 12px; color: var(--alert); margin-bottom: 8px; }
  .console-out {
    max-height: 300px; overflow-y: auto;
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
    background: #fffb; border: 1px solid var(--line); padding: 8px 10px;
  }
  .cline { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cline[data-kind="you"]   { color: var(--cerulean); }
  .cline[data-kind="tool"]  { color: #9a5b3d; }
  .cline[data-kind="err"]   { color: var(--alert); }
  .cline[data-kind="meta"]  { color: var(--faint); }
  .console-form { margin-top: 8px; }
  .console-input {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--line); background: var(--paper);
    font: inherit; font-size: 12.5px; color: var(--ink);
  }
  .console-input:focus { outline: 2px solid var(--cerulean); outline-offset: -1px; border-color: transparent; }

  /* ---- collisions ------------------------------------------------------ */
  .collide-bar {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 9px 16px;
    background: color-mix(in srgb, var(--alert) 8%, var(--paper));
    border-bottom: 1px solid color-mix(in srgb, var(--alert) 28%, var(--line));
    font-size: 12.5px;
  }
  .collide-bar .file { color: var(--alert); }
  .collide-bar .who-list { color: var(--muted); display: flex; gap: 14px; }
  .collide-bar b { font-weight: 400; color: var(--who); }

  /* ---- file detail ----------------------------------------------------- */
  .detail-who { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 18px 14px; }
  .dwho {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 100px;
    font-size: 12.5px; background: #fff8;
  }
  .dwho .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); }
  .dwho .when { color: var(--faint); font-size: 11.5px; margin-left: 2px; }
  .detail-events { padding: 0 18px 24px; }
  .detail-events.after-code { padding-top: 16px; }
  .devent {
    display: grid; grid-template-columns: 70px 90px 74px 1fr;
    gap: 12px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .devent .dt { color: var(--faint); font-size: 11px; }
  .devent .da { color: var(--who); }
  .devent .dv { color: var(--ink); }
  .devent .dd { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the file viewer ------------------------------------------------- */
  .viewer { padding: 0 18px 20px; min-width: 0; }
  .viewer.loading, .viewer.err { color: var(--muted); font-size: 12.5px; padding: 8px 18px 20px; }
  .viewer.err { color: var(--alert); }
  .viewer .code {
    margin: 0; padding: 12px 14px;
    background: #fffb; border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 12px; line-height: 1.65;
    color: var(--ink);
    /* Scrolls sideways only. The pane it sits in already scrolls vertically,
       and two nested vertical scrollbars means the wheel does the wrong thing
       depending on where the pointer happens to be. */
    overflow-x: auto; overflow-y: hidden;
    white-space: pre;
    tab-size: 2;
  }
  .viewer-note { font-size: 11px; color: var(--faint); padding-top: 6px; }
  /* Syntax colours drawn from the same six tokens, so code does not become a
     second palette living inside the first. */
  .tok-com  { color: var(--faint); font-style: italic; }
  .tok-str  { color: #4f7a4a; }
  .tok-num  { color: #9a5b3d; }
  .tok-kw   { color: var(--cerulean); }
  .tok-fn   { color: #7a5a92; }
  .tok-attr { color: #9a5b3d; }
  .tok-tag  { color: var(--cerulean); }
  .tok-punc { color: var(--muted); }

  /* ---- empty / onboarding --------------------------------------------- */
  .blank { padding: 56px 28px; max-width: 58ch; }
  .blank h2 { font-weight: 200; font-size: 26px; letter-spacing: 0.01em; margin: 0 0 12px; }
  .blank p { color: var(--muted); margin: 0 0 12px; line-height: 1.65; }
  .blank code {
    font-family: var(--font-mono); font-size: 12px;
    background: #fff9; border: 1px solid var(--line); padding: 2px 6px;
  }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 180px 1fr; }
    .streams { display: none; }
  }
  @media (max-width: 700px) {
    .shell { grid-template-columns: 1fr; }
    .rail { display: none; }
  }
</style>
</head>
<body>
<div class="titlebar">
  <span class="wordmark">zevet</span>
  <span class="scope" id="scope"></span>
  <span class="spacer"></span>
  <span class="presence" id="presence"></span>
  <span class="conn" id="conn" data-state="init"><span class="dot"></span><span id="connText">connecting</span></span>
</div>

<div class="strip" id="strip"></div>

<div class="shell">
  <aside class="pane rail">
    <div class="pane-title">People</div>
    <div class="pane-body" id="people"></div>
    <div class="pane-title" style="border-top:1px solid var(--line)">Workspaces</div>
    <div class="ws" id="workspaces"></div>
  </aside>

  <div class="middle">
    <div class="treecol">
      <div class="pane-title" id="filesTitle">Files</div>
      <div class="pane-body"><div class="tree" id="tree"></div></div>
    </div>
    <main class="detail">
      <div id="collisions"></div>
      <div class="pane-title" id="detailTitle">Nothing selected</div>
      <div class="pane-body" id="detail"></div>
    </main>
  </div>

  <aside class="pane streams">
    <div class="pane-title">Agents</div>
    <div class="pane-body" id="streams"></div>
  </aside>
</div>

<script src="/highlight.js"></script>
<!-- The editor bundle (CodeMirror 6 + Yjs) and the agent figures. Both are
     served by the hub as static files. They are loaded unconditionally but
     used only in the desktop app: a plain browser tab has no filesystem and
     nothing to edit, and `zevetEditor` simply goes unused there. -->
<script src="/agent-sprites.js"></script>
<script src="/editor.js"></script>
<script>
(function () {
  "use strict";

  var HUES = 5;
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var IDLE_FALLBACK = 90000;

  var events = [];
  var roster = [];
  var collisions = [];
  var idleAfterMs = IDLE_FALLBACK;
  var skewMs = 0;
  var conn = "init";
  var needsToken = false;
  var selectedActor = null;
  var selectedRepo = null;
  var collapsed = Object.create(null);
  var selectedPath = null;

  /**
   * Running inside the desktop app, where there is a real filesystem.
   *
   * In a browser the tree can only be built from the paths agents have named —
   * the hub holds nothing else, by design. In the app there is a disk, so the
   * tree is the REAL folder and the team's presence is overlaid on it. Same
   * board, two levels of truth, and it says which one you are looking at
   * rather than quietly showing a partial tree as if it were the whole repo.
   */
  var LOCAL = typeof window.zevetLocal === "object" && window.zevetLocal && window.zevetLocal.available;
  var localWorkspaces = [];
  var localRoot = null;
  var localEntries = null;   // flat [{path, kind, depth}] from the app
  var localFile = null;      // { path, text, truncated } for the viewer
  var localError = null;
  var localAgents = [];          // which CLIs this machine has

  /**
   * ---- the IDE ----------------------------------------------------------
   *
   * Three capabilities, each independently absent, and the UI degrades one
   * step at a time rather than all at once:
   *
   *   LOCAL      a filesystem. Without it (a plain browser tab) there is no
   *              tree of real files, no contents, and nothing to edit.
   *   CAN_WRITE  `zevetLocal.write`. Without it the editor is read-only.
   *   CAN_SHARE  `zevetDoc`. Without it the editor is a solo editor: it still
   *              opens, edits and saves your own file, it just has no peers.
   *
   * Checked as capabilities rather than as a version number because that is
   * what actually determines whether a call will work, and because the board
   * page and the desktop app update independently of each other — a board
   * served by a new hub can find itself inside an old app.
   */
  var CAN_WRITE = LOCAL && typeof window.zevetLocal.write === "function";
  /**
   * Who this machine is, for the name on a remote cursor and its flag.
   *
   * It comes from the app's own config, not from the hub, and the call that
   * provides it is REDACTED: `zevet:config` returns the hub URL and the actor
   * and deliberately withholds the master secret, because this window's page is
   * served BY the hub and anything the page can read the hub can ask for. See
   * the comment on that handler in desktop/main.js.
   *
   * Absent until the call comes back, and absent forever in a browser tab. Both
   * are handled by falling back to "me", which is honest -- a board with no app
   * behind it genuinely does not know who is looking at it.
   */
  var myActor = null;
  var CAN_SHARE =
    typeof window.zevetDoc === "object" && window.zevetDoc && window.zevetDoc.available &&
    typeof window.zevetEditor === "object" && window.zevetEditor;

  if (LOCAL && window.zevet && typeof window.zevet.config === "function") {
    window.zevet.config().then(function (c) {
      if (c && c.actor) { myActor = c.actor; render(); }
    }, function () { /* no config: the cursor flag says "me" and nothing breaks */ });
  }

  /**
   * Line counts and diff badges for the tree, refreshed on a leading-edge
   * debounce.
   *
   * Leading edge matters: the first paint after opening a workspace should
   * carry numbers, and a trailing-only debounce leaves the tree blank for its
   * whole window. `pending` collapses the storm of calls that a burst of
   * events would otherwise cause.
   */
  var stats = { lines: Object.create(null), diff: null, root: null };
  var statsAt = 0;
  var statsPending = false;
  var STATS_EVERY_MS = 2500;
  /** A ceiling on what we ask to be counted. The main process caps this too;
   *  asking for less than the cap keeps the answer quick rather than merely
   *  legal. */
  var STATS_MAX_PATHS = 1200;

  function refreshStats(force) {
    if (!LOCAL || !localRoot || typeof window.zevetLocal.stats !== "function") return;
    if (!localEntries) return;
    var now = Date.now();
    if (!force && now - statsAt < STATS_EVERY_MS) {
      if (!statsPending) {
        statsPending = true;
        setTimeout(function () { statsPending = false; refreshStats(true); }, STATS_EVERY_MS);
      }
      return;
    }
    statsAt = now;
    var root = localRoot;
    var paths = [];
    for (var i = 0; i < localEntries.length && paths.length < STATS_MAX_PATHS; i++) {
      if (localEntries[i].kind !== "dir") paths.push(localEntries[i].path);
    }
    window.zevetLocal.stats(root, paths).then(function (r) {
      // The workspace may have been switched while this was in flight. Dropping
      // a stale answer is the difference between "the numbers lag" and "the
      // numbers are from another repo", and only one of those is survivable.
      if (root !== localRoot) return;
      if (!r || !r.ok) return;
      stats = { lines: r.lines || Object.create(null), diff: r.diff || null, root: root };
      render();
    }, function () { /* a failed count is not worth a message; the badges are simply absent */ });
  }

  /** The badge for one file row, or null when there is nothing to say. */
  function statBadge(path) {
    if (!LOCAL || stats.root !== localRoot) return null;
    var lines = stats.lines[path];
    var d = stats.diff && stats.diff[path];
    if (lines == null && !d) return null;

    var box = el("span", "stat");
    if (d && d.status === "untracked") {
      // A new file has no "added" count from git diff -- it is absent from the
      // diff entirely -- so its length IS the addition. Saying "new" rather
      // than "+412" is both true and more useful.
      box.appendChild(tx(el("span", "new"), "new"));
    } else if (d) {
      if (d.added == null && d.removed == null) {
        box.appendChild(tx(el("span", "new"), "bin"));
      } else {
        if (d.added) box.appendChild(tx(el("span", "add"), "+" + d.added));
        if (d.removed) box.appendChild(tx(el("span", "del"), "−" + d.removed));
      }
    }
    if (lines != null) box.appendChild(tx(el("span", "loc"), String(lines)));
    return box.childNodes.length ? box : null;
  }

  /**
   * Consoles started from THIS machine — plural, deliberately.
   *
   * It held one. Watching several agents work at once is the entire point of
   * the product, and a surface that can only show your own one agent while
   * showing three of everyone else's was telling on itself.
   */
  var myConsoles = [];
  var launchModel = "";          // blank means "whatever the CLI defaults to"
  var launchMode = "auto";

  /**
   * The postures zevet offers, in the order they escalate.
   *
   * The labels are zevet's; the flags behind them are each CLI's own, read off
   * --help rather than remembered, and they differ per agent (claude has a
   * plan mode, codex does not and falls back to a read-only sandbox). Keeping
   * the vocabulary here and the flags in agent-console.js means the UI cannot
   * drift into offering a mode the module does not implement.
   */
  var MODES = [
    { id: "plan", label: "Plan only" },
    { id: "ask", label: "Ask first" },
    { id: "auto", label: "Auto" },
    { id: "dangerous", label: "Skip permissions" },
  ];

  /** Model aliases each CLI accepts. Free text wins; these are a shortcut. */
  var MODELS = {
    claude: ["", "opus", "sonnet", "haiku"],
    codex: ["", "gpt-5", "gpt-5-codex", "o3"],
  };

  function $(id) { return document.getElementById(id); }
  function el(t, c) { var n = document.createElement(t); if (c) n.className = c; return n; }
  function tx(n, s) { n.textContent = s == null ? "" : String(s); return n; }
  function serverNow() { return Date.now() + skewMs; }

  function hueOf(actor) {
    var i = roster.findIndex(function (r) { return r.actor === actor; });
    return "var(--who-" + ((i < 0 ? 0 : i) % HUES) + ")";
  }
  /**
   * A relative-time label that can be refreshed without rebuilding the DOM.
   *
   * The board used to re-render everything once a second, purely so "3s ago"
   * stayed true. That threw away text selection mid-drag, made every click a
   * race against the next tick, and rebuilt a file tree nobody had touched.
   * Now the timer only rewrites elements carrying data-ago, and a full render
   * happens when the DATA changes.
   */
  function agoEl(node, ts) {
    node.dataset.ago = String(ts);
    tx(node, ago(serverNow() - ts) + " ago");
    return node;
  }

  function tickAgo() {
    var now = serverNow();
    document.querySelectorAll("[data-ago]").forEach(function (n) {
      tx(n, ago(now - Number(n.dataset.ago)) + " ago");
    });
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m";
    return Math.round(m / 60) + "h";
  }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString([], { hour12: false }); }
  function verbFor(e) {
    if (e.kind === "prompt") return "asked";
    if (e.kind === "turn_end") return "finished";
    return e.tool || "working";
  }
  function isIdle(r, now) { return now - r.lastTs > idleAfterMs; }

  /** Events for the workspace currently being looked at. */
  function scoped() {
    return events.filter(function (e) { return !selectedRepo || e.repo === selectedRepo; });
  }

  // ---- data -------------------------------------------------------------

  function applySnapshot(s) {
    if (typeof s.now === "number") skewMs = s.now - Date.now();
    roster = s.roster || [];
    collisions = s.collisions || [];
    idleAfterMs = s.idleAfterMs || IDLE_FALLBACK;
    events = s.events || [];
    if (!selectedRepo) selectedRepo = lastRepo();
    render();
  }

  function pushEvent(e) {
    events.push(e);
    if (events.length > 900) events.shift();
    if (!roster.some(function (r) { return r.actor === e.actor; })) {
      roster = roster.concat([{ actor: e.actor, lastTs: e.ts, lastEvent: e }]);
      roster.sort(function (a, b) { return a.actor.localeCompare(b.actor); });
    }
    var r = roster.find(function (x) { return x.actor === e.actor; });
    if (r) { r.lastTs = e.ts; r.lastEvent = e; }
    if (!selectedRepo) selectedRepo = e.repo || null;
    render();
  }

  function lastRepo() {
    for (var i = events.length - 1; i >= 0; i--) if (events[i].repo) return events[i].repo;
    return null;
  }

  function workspaces() {
    var seen = [];
    events.forEach(function (e) {
      if (!e.repo) return;
      var hit = seen.find(function (w) { return w.repo === e.repo; });
      if (!hit) seen.push({ repo: e.repo, branch: e.branch, lastTs: e.ts });
      else { hit.lastTs = Math.max(hit.lastTs, e.ts); if (e.branch) hit.branch = e.branch; }
    });
    return seen.sort(function (a, b) { return b.lastTs - a.lastTs; });
  }

  /**
   * The file tree, built from what people have actually touched.
   *
   * This is the multiplayer view the activity log could not be: a folder
   * structure with WHO is in it, rather than a list of what happened. It is
   * built from observed paths rather than a directory listing on purpose —
   * the hub never receives anyone's files, only the paths their agents named,
   * so this shows exactly the part of the tree the team is working in and
   * nothing else.
   */
  function blankNode(name, kind) {
    return { name: name, kind: kind, children: Object.create(null), who: Object.create(null), lastTs: 0 };
  }

  function buildTree() {
    var now = serverNow();
    var root = blankNode("", "dir");

    // In the app, start from the real directory listing so the tree is the
    // whole workspace rather than only the touched corner of it.
    if (LOCAL && localEntries) {
      localEntries.forEach(function (entry) {
        var parts = String(entry.path).split("/").filter(Boolean);
        var node = root;
        parts.forEach(function (part, i) {
          var isLast = i === parts.length - 1;
          var kind = isLast ? entry.kind : "dir";
          if (!node.children[part]) node.children[part] = blankNode(part, kind);
          node = node.children[part];
        });
      });
    }

    scoped().forEach(function (e) {
      if (!e.target || e.kind !== "tool") return;
      var parts = String(e.target).split("/").filter(Boolean);
      var node = root;
      parts.forEach(function (part, i) {
        var isFile = i === parts.length - 1;
        if (!node.children[part]) node.children[part] = blankNode(part, isFile ? "file" : "dir");
        node = node.children[part];
        var prev = node.who[e.actor] || 0;
        if (e.ts > prev) node.who[e.actor] = e.ts;
        node.lastTs = Math.max(node.lastTs, e.ts);
      });
    });
    return { root: root, now: now };
  }

  function collisionSet() {
    var s = Object.create(null);
    collisions.forEach(function (c) {
      if (selectedRepo && c.repo && c.repo !== selectedRepo) return;
      s[c.target] = true;
    });
    return s;
  }

  // ---- render ------------------------------------------------------------

  function renderPresence(now) {
    var host = $("presence");
    host.textContent = "";
    roster.forEach(function (r) {
      var b = el("button", "chip");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.active = String(!isIdle(r, now));
      b.dataset.dim = String(Boolean(selectedActor) && selectedActor !== r.actor);
      b.appendChild(el("span", "bead"));
      b.appendChild(tx(el("span"), r.actor));
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
  }

  function renderPeople(now) {
    var host = $("people");
    host.textContent = "";
    roster.forEach(function (r) {
      var idle = isIdle(r, now);
      var b = el("button", "person");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.idle = String(idle);
      b.dataset.sel = String(selectedActor === r.actor);
      b.appendChild(el("span", "bead"));
      var col = el("span");
      col.appendChild(tx(el("span", "nm"), r.actor));
      var sub = el("span", "sub");
      var last = r.lastEvent;
      if (idle) tx(sub, "idle " + ago(now - r.lastTs));
      else if (last) {
        var v = el("span", "verb");
        tx(v, verbFor(last));
        sub.appendChild(v);
        sub.appendChild(document.createTextNode("  " + folderOf(last)));
      }
      col.appendChild(sub);
      b.appendChild(col);
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
    if (!roster.length) {
      var p = el("div");
      p.style.cssText = "padding:14px 16px;color:var(--faint);font-size:12.5px";
      tx(p, "nobody yet");
      host.appendChild(p);
    }
  }

  /** The folder a teammate is working in — the thing you want at a glance. */
  function folderOf(e) {
    if (!e || !e.target) return e && e.detail ? String(e.detail).slice(0, 40) : "";
    var parts = String(e.target).split("/");
    parts.pop();
    return parts.length ? parts.join("/") + "/" : "./";
  }

  function refreshLocalWorkspaces() {
    if (!LOCAL) return Promise.resolve();
    return window.zevetLocal.workspaces().then(function (list) {
      localWorkspaces = list || [];
      render();
    });
  }

  function openLocalRoot(dir) {
    if (!LOCAL) return;
    closeEditor();
    // Dropped, not left to be overwritten: badges from the previous repo
    // beside this one's filenames would be worse than no badges at all.
    stats = { lines: Object.create(null), diff: null, root: null };
    localRoot = dir;
    localEntries = null;
    localFile = null;
    localError = null;
    selectedPath = null;
    render();
    window.zevetLocal.tree(dir).then(function (r) {
      if (r && r.ok) {
        localEntries = r.entries;
        localError = r.truncated ? "showing the first " + r.entries.length + " entries" : null;
      } else {
        localEntries = [];
        localError = (r && r.error) || "could not read that folder";
      }
      render();
      // Counting lines means reading files, so it happens after the tree is
      // already on screen. The badges arriving a moment later is the right
      // trade: a tree that appears instantly and fills in beats one that waits.
      refreshStats(true);
    });
  }

  function openLocalFile(relPath) {
    if (!LOCAL || !localRoot) return;
    localFile = { path: relPath, text: null, loading: true };
    render();
    window.zevetLocal.read(localRoot, relPath).then(function (r) {
      localFile = r && r.ok
        ? { path: relPath, text: r.text, truncated: r.truncated, bytes: r.bytes }
        : { path: relPath, error: (r && r.error) || "could not read it" };
      render();
    });
  }

  // ---- running an agent from here --------------------------------------

  function refreshLocalAgents() {
    if (!LOCAL) return;
    window.zevetLocal.agents().then(function (list) {
      localAgents = list || [];
      render();
    });
  }

  var consoleSeq = 0;

  function startAgent(name) {
    if (!LOCAL || !localRoot) return;
    var c = {
      key: ++consoleSeq,
      id: null,
      agent: name,
      lines: [],
      running: true,
      error: null,
      mode: launchMode,
      model: launchModel,
      root: localRoot,
      hue: myConsoles.length % 5,
    };
    myConsoles.push(c);
    render();
    window.zevetLocal.startAgent(name, localRoot, { model: launchModel, mode: launchMode }).then(function (r) {
      if (!r || !r.ok) {
        c.running = false;
        c.error = (r && r.error) || "could not start";
      } else {
        c.id = r.id;
      }
      render();
    });
  }

  function consoleById(id) {
    // A console that has not been told its id yet is the one that just started,
    // so unclaimed events belong to it. Without this the first few lines of
    // every run vanish into a console nobody can find.
    return myConsoles.find(function (c) { return c.id === id; }) || myConsoles.find(function (c) { return c.id === null; });
  }

  function pushConsoleLine(c, kind, text) {
    if (!c) return;
    c.lines.push({ kind: kind, text: String(text) });
    // A console that grows without bound is a memory leak with a scrollbar.
    if (c.lines.length > 400) c.lines.splice(0, c.lines.length - 400);
  }

  if (LOCAL) {
    window.zevetLocal.onAgentEvent(function (evt) {
      // ⚠️ THE STRIP READS THE USAGE BEFORE THE CONSOLE LOOKUP, and the order
      // matters. Below this, an event for a console the board is not tracking
      // is dropped -- which is right for the console panel and wrong for the
      // strip. Reload the board and `myConsoles` is empty while the agents it
      // started are still running and still sending; the panel cannot show
      // those, but the tokens they are spending are still being spent.
      if (evt.type === "agent") noteAgentPayload(evt.payload);

      var c = consoleById(evt.id);
      if (!c) return;
      if (evt.type === "exit") {
        c.running = false;
        pushConsoleLine(c, "meta", "agent exited (" + (evt.code === null ? "signal " + evt.signal : "code " + evt.code) + ")");
      } else if (evt.type === "stderr") {
        pushConsoleLine(c, "err", evt.text || "");
      } else if (evt.type === "agent") {
        // Claude's stream-json. Show the parts a person reads, not the envelope.
        // (The usage on this same line was already read, above.)
        var p = evt.payload || {};
        if (p.type === "assistant" && p.message && Array.isArray(p.message.content)) {
          p.message.content.forEach(function (part) {
            if (part.type === "text" && part.text) pushConsoleLine(c, "out", part.text);
            if (part.type === "tool_use") pushConsoleLine(c, "tool", part.name + "  " + shortInput(part.input));
          });
        } else if (p.type === "result") {
          pushConsoleLine(c, "meta", "turn finished (" + (p.terminal_reason || p.subtype || "done") + ")");
        }
      } else if (evt.type === "stdout-line") {
        pushConsoleLine(c, "out", evt.text || "");
      }
      render();
    });
  }

  /**
   * What a tool call is about, said the way the rest of the board says it.
   *
   * Found by watching a real agent run in here: the console printed
   * `C:\dev\GitHub\zevet\hub\server.mjs` while the tree two panes to the
   * left said `hub/server.mjs`. Same file, two spellings, and the long one
   * pushed everything else out of a 340px column. The hook already
   * relativises paths before sending them to the hub; this is the same rule
   * applied to output that never goes near the hub.
   */
  function shortInput(input) {
    if (!input || typeof input !== "object") return "";
    var v = input.file_path || input.path || input.notebook_path || input.command || input.pattern || "";
    var text = String(v);
    if (localRoot) {
      var norm = text.split("\\").join("/");
      var root = localRoot.split("\\").join("/").replace(/\/+$/, "");
      if (norm.toLowerCase().indexOf(root.toLowerCase() + "/") === 0) {
        text = norm.slice(root.length + 1);
      }
    }
    return text.slice(0, 90);
  }

  function renderWorkspaces() {
    var host = $("workspaces");
    host.textContent = "";

    if (LOCAL) {
      localWorkspaces.forEach(function (w) {
        var b = el("button", "ws-item");
        b.dataset.sel = String(localRoot === w.dir);
        b.appendChild(tx(el("span"), w.name));
        b.appendChild(document.createElement("br"));

  /* ======================================================================
   * THE STATUS STRIP
   *
   * Andrew asked for "all of the elements in my statusline, but built into the
   * zevet UI" (2026-09-18). The original is ~/.claude/statusline.py. Its nine
   * segments land here in three groups:
   *
   *   FROM THE AGENT STREAM, live, with no polling: model, context tokens,
   *   cache hit rate, cost. zevet already receives every stream-json line from
   *   the agents it launches -- `onAgentEvent` hands them over as
   *   {type:"agent", payload} -- and until now threw the usage away.
   *
   *   FROM THE MACHINE, on a timer: the vault graph, the code index probe, the
   *   repo's branch and ahead/behind, and zevet's own hook health. Those come
   *   over `zevetLocal.status()`.
   *
   *   NOT AT ALL: the 5h and 7d rate-limit windows. They reach statusline.py
   *   because Claude Code hands them to the status line command in its payload;
   *   a headless agent's stream-json does not carry them, and there is nowhere
   *   else to get them. What is shown instead is "spent", zevet's own count of
   *   what the agents IT started have used. ⚠️ THAT IS NOT THE RATE LIMIT and
   *   must never be labelled as one -- see desktop/status-sources.js, which
   *   says the same thing twice because it matters.
   *
   * ⚠️ THE USAGE RULES ARE DUPLICATED, deliberately and in exactly two places:
   * here, for live display, and in desktop/status-sources.js, for the rolling
   * windows the main process keeps. They must agree. If you change what counts
   * as "context" in one, change it in the other -- and the rule is INPUT PLUS
   * BOTH CACHE FIELDS AND NOT OUTPUT, because this turn's output is already
   * inside next turn's input and adding it double-counts. statusline.py carries
   * a comment about having made that mistake; this is the second and third
   * place it could be made again.
   * ====================================================================== */

  var live = { model: null, context: 0, cacheHit: null, cost: null };
  var machine = null;          // the answer from zevetLocal.status(), or null
  var STATUS_EVERY_MS = 4000;

  /** The usage on one stream-json line, or null. See the warning above. */
  function usageOf(payload) {
    if (!payload || typeof payload !== "object") return null;
    var u = (payload.message && payload.message.usage) || payload.usage || null;
    if (!u || typeof u !== "object") return null;
    var n = function (v) { return typeof v === "number" && isFinite(v) ? v : 0; };
    var read = n(u.cache_read_input_tokens);
    var context = n(u.input_tokens) + read + n(u.cache_creation_input_tokens);
    if (!context && !n(u.output_tokens)) return null;
    return {
      context: context,
      // Null, not zero, when there was no input at all: "no data" and "nothing
      // was cached" are opposite readings, and one of them means this turn is
      // being paid for at full rate.
      cacheHit: context > 0 ? (read / context) * 100 : null,
      model: (payload.message && payload.message.model) || payload.model || null,
    };
  }

  /** Fold one agent event into the live figures. Called from onAgentEvent. */
  function noteAgentPayload(payload) {
    if (!payload) return;
    if (payload.type === "system" && typeof payload.model === "string") live.model = payload.model;
    var u = usageOf(payload);
    if (u) {
      live.context = u.context;
      if (u.cacheHit != null) live.cacheHit = u.cacheHit;
      if (u.model) live.model = u.model;
    }
    // total_cost_usd is a RUNNING SESSION TOTAL, reported on the result line.
    // It replaces; summing it multiplies the bill by the number of turns.
    if (typeof payload.total_cost_usd === "number") live.cost = payload.total_cost_usd;
    renderStrip();
  }

  function pollStatus() {
    if (!LOCAL || typeof window.zevetLocal.status !== "function") return;
    window.zevetLocal.status().then(function (r) {

    }, function () { /* a status probe that fails simply shows nothing */ });
  }

  /** Eight steps of block, the same device statusline.py uses. */
  var BLOCKS = "\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588";
  function bar(pct, width) {

   *  not widen as the number grows. */
  function tokens(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";

  }

  /** Colour on ABSOLUTE size, not on a share of the window: cost scales with

  function renderStrip() {
    var host = $("strip");

    if (live.model) segs.push(seg([span("dim", live.model)]));

    if (repo && repo.branch) {

      if (repo.sha) r.push(span("dim", "@" + repo.sha));

      // all. Zeros mean in step and are worth showing, quietly.
      if (repo.ahead) r.push(span("warn", "\u2191" + repo.ahead));
      if (repo.behind) r.push(span("warn", "\u2193" + repo.behind));

        // and not 30, which is what it was and which drew 197k as one block out
        // of eight.
        span("bar " + c, bar(Math.min(100, k / 3))),

    // process is keeping one; the current session's own figure otherwise. The
    // rolling one is the more useful of the two and the only one that survives
    // a console being closed.
    var cost = burn && typeof burn.cost === "number" && burn.cost > 0 ? burn.cost : live.cost;

      // staleness, then sync. Two readouts of one system that disagree about
      // which problem matters most are worse than one readout.
      var cls = g.state === "errors" ? "bad" : g.state === "ok" ? "ok" : "warn";

        if (g.head) gs.push(span("dim", g.head + (g.detail ? " " + g.detail : "")));

      // so a broken hook silently does nothing indefinitely. Only recent
      // failures are shown: an old log is history, not a problem.
      segs.push(seg([span("bad", "hook fail"), span("dim", hook.failedAgo)]));
    }

    host.textContent = "";
    segs.forEach(function (n, i) {
      if (i) host.appendChild(span("sep", "|"));
      host.appendChild(n);
    });

  /* ======================================================================
   * THE EDITOR
   *
   * One file at a time, opened from the tree. The document lives in a Y.Doc;
   * CodeMirror is bound to it; the main process carries sealed updates to and
   * from the hub. Disk stays the source of truth in the sense that matters:
   * everything typed here is written back to the file, and everything an agent
   * writes to the file is folded back into here.
   *
   * WARNING: THE ROOM NAME MUST BE IDENTICAL ON EVERY MACHINE, or two people
   * editing the same file sit in two different rooms and never see each other.
   * It is `<repo>:<repo-relative path>`, both of which the hook already
   * normalises for exactly this reason (see the note in client/hook.mjs about
   * Andrew's `C:\dev\masora\src\db.ts` and Kai's
   * `/Users/kai/code/masora/src/db.ts` being the same file). The repo name
   * comes from the event stream when there is one and from the folder name
   * when there is not, and THOSE TWO CAN DISAGREE -- a teammate who cloned
   * into a differently-named directory lands in a different room and sees an
   * empty file with nobody in it. Not fixed here. The fix is for the hook to
   * publish a repo identity that everyone derives the same way.
   * ====================================================================== */

  var ed = null;                          // the open editor, or null

   *  client; changing it orphans every document already in a room. */
  var Y_TEXT = "content";

  /**
   * WARNING: A FIXED CLIENT ID FOR SEEDING, AND IT IS LOAD-BEARING.
   *
   * When a room is empty, somebody has to put the file's contents into it. If
   * two people open the same fresh file at the same moment, both find it empty
   * and both seed -- and because Yjs inserts are not idempotent, the room ends
   * up holding the file TWICE. Which then gets written to everyone's disk.
   *
   * Yjs deduplicates by (clientID, clock). So the seed is produced in a
   * throwaway doc whose clientID is this constant, which makes two independent
   * seeds of the same text byte-identical and therefore one operation after
   * the merge rather than two.
   *
   * The remaining hole, stated plainly: if the two machines' copies of the file
   * DIFFER, the two seeds collide on (clientID, clock) carrying different
   * content and one of them silently wins. That is a bad outcome. It is a far
   * better one than the document containing both copies concatenated, which is
   * what happens without this. The real fix is an acknowledgement from the hub
   * that a replay is complete, so a client can tell "this room is empty" from
   * "this room has not finished talking to me"; hub/server.mjs deliberately has
   * no such ack, and its own notes say so.
   */

  /**
   * How long to wait after joining before deciding a room is empty.
   *
   * There is no "replay finished" message, so a timer is the only signal
   * available. Too short and two people seed; too long and opening a file feels
   * broken. 500ms is informed by nothing but loopback latency and is the first
   * number to change when this misbehaves on a real network.
   */
  var SEED_GRACE_MS = 500;

  /** Saving is debounced, so a burst of keystrokes is one write and not forty. */
  var SAVE_AFTER_MS = 700;

  function roomFor(root, relPath) {
    var repo = selectedRepo;
    if (!repo && root) repo = String(root).replace(/[\\/]+$/, "").split(/[\\/]/).pop();
    return (repo || "repo") + ":" + relPath;
  }

  function closeEditor() {
    if (!ed) return;
    var e = ed;
    ed = null;
    clearTimeout(e.saveTimer);
    clearTimeout(e.seedTimer);
    (e.unsub || []).forEach(function (fn) { try { fn(); } catch (err) { /* already detached */ } });
    if (e.watching && typeof window.zevetLocal.unwatch === "function") {
      try { window.zevetLocal.unwatch(e.root, e.relPath); } catch (err) { /* nothing to undo */ }
    }
    if (CAN_SHARE && e.room) { try { window.zevetDoc.leave(e.room); } catch (err) { /* ditto */ } }
    if (e.destroyView) { try { e.destroyView(); } catch (err) { /* ditto */ } }
    if (e.ydoc) { try { e.ydoc.destroy(); } catch (err) { /* ditto */ } }
  }

  /**
   * Open `relPath` for editing.
   *
   * The read comes first and always. With no peers and no write capability
   * this still shows the file, which is exactly what the board did before there
   * was an editor at all -- the feature degrades to the thing it replaced.
   */

    var root = localRoot;

      // dominant line ending precisely so that a round trip does not rewrite a
      // file nobody edited.

      mine.loading = false;

    // caps at 512 KiB; sharing the first half of a file and then writing that
    // back would delete the rest of it, on every machine at once.

    if (shareable) {
      e.ydoc = new E.Y.Doc();
      e.awareness = new E.Awareness(e.ydoc);
      e.awareness.setLocalStateField("user", {
        name: myActor || "me",
        color: cssColour(hueOf(myActor)),

    }

    var handle = E.createEditor({
      parent: host,
      doc: shareable ? e.ydoc : null,
      awareness: shareable ? e.awareness : null,
      text: shareable ? "" : (e.text || ""),
      language: E.languageForPath(e.relPath),
      readOnly: !CAN_WRITE || Boolean(e.truncated),
      onChange: function () { onLocalEdit(e); },
    });
    e.view = handle.view;
    e.getText = handle.getText;
    e.setText = handle.setText;
    e.destroyView = handle.destroy;

    // Solo: the disk text went straight in, because there is no room whose
    // contents might already be the authoritative ones.

    watchFile(e);

    if (e.awareness) {
      var onAware = function () { if (ed === e) drawRiders(e); };
      e.awareness.on("change", onAware);
      e.unsub.push(function () { e.awareness.off("change", onAware); });
    }
    if (e.view) {

      // move when it scrolls. A scroll listener rather than a CodeMirror plugin
      // because this is chrome drawn over the editor, not part of its document.
      var sc = e.view.scrollDOM;
      var onScroll = function () { drawRiders(e); };

      e.unsub.push(function () { sc.removeEventListener("scroll", onScroll); });

  /** `hueOf` returns `var(--who-N)`; an awareness payload has to carry a real
   *  colour, because y-codemirror.next writes it into an inline style. */
  function cssColour(varExpr) {
    var m = /^var\((--[a-z0-9-]+)\)$/.exec(String(varExpr));

    e.unsub.push(window.zevetDoc.onMessage(function (m) {
      if (!ed || ed !== e || m.room !== e.room) return;

        // about anything edited here while the socket was down.

        clearTimeout(e.seedTimer);

      } else if (m.kind === "update" && m.bytes) {

        // echoed straight back out by the local-update handler below.

      }
    }));

    e.unsub.push(window.zevetDoc.onStatus(function (st) {
      docStatus[st.room] = { state: st.state, detail: st.detail };
      if (ed === e && st.room === e.room) render();
    }));

    var onUpdate = function (update, origin) {
      if (origin === "remote") return;
      window.zevetDoc.send(e.room, update);
