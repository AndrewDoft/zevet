<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eae7e2'/%3E%3Ccircle cx='4.5' cy='8' r='2' fill='%232f6f8f'/%3E%3Ccircle cx='9.5' cy='5' r='1.6' fill='%239a5b3d'/%3E%3Ccircle cx='10.5' cy='11' r='1.6' fill='%234f7a4a'/%3E%3C/svg%3E" />
<style>
  /* Type: Jost, at 200 and 300 only.
     The landing page's own rule, quoted from its layout.tsx: "ONE FAMILY
     CARRIES THE WHOLE SITE. Jost, a Futura-line geometric, set at 200 and 300
     only. Hierarchy comes from size, tracking and air — never from weight, and
     never from a second face." Mono is for paths and commands, which are data,
     not prose. Self-hosted: a workspace that blanks its own labels because a
     CDN is slow has stopped being a workspace. */
  @font-face {
    font-family: "Jost";
    src: url("/fonts/jost-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: light;

    /* From masora-landing/src/app/globals.css, unchanged. */
    --paper: #eae7e2;
    --ink: #2c2f44;
    --muted: #5f6274;
    --faint: #9c9992;
    --line: #cfccc6;
    --fill: #dbdae1;

    /* The one addition. The landing page defines no accent at all — six
       tokens, no colour beyond the ink. Cerulean is chosen to sit beside
       #2c2f44 rather than argue with it: same blue family, more saturation,
       enough darker than the eggshell to hold small text. */
    --cerulean: #2f6f8f;
    --cerulean-soft: #d9e4ea;
    --alert: #a8442f;

    /* Identity, and it has to work on a LIGHT ground: these are mid-dark and
       muted, not the bright hues a dark board can afford. Andrew gets the
       house cerulean. */
    --who-0: #2f6f8f;
    --who-1: #9a5b3d;
    --who-2: #4f7a4a;
    --who-3: #7a5a92;
    --who-4: #a8743a;

    --rail: 224px;
    --tree: 286px;
    --streams: 340px;

    --font-sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cerulean); outline-offset: 2px; }

  /* ---- title bar ---------------------------------------------------- */
  .titlebar {
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px; height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .wordmark { font-weight: 200; font-size: 19px; letter-spacing: 0.16em; text-transform: lowercase; }
  .scope { color: var(--muted); font-size: 12.5px; letter-spacing: 0.02em; }
  .spacer { flex: 1 1 auto; }

  .presence { display: flex; align-items: center; gap: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 9px; border-radius: 100px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid transparent;
  }
  .chip[data-active="true"] { color: var(--ink); border-color: var(--line); background: #fff8; }
  .chip .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .chip[data-active="false"] .bead { opacity: 0.32; }
  .chip[data-dim="true"] { opacity: 0.5; }

  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .conn[data-state="live"] .dot { background: #4f7a4a; }
  .conn[data-state="down"] .dot { background: var(--alert); }

  /* ---- shell ---------------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: var(--rail) 1fr var(--streams);
    min-height: 0;
  }
  .middle { display: grid; grid-template-columns: var(--tree) 1fr; min-height: 0; min-width: 0; }
  .treecol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .rail { border-right: 1px solid var(--line); }
  .streams { border-left: 1px solid var(--line); }

  .pane-title {
    padding: 15px 16px 9px;
    font-size: 10.5px; font-weight: 300;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* ---- people rail ---------------------------------------------------- */
  .person {
    display: grid; grid-template-columns: 10px 1fr; gap: 10px;
    align-items: start;
    width: 100%; text-align: left;
    padding: 9px 16px;
    border-left: 2px solid transparent;
  }
  .person:hover { background: #fff6; }
  .person[data-sel="true"] { background: #fff9; border-left-color: var(--who); }
  .person .bead { width: 9px; height: 9px; border-radius: 50%; background: var(--who); margin-top: 5px; }
  .person[data-idle="true"] .bead { opacity: 0.3; }
  .person .nm { display: block; font-size: 13.5px; letter-spacing: 0.01em; }
  .person[data-idle="true"] .nm { color: var(--muted); }
  .person .sub {
    display: block;
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person .sub .verb { margin-right: 6px; }
  .person .sub .verb { color: var(--ink); }

  .ws { padding: 6px 16px 10px; }
  .ws-item {
    display: block; width: 100%; text-align: left;
    padding: 6px 0; font-size: 13px; color: var(--muted);
  }
  .ws-item[data-sel="true"] { color: var(--ink); }
  .ws-item .branch { font-size: 11px; color: var(--faint); }

  .ws-add {
    display: block; width: 100%; text-align: left;
    padding: 8px 0 2px; font-size: 12.5px; color: var(--cerulean);
  }
  .ws-note { font-size: 11px; color: var(--faint); padding-top: 6px; }

  /* ---- file tree ------------------------------------------------------ */
  .tree { padding: 2px 0 20px; }
  .node {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 3px 16px 3px 0;
    font-size: 13px;
  }
  .node[data-sel="true"] { background: var(--cerulean-soft); }
  .node:hover { background: #fff7; }
  .node .label { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; }
  .node .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node[data-kind="dir"] .name { color: var(--ink); }
  .node[data-kind="file"] .name { color: var(--muted); }
  .node[data-touched="true"][data-kind="file"] .name { color: var(--ink); }
  .caret { width: 9px; color: var(--faint); flex: none; font-size: 9px; }
  .ficon { width: 13px; height: 13px; flex: none; opacity: 0.55; }

  .marks { display: flex; align-items: center; gap: 3px; flex: none; }
  .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--who); }
  .mark[data-stale="true"] { opacity: 0.28; }
  .node[data-collide="true"] { background: color-mix(in srgb, var(--alert) 9%, transparent); }
  .node[data-collide="true"] .name { color: var(--alert); }

  .empty-tree { padding: 30px 18px; color: var(--muted); font-size: 13px; max-width: 46ch; }

  /* ---- agent streams --------------------------------------------------- */
  .stream {
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 14px;
  }
  .stream-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .stream-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .stream-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .dwho > span + span { margin-left: 0; }
  .stream-head .agent {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-left: auto;
  }
  .bubble {
    background: #fff9; border: 1px solid var(--line);
    border-left: 2px solid var(--who);
    padding: 8px 11px; margin-bottom: 7px;
    font-size: 13px; line-height: 1.55;
  }
  .bubble.prompt { background: var(--cerulean-soft); border-color: transparent; border-left-color: var(--who); }
  .step {
    display: grid; grid-template-columns: 78px 1fr; gap: 10px;
    align-items: baseline; padding: 2.5px 0; font-size: 12px;
  }
  .step .t { color: var(--faint); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .step .v { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .v b { font-weight: 400; color: var(--ink); }
  /* The house "working" mark. No spinners: a spinner claims progress it
     cannot measure, and this one is measured — it is on while a turn is. */
  .typing { display: inline-flex; gap: 3px; align-items: center; margin-left: 2px; }
  .typing i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--who);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.7; } }

  .idle-note { font-size: 12px; color: var(--faint); }

  /* ---- your own agent, running here ------------------------------------ */
  .newagent { display: flex; flex-direction: column; gap: 9px; padding: 4px 16px 16px; }
  .launch-controls { display: flex; gap: 8px; }
  .launch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .launch-select, .launch-model {
    font: inherit; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .launch-select { flex: 0 0 auto; }
  .launch-model { flex: 1 1 auto; min-width: 0; }
  .launch-warn { font-size: 11.5px; color: var(--alert); }
  .newagent-btn[data-danger="true"] { border-color: var(--alert); color: var(--alert); }
  .newagent-btn[data-danger="true"]:hover { background: var(--alert); color: var(--paper); }
  .posture { margin-left: 8px; font-size: 11px; color: var(--faint); }
  .posture[data-danger="true"] { color: var(--alert); }
  .newagent-btn {
    padding: 6px 13px; border: 1px solid var(--cerulean);
    color: var(--cerulean); font-size: 12.5px; border-radius: 100px;
  }
  .newagent-btn:hover { background: var(--cerulean); color: var(--paper); }
  .newagent-none { font-size: 12px; color: var(--faint); }
  .signin-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn, #a8743a); margin-left: 7px; vertical-align: middle;
  }

  .console { border-bottom: 1px solid var(--line); padding: 12px 16px 14px; background: #fff7; }
  .console-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .console-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .console-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .console { border-left: 2px solid var(--who); }
  .console-head .where { font-size: 11px; color: var(--faint); }
  .console-stop {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 100px; padding: 3px 10px;
  }
  .console-stop:hover { color: var(--alert); border-color: var(--alert); }
  .console-err { font-size: 12px; color: var(--alert); margin-bottom: 8px; }
  .console-out {
    max-height: 300px; overflow-y: auto;
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
    background: #fffb; border: 1px solid var(--line); padding: 8px 10px;
  }
  .cline { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cline[data-kind="you"]   { color: var(--cerulean); }
  .cline[data-kind="tool"]  { color: #9a5b3d; }
  .cline[data-kind="err"]   { color: var(--alert); }
  .cline[data-kind="meta"]  { color: var(--faint); }
  .console-form { margin-top: 8px; }
  .console-input {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--line); background: var(--paper);
    font: inherit; font-size: 12.5px; color: var(--ink);
  }
  .console-input:focus { outline: 2px solid var(--cerulean); outline-offset: -1px; border-color: transparent; }

  /* ---- collisions ------------------------------------------------------ */
  .collide-bar {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 9px 16px;
    background: color-mix(in srgb, var(--alert) 8%, var(--paper));
    border-bottom: 1px solid color-mix(in srgb, var(--alert) 28%, var(--line));
    font-size: 12.5px;
  }
  .collide-bar .file { color: var(--alert); }
  .collide-bar .who-list { color: var(--muted); display: flex; gap: 14px; }
  .collide-bar b { font-weight: 400; color: var(--who); }

  /* ---- file detail ----------------------------------------------------- */
  .detail-who { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 18px 14px; }
  .dwho {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 100px;
    font-size: 12.5px; background: #fff8;
  }
  .dwho .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); }
  .dwho .when { color: var(--faint); font-size: 11.5px; margin-left: 2px; }
  .detail-events { padding: 0 18px 24px; }
  .detail-events.after-code { padding-top: 16px; }
  .devent {
    display: grid; grid-template-columns: 70px 90px 74px 1fr;
    gap: 12px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .devent .dt { color: var(--faint); font-size: 11px; }
  .devent .da { color: var(--who); }
  .devent .dv { color: var(--ink); }
  .devent .dd { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the file viewer ------------------------------------------------- */
  .viewer { padding: 0 18px 20px; min-width: 0; }
  .viewer.loading, .viewer.err { color: var(--muted); font-size: 12.5px; padding: 8px 18px 20px; }
  .viewer.err { color: var(--alert); }
  .viewer .code {
    margin: 0; padding: 12px 14px;
    background: #fffb; border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 12px; line-height: 1.65;
    color: var(--ink);
    /* Scrolls sideways only. The pane it sits in already scrolls vertically,
       and two nested vertical scrollbars means the wheel does the wrong thing
       depending on where the pointer happens to be. */
    overflow-x: auto; overflow-y: hidden;
    white-space: pre;
    tab-size: 2;
  }
  .viewer-note { font-size: 11px; color: var(--faint); padding-top: 6px; }
  /* Syntax colours drawn from the same six tokens, so code does not become a
     second palette living inside the first. */
  .tok-com  { color: var(--faint); font-style: italic; }
  .tok-str  { color: #4f7a4a; }
  .tok-num  { color: #9a5b3d; }
  .tok-kw   { color: var(--cerulean); }
  .tok-fn   { color: #7a5a92; }
  .tok-attr { color: #9a5b3d; }
  .tok-tag  { color: var(--cerulean); }
  .tok-punc { color: var(--muted); }

  /* ---- empty / onboarding --------------------------------------------- */
  .blank { padding: 56px 28px; max-width: 58ch; }
  .blank h2 { font-weight: 200; font-size: 26px; letter-spacing: 0.01em; margin: 0 0 12px; }
  .blank p { color: var(--muted); margin: 0 0 12px; line-height: 1.65; }
  .blank code {
    font-family: var(--font-mono); font-size: 12px;
    background: #fff9; border: 1px solid var(--line); padding: 2px 6px;
  }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 180px 1fr; }
    .streams { display: none; }
  }
  @media (max-width: 700px) {
    .shell { grid-template-columns: 1fr; }
    .rail { display: none; }
  }
</style>
</head>
<body>
<div class="titlebar">
  <span class="wordmark">zevet</span>
  <span class="scope" id="scope"></span>
  <span class="spacer"></span>
  <span class="presence" id="presence"></span>
  <span class="conn" id="conn" data-state="init"><span class="dot"></span><span id="connText">connecting</span></span>
</div>

<div class="shell">
  <aside class="pane rail">
    <div class="pane-title">People</div>
    <div class="pane-body" id="people"></div>
    <div class="pane-title" style="border-top:1px solid var(--line)">Workspaces</div>
    <div class="ws" id="workspaces"></div>
  </aside>

  <div class="middle">
    <div class="treecol">
      <div class="pane-title" id="filesTitle">Files</div>
      <div class="pane-body"><div class="tree" id="tree"></div></div>
    </div>
    <main class="detail">
      <div id="collisions"></div>
      <div class="pane-title" id="detailTitle">Nothing selected</div>
      <div class="pane-body" id="detail"></div>
    </main>
  </div>

  <aside class="pane streams">
    <div class="pane-title">Agents</div>
    <div class="pane-body" id="streams"></div>
  </aside>
</div>

<script src="/highlight.js"></script>
<script>
(function () {
  "use strict";

  var HUES = 5;
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var IDLE_FALLBACK = 90000;

  var events = [];
  var roster = [];
  var collisions = [];
  var idleAfterMs = IDLE_FALLBACK;
  var skewMs = 0;
  var conn = "init";
  var needsToken = false;
  var selectedActor = null;
  var selectedRepo = null;
  var collapsed = Object.create(null);
  var selectedPath = null;

  /**
   * Running inside the desktop app, where there is a real filesystem.
   *
   * In a browser the tree can only be built from the paths agents have named —
   * the hub holds nothing else, by design. In the app there is a disk, so the
   * tree is the REAL folder and the team's presence is overlaid on it. Same
   * board, two levels of truth, and it says which one you are looking at
   * rather than quietly showing a partial tree as if it were the whole repo.
   */
  var LOCAL = typeof window.zevetLocal === "object" && window.zevetLocal && window.zevetLocal.available;
  var localWorkspaces = [];
  var localRoot = null;
  var localEntries = null;   // flat [{path, kind, depth}] from the app
  var localFile = null;      // { path, text, truncated } for the viewer
  var localError = null;
  var localAgents = [];          // which CLIs this machine has
  /**
   * Consoles started from THIS machine — plural, deliberately.
   *
   * It held one. Watching several agents work at once is the entire point of
   * the product, and a surface that can only show your own one agent while
   * showing three of everyone else's was telling on itself.
   */
  var myConsoles = [];
  var launchModel = "";          // blank means "whatever the CLI defaults to"
  var launchMode = "auto";

  /**
   * The postures zevet offers, in the order they escalate.
   *
   * The labels are zevet's; the flags behind them are each CLI's own, read off
   * --help rather than remembered, and they differ per agent (claude has a
   * plan mode, codex does not and falls back to a read-only sandbox). Keeping
   * the vocabulary here and the flags in agent-console.js means the UI cannot
   * drift into offering a mode the module does not implement.
   */
  var MODES = [
    { id: "plan", label: "Plan only" },
    { id: "ask", label: "Ask first" },
    { id: "auto", label: "Auto" },
    { id: "dangerous", label: "Skip permissions" },
  ];

  /** Model aliases each CLI accepts. Free text wins; these are a shortcut. */
  var MODELS = {
    claude: ["", "opus", "sonnet", "haiku"],
    codex: ["", "gpt-5", "gpt-5-codex", "o3"],
  };

  function $(id) { return document.getElementById(id); }
  function el(t, c) { var n = document.createElement(t); if (c) n.className = c; return n; }
  function tx(n, s) { n.textContent = s == null ? "" : String(s); return n; }
  function serverNow() { return Date.now() + skewMs; }

  function hueOf(actor) {
    var i = roster.findIndex(function (r) { return r.actor === actor; });
    return "var(--who-" + ((i < 0 ? 0 : i) % HUES) + ")";
  }
  /**
   * A relative-time label that can be refreshed without rebuilding the DOM.
   *
   * The board used to re-render everything once a second, purely so "3s ago"
   * stayed true. That threw away text selection mid-drag, made every click a
   * race against the next tick, and rebuilt a file tree nobody had touched.
   * Now the timer only rewrites elements carrying data-ago, and a full render
   * happens when the DATA changes.
   */
  function agoEl(node, ts) {
    node.dataset.ago = String(ts);
    tx(node, ago(serverNow() - ts) + " ago");
    return node;
  }

  function tickAgo() {
    var now = serverNow();
    document.querySelectorAll("[data-ago]").forEach(function (n) {
      tx(n, ago(now - Number(n.dataset.ago)) + " ago");
    });
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m";
    return Math.round(m / 60) + "h";
  }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString([], { hour12: false }); }
  function verbFor(e) {
    if (e.kind === "prompt") return "asked";
    if (e.kind === "turn_end") return "finished";
    return e.tool || "working";
  }
  function isIdle(r, now) { return now - r.lastTs > idleAfterMs; }

  /** Events for the workspace currently being looked at. */
  function scoped() {
    return events.filter(function (e) { return !selectedRepo || e.repo === selectedRepo; });
  }

  // ---- data -------------------------------------------------------------

  function applySnapshot(s) {
    if (typeof s.now === "number") skewMs = s.now - Date.now();
    roster = s.roster || [];
    collisions = s.collisions || [];
    idleAfterMs = s.idleAfterMs || IDLE_FALLBACK;
    events = s.events || [];
    if (!selectedRepo) selectedRepo = lastRepo();
    render();
  }

  function pushEvent(e) {
    events.push(e);
    if (events.length > 900) events.shift();
    if (!roster.some(function (r) { return r.actor === e.actor; })) {
      roster = roster.concat([{ actor: e.actor, lastTs: e.ts, lastEvent: e }]);
      roster.sort(function (a, b) { return a.actor.localeCompare(b.actor); });
    }
    var r = roster.find(function (x) { return x.actor === e.actor; });
    if (r) { r.lastTs = e.ts; r.lastEvent = e; }
    if (!selectedRepo) selectedRepo = e.repo || null;
    render();
  }

  function lastRepo() {
    for (var i = events.length - 1; i >= 0; i--) if (events[i].repo) return events[i].repo;
    return null;
  }

  function workspaces() {
    var seen = [];
    events.forEach(function (e) {
      if (!e.repo) return;
      var hit = seen.find(function (w) { return w.repo === e.repo; });
      if (!hit) seen.push({ repo: e.repo, branch: e.branch, lastTs: e.ts });
      else { hit.lastTs = Math.max(hit.lastTs, e.ts); if (e.branch) hit.branch = e.branch; }
    });
    return seen.sort(function (a, b) { return b.lastTs - a.lastTs; });
  }

  /**
   * The file tree, built from what people have actually touched.
   *
   * This is the multiplayer view the activity log could not be: a folder
   * structure with WHO is in it, rather than a list of what happened. It is
   * built from observed paths rather than a directory listing on purpose —
   * the hub never receives anyone's files, only the paths their agents named,
   * so this shows exactly the part of the tree the team is working in and
   * nothing else.
   */
  function blankNode(name, kind) {
    return { name: name, kind: kind, children: Object.create(null), who: Object.create(null), lastTs: 0 };
  }

  function buildTree() {
    var now = serverNow();
    var root = blankNode("", "dir");

    // In the app, start from the real directory listing so the tree is the
    // whole workspace rather than only the touched corner of it.
    if (LOCAL && localEntries) {
      localEntries.forEach(function (entry) {
        var parts = String(entry.path).split("/").filter(Boolean);
        var node = root;
        parts.forEach(function (part, i) {
          var isLast = i === parts.length - 1;
          var kind = isLast ? entry.kind : "dir";
          if (!node.children[part]) node.children[part] = blankNode(part, kind);
          node = node.children[part];
        });
      });
    }

    scoped().forEach(function (e) {
      if (!e.target || e.kind !== "tool") return;
      var parts = String(e.target).split("/").filter(Boolean);
      var node = root;
      parts.forEach(function (part, i) {
        var isFile = i === parts.length - 1;
        if (!node.children[part]) node.children[part] = blankNode(part, isFile ? "file" : "dir");
        node = node.children[part];
        var prev = node.who[e.actor] || 0;
        if (e.ts > prev) node.who[e.actor] = e.ts;
        node.lastTs = Math.max(node.lastTs, e.ts);
      });
    });
    return { root: root, now: now };
  }

  function collisionSet() {
    var s = Object.create(null);
    collisions.forEach(function (c) {
      if (selectedRepo && c.repo && c.repo !== selectedRepo) return;
      s[c.target] = true;
    });
    return s;
  }

  // ---- render ------------------------------------------------------------

  function renderPresence(now) {
    var host = $("presence");
    host.textContent = "";
    roster.forEach(function (r) {
      var b = el("button", "chip");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.active = String(!isIdle(r, now));
      b.dataset.dim = String(Boolean(selectedActor) && selectedActor !== r.actor);
      b.appendChild(el("span", "bead"));
      b.appendChild(tx(el("span"), r.actor));
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
  }

  function renderPeople(now) {
    var host = $("people");
    host.textContent = "";
    roster.forEach(function (r) {
      var idle = isIdle(r, now);
      var b = el("button", "person");
      b.style.setProperty("--who", hueOf(r.actor));
      b.dataset.idle = String(idle);
      b.dataset.sel = String(selectedActor === r.actor);
      b.appendChild(el("span", "bead"));
      var col = el("span");
      col.appendChild(tx(el("span", "nm"), r.actor));
      var sub = el("span", "sub");
      var last = r.lastEvent;
      if (idle) tx(sub, "idle " + ago(now - r.lastTs));
      else if (last) {
        var v = el("span", "verb");
        tx(v, verbFor(last));
        sub.appendChild(v);
        sub.appendChild(document.createTextNode("  " + folderOf(last)));
      }
      col.appendChild(sub);
      b.appendChild(col);
      b.addEventListener("click", function () {
        selectedActor = selectedActor === r.actor ? null : r.actor;
        render();
      });
      host.appendChild(b);
    });
    if (!roster.length) {
      var p = el("div");
      p.style.cssText = "padding:14px 16px;color:var(--faint);font-size:12.5px";
      tx(p, "nobody yet");
      host.appendChild(p);
    }
  }

  /** The folder a teammate is working in — the thing you want at a glance. */
  function folderOf(e) {
    if (!e || !e.target) return e && e.detail ? String(e.detail).slice(0, 40) : "";
    var parts = String(e.target).split("/");
    parts.pop();
    return parts.length ? parts.join("/") + "/" : "./";
  }

  function refreshLocalWorkspaces() {
    if (!LOCAL) return Promise.resolve();
    return window.zevetLocal.workspaces().then(function (list) {
      localWorkspaces = list || [];
      render();
    });
  }

  function openLocalRoot(dir) {
    if (!LOCAL) return;
    localRoot = dir;
    localEntries = null;
    localFile = null;
    localError = null;
    selectedPath = null;
    render();
    window.zevetLocal.tree(dir).then(function (r) {
      if (r && r.ok) {
        localEntries = r.entries;
        localError = r.truncated ? "showing the first " + r.entries.length + " entries" : null;
      } else {
        localEntries = [];
        localError = (r && r.error) || "could not read that folder";
      }
      render();
    });
  }

  function openLocalFile(relPath) {
    if (!LOCAL || !localRoot) return;
    localFile = { path: relPath, text: null, loading: true };
    render();
    window.zevetLocal.read(localRoot, relPath).then(function (r) {
      localFile = r && r.ok
        ? { path: relPath, text: r.text, truncated: r.truncated, bytes: r.bytes }
        : { path: relPath, error: (r && r.error) || "could not read it" };
      render();
    });
  }

  // ---- running an agent from here --------------------------------------

  function refreshLocalAgents() {
    if (!LOCAL) return;
    window.zevetLocal.agents().then(function (list) {
      localAgents = list || [];
      render();
    });
  }

  var consoleSeq = 0;

  function startAgent(name) {
    if (!LOCAL || !localRoot) return;
    var c = {
      key: ++consoleSeq,
      id: null,
      agent: name,
      lines: [],
      running: true,
      error: null,
      mode: launchMode,
      model: launchModel,
      root: localRoot,
      hue: myConsoles.length % 5,
    };
    myConsoles.push(c);
    render();
    window.zevetLocal.startAgent(name, localRoot, { model: launchModel, mode: launchMode }).then(function (r) {
      if (!r || !r.ok) {
        c.running = false;
        c.error = (r && r.error) || "could not start";
      } else {
        c.id = r.id;
      }
      render();
    });
  }

  function consoleById(id) {
    // A console that has not been told its id yet is the one that just started,
    // so unclaimed events belong to it. Without this the first few lines of
    // every run vanish into a console nobody can find.
    return myConsoles.find(function (c) { return c.id === id; }) || myConsoles.find(function (c) { return c.id === null; });
  }

  function pushConsoleLine(c, kind, text) {
    if (!c) return;
    c.lines.push({ kind: kind, text: String(text) });
    // A console that grows without bound is a memory leak with a scrollbar.
    if (c.lines.length > 400) c.lines.splice(0, c.lines.length - 400);
  }

  if (LOCAL) {
    window.zevetLocal.onAgentEvent(function (evt) {
      var c = consoleById(evt.id);
      if (!c) return;
      if (evt.type === "exit") {
        c.running = false;
        pushConsoleLine(c, "meta", "agent exited (" + (evt.code === null ? "signal " + evt.signal : "code " + evt.code) + ")");
      } else if (evt.type === "stderr") {
        pushConsoleLine(c, "err", evt.text || "");
      } else if (evt.type === "agent") {
        // Claude's stream-json. Show the parts a person reads, not the envelope.
        var p = evt.payload || {};
        if (p.type === "assistant" && p.message && Array.isArray(p.message.content)) {
          p.message.content.forEach(function (part) {
            if (part.type === "text" && part.text) pushConsoleLine(c, "out", part.text);
            if (part.type === "tool_use") pushConsoleLine(c, "tool", part.name + "  " + shortInput(part.input));
          });
        } else if (p.type === "result") {
          pushConsoleLine(c, "meta", "turn finished (" + (p.terminal_reason || p.subtype || "done") + ")");
        }
      } else if (evt.type === "stdout-line") {
        pushConsoleLine(c, "out", evt.text || "");
      }
      render();
    });
  }

  /**
   * What a tool call is about, said the way the rest of the board says it.
   *
   * Found by watching a real agent run in here: the console printed
   * `C:\dev\GitHub\zevet\hub\server.mjs` while the tree two panes to the
   * left said `hub/server.mjs`. Same file, two spellings, and the long one
   * pushed everything else out of a 340px column. The hook already
   * relativises paths before sending them to the hub; this is the same rule
   * applied to output that never goes near the hub.
   */
  function shortInput(input) {
    if (!input || typeof input !== "object") return "";
    var v = input.file_path || input.path || input.notebook_path || input.command || input.pattern || "";
    var text = String(v);
    if (localRoot) {
      var norm = text.split("\\").join("/");
      var root = localRoot.split("\\").join("/").replace(/\/+$/, "");
      if (norm.toLowerCase().indexOf(root.toLowerCase() + "/") === 0) {
        text = norm.slice(root.length + 1);
      }
    }
    return text.slice(0, 90);
  }

  function renderWorkspaces() {
    var host = $("workspaces");
    host.textContent = "";

    if (LOCAL) {
      localWorkspaces.forEach(function (w) {
        var b = el("button", "ws-item");
        b.dataset.sel = String(localRoot === w.dir);
        b.appendChild(tx(el("span"), w.name));
        b.appendChild(document.createElement("br"));
        b.appendChild(tx(el("span", "branch"), w.repo ? "git repo" : w.dir));
        b.addEventListener("click", function () {
          if (localRoot === w.dir) { localRoot = null; localEntries = null; localFile = null; }
          else openLocalRoot(w.dir);
          render();
        });
        host.appendChild(b);
      });
      var add = el("button", "ws-add");
      tx(add, "Open a folder…");
      add.addEventListener("click", function () {
        window.zevetLocal.addWorkspace().then(function (w) {
          if (w) { return refreshLocalWorkspaces().then(function () { openLocalRoot(w.dir); }); }
        });
      });
      host.appendChild(add);
      if (localError) {
        var note = el("div", "ws-note");
        tx(note, localError);
        host.appendChild(note);
      }
      return;
    }

    var list = workspaces();
    list.forEach(function (w) {
      var b = el("button", "ws-item");
      b.dataset.sel = String(selectedRepo === w.repo);
      b.appendChild(tx(el("span"), w.repo));
      if (w.branch) {
        b.appendChild(document.createElement("br"));
        b.appendChild(tx(el("span", "branch"), w.branch));
      }
      b.addEventListener("click", function () {
        selectedRepo = selectedRepo === w.repo ? null : w.repo;
        render();
      });
      host.appendChild(b);
    });
    if (!list.length) {
      var p = el("div");
      p.style.cssText = "color:var(--faint);font-size:12.5px";
      tx(p, "none yet");
      host.appendChild(p);
    }
  }

  var FILE_SVG =
    '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">' +
    '<path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5L9 1.5Z"/>' +
    '<path d="M9 1.5V5a.5.5 0 0 0 .5.5H13"/></svg>';

  function renderTree(now) {
    var host = $("tree");
    host.textContent = "";
    var built = buildTree();
    var collide = collisionSet();
    var any = Object.keys(built.root.children).length > 0;

    tx($("filesTitle"), selectedRepo ? "Files — " + selectedRepo : "Files");

    if (!any) {
      var box = el("div", "empty-tree");
      tx(box, needsToken
        ? "Sign in to see what the team is working on."
        : "No files touched yet. The tree fills in as agents read and edit — it shows the part of the repo the team is actually in, never file contents.");
      host.appendChild(box);
      return;
    }

    function walk(node, depth, prefix) {
      var names = Object.keys(node.children).sort(function (a, b) {
        var A = node.children[a], B = node.children[b];
        if (A.kind !== B.kind) return A.kind === "dir" ? -1 : 1;
        return a.localeCompare(b);
      });
      names.forEach(function (name) {
        var child = node.children[name];
        var path = prefix ? prefix + "/" + name : name;
        var isDir = child.kind === "dir";
        var open = !collapsed[path];

        var row = el("button", "node");
        row.dataset.kind = child.kind;
        row.dataset.collide = String(Boolean(collide[path]));
        var actorsHere = Object.keys(child.who);
        row.dataset.touched = String(actorsHere.length > 0);
        row.style.paddingLeft = 16 + depth * 14 + "px";

        var label = el("span", "label");
        var caret = el("span", "caret");
        tx(caret, isDir ? (open ? "▾" : "▸") : "");
        label.appendChild(caret);
        if (!isDir) {
          var icon = el("span");
          icon.innerHTML = FILE_SVG;
          label.appendChild(icon.firstChild);
        }
        label.appendChild(tx(el("span", "name"), name));
        row.appendChild(label);

        var marks = el("span", "marks");
        actorsHere
          .filter(function (a) { return !selectedActor || a === selectedActor; })
          .sort(function (a, b) { return child.who[b] - child.who[a]; })
          .slice(0, 4)
          .forEach(function (a) {
            var m = el("span", "mark");
            m.style.setProperty("--who", hueOf(a));
            m.dataset.stale = String(now - child.who[a] > idleAfterMs);
            m.title = a + " · " + ago(now - child.who[a]) + " ago";
            marks.appendChild(m);
          });
        row.appendChild(marks);

        row.dataset.sel = String(!isDir && selectedPath === path);
        row.addEventListener("click", function () {
          if (isDir) collapsed[path] = open;
          else {
            selectedPath = selectedPath === path ? null : path;
            if (selectedPath && LOCAL && localRoot) openLocalFile(selectedPath);
            else localFile = null;
          }
          render();
        });
        host.appendChild(row);

        if (isDir && open) walk(child, depth + 1, path);
      });
    }
    walk(built.root, 0, "");
  }

  /**
   * What is known about one file.
   *
   * NOT its contents: the hub never receives a byte of anyone's source, by
   * design, and inventing a preview here would be a lie about what this
   * system holds. What it does know — and what you actually want when two
   * people are in one file — is who has been in it, when, and with which
   * tool. The desktop app can show real contents because it reads your own
   * disk; that is a separate surface and is marked as such.
   */
  function renderDetail(now) {
    var host = $("detail");
    host.textContent = "";
    if (!selectedPath) {
      tx($("detailTitle"), "Nothing selected");
      var hint = el("div", "blank");
      hint.appendChild(tx(el("h2"), "Pick a file."));
      hint.appendChild(tx(el("p"), "The tree shows the part of the repo the team is actually working in, built from what everyone's agents have touched. Select a file to see who has been in it."));
      host.appendChild(hint);
      return;
    }

    tx($("detailTitle"), selectedPath);
    var touching = scoped().filter(function (e) { return e.target === selectedPath; });

    // In the app, the file itself — read from this machine's disk, never from
    // the hub, which has never held a byte of it.
    if (LOCAL && localFile && localFile.path === selectedPath) {
      var viewer = el("div", "viewer");
      if (localFile.loading) {
        tx(viewer, "reading…");
        viewer.className = "viewer loading";
      } else if (localFile.error) {
        viewer.className = "viewer err";
        tx(viewer, localFile.error);
      } else {
        var pre = el("pre", "code");
        var lang = window.zevetHighlight ? window.zevetHighlight.languageFor(selectedPath) : "plain";
        if (window.zevetHighlight) pre.innerHTML = window.zevetHighlight.highlight(localFile.text, lang);
        else tx(pre, localFile.text);
        viewer.appendChild(pre);
        if (localFile.truncated) {
          var t = el("div", "viewer-note");
          tx(t, "truncated — showing the first part of the file");
          viewer.appendChild(t);
        }
      }
      host.appendChild(viewer);
    }

    var whoLast = Object.create(null);
    touching.forEach(function (e) {
      if (!whoLast[e.actor] || e.ts > whoLast[e.actor]) whoLast[e.actor] = e.ts;
    });

    var summary = el("div", "detail-who");
    Object.keys(whoLast)
      .sort(function (a, b) { return whoLast[b] - whoLast[a]; })
      .forEach(function (a) {
        var chip = el("span", "dwho");
        chip.style.setProperty("--who", hueOf(a));
        chip.appendChild(el("span", "bead"));
        chip.appendChild(tx(el("span"), a));
        chip.appendChild(agoEl(el("span", "when"), whoLast[a]));
        summary.appendChild(chip);
      });
    host.appendChild(summary);

    var list = el("div", LOCAL && localFile && !localFile.error ? "detail-events after-code" : "detail-events");
    touching.slice(-40).reverse().forEach(function (e) {
      var row = el("div", "devent");
      row.style.setProperty("--who", hueOf(e.actor));
      row.appendChild(tx(el("span", "dt"), hhmm(e.ts)));
      row.appendChild(tx(el("span", "da"), e.actor));
      row.appendChild(tx(el("span", "dv"), e.tool || verbFor(e)));
      row.appendChild(tx(el("span", "dd mono"), e.detail || ""));
      list.appendChild(row);
    });
    host.appendChild(list);
  }

  function renderCollisions(now) {
    var host = $("collisions");
    host.textContent = "";
    collisions
      .filter(function (c) { return !selectedRepo || !c.repo || c.repo === selectedRepo; })
      .slice(0, 3)
      .forEach(function (c) {
        var bar = el("div", "collide-bar");
        bar.appendChild(tx(el("span", "file mono"), c.target));
        var list = el("span", "who-list");
        (c.actors || []).forEach(function (a) {
          var s = el("span");
          s.style.setProperty("--who", hueOf(a.actor));
          var b = el("b");
          tx(b, a.label || a.actor);
          s.appendChild(b);
          s.appendChild(document.createTextNode(" "));
          s.appendChild(agoEl(el("span"), a.ts));
          list.appendChild(s);
        });
        bar.appendChild(list);
        host.appendChild(bar);
      });
  }

  /**
   * One card per person: their prompt, then the steps their agent has taken
   * since — which is what a Codex or Claude Code pane shows, except there are
   * three of them and each is somebody else.
   */
  function renderMyConsole(host) {
    if (!LOCAL) return;

    myConsoles.forEach(function (c) { renderOneConsole(host, c); });

    if (!localRoot) return;
    var bar = el("div", "newagent");
    var usable = localAgents.filter(function (a) { return a.ok; });
    if (!usable.length) {
      var none = el("div", "newagent-none");
      tx(none, localAgents.length ? "no agent CLI found on this machine" : "looking for agents…");
      bar.appendChild(none);
      host.appendChild(bar);
      return;
    }

    var controls = el("div", "launch-controls");
    var modeSel = el("select", "launch-select");
    MODES.forEach(function (m) {
      var o = el("option");
      o.value = m.id;
      tx(o, m.label);
      if (m.id === launchMode) o.selected = true;
      modeSel.appendChild(o);
    });
    modeSel.addEventListener("change", function () { launchMode = modeSel.value; render(); });
    controls.appendChild(modeSel);

    var modelInput = el("input", "launch-model");
    modelInput.type = "text";
    modelInput.placeholder = "model (default)";
    modelInput.value = launchModel;
    modelInput.setAttribute("list", "zevet-models");
    modelInput.addEventListener("change", function () { launchModel = modelInput.value.trim(); });
    controls.appendChild(modelInput);

    var dl = el("datalist");
    dl.id = "zevet-models";
    var pool = [];
    usable.forEach(function (a) { pool = pool.concat(MODELS[a.name] || []); });
    pool.filter(Boolean).forEach(function (v) {
      var o = el("option");
      o.value = v;
      dl.appendChild(o);
    });
    controls.appendChild(dl);
    bar.appendChild(controls);

    var row = el("div", "launch-row");
    usable.forEach(function (a) {
      var b = el("button", "newagent-btn");
      tx(b, (myConsoles.length ? "Another " : "Start ") + a.name);
      if (!a.signedIn) {
        var warnDot = el("span", "signin-dot");
        warnDot.title = "no account found for " + a.name;
        b.appendChild(warnDot);
      }
      b.title = a.detail + (a.signedIn ? "  (signed in)" : "  (no account found)");
      b.dataset.danger = String(launchMode === "dangerous");
      b.addEventListener("click", function () { startAgent(a.name); });
      row.appendChild(b);
    });
    bar.appendChild(row);

    if (launchMode === "dangerous") {
      var warn = el("div", "launch-warn");
      tx(warn, "This agent will not ask before running commands or editing files.");
      bar.appendChild(warn);
    }
    host.appendChild(bar);
  }

  function renderOneConsole(host, c) {
    var card = el("div", "console");
    card.style.setProperty("--who", "var(--who-" + c.hue + ")");

    var head = el("div", "console-head");
    head.appendChild(el("span", "bead"));
    head.appendChild(tx(el("span", "nm"), c.agent));
    var posture = el("span", "posture");
    posture.dataset.danger = String(c.mode === "dangerous");
    var modeLabel = (MODES.find(function (m) { return m.id === c.mode; }) || {}).label || c.mode;
    tx(posture, modeLabel + (c.model ? "  ·  " + c.model : ""));
    head.appendChild(posture);

    var stop = el("button", "console-stop");
    tx(stop, c.running ? "Stop" : "Close");
    stop.addEventListener("click", function () {
      if (c.running && c.id) window.zevetLocal.stopAgent(c.id);
      myConsoles = myConsoles.filter(function (x) { return x !== c; });
      render();
    });
    head.appendChild(stop);
    card.appendChild(head);

    if (c.error) {
      var e = el("div", "console-err");
      tx(e, c.error);
      card.appendChild(e);
    }

    var out = el("div", "console-out");
    c.lines.slice(-120).forEach(function (l) {
      var row = el("div", "cline");
      row.dataset.kind = l.kind;
      tx(row, l.text);
      out.appendChild(row);
    });
    card.appendChild(out);

    if (c.running) {
      var form = el("form", "console-form");
      var input = el("input", "console-input");
      input.type = "text";
      input.placeholder = "Tell it what to do…";
      form.appendChild(input);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var text = input.value.trim();
        if (!text || !c.id) return;
        pushConsoleLine(c, "you", text);
        input.value = "";
        window.zevetLocal.sendToAgent(c.id, text).then(function (r) {
          if (r && r.ok === false) pushConsoleLine(c, "err", r.error || "could not send");
          render();
        });
        render();
      });
      card.appendChild(form);
    }

    host.appendChild(card);
    var o = card.querySelector(".console-out");
    if (o) o.scrollTop = o.scrollHeight;
  }

  function renderStreams(now) {
    var host = $("streams");
    host.textContent = "";
    renderMyConsole(host);
    var shown = roster.filter(function (r) { return !selectedActor || r.actor === selectedActor; });

    shown.forEach(function (r) {
      var mine = scoped().filter(function (e) { return e.actor === r.actor; });
      if (!mine.length) return;

      // Everything since this person's most recent prompt is the current turn.
      var startIdx = 0;
      for (var i = mine.length - 1; i >= 0; i--) {
        if (mine[i].kind === "prompt") { startIdx = i; break; }
      }
      var turn = mine.slice(startIdx);
      var prompt = turn[0] && turn[0].kind === "prompt" ? turn[0] : null;
      var steps = turn.filter(function (e) { return e.kind === "tool"; }).slice(-7);
      var ended = turn.some(function (e) { return e.kind === "turn_end"; });
      var idle = isIdle(r, now);

      var card = el("div", "stream");
      card.style.setProperty("--who", hueOf(r.actor));

      var head = el("div", "stream-head");
      head.appendChild(el("span", "bead"));
      head.appendChild(tx(el("span", "nm"), r.actor));
      var agentTag = el("span", "agent");
      tx(agentTag, (r.lastEvent && r.lastEvent.agent) || "");
      head.appendChild(agentTag);
      card.appendChild(head);

      if (prompt && prompt.detail) {
        var bub = el("div", "bubble prompt");
        tx(bub, prompt.detail);
        card.appendChild(bub);
      }

      steps.forEach(function (e) {
        var row = el("div", "step");
        row.appendChild(tx(el("span", "t"), e.tool || "tool"));
        var v = el("span", "v mono");
        tx(v, e.target || e.detail || "");
        row.appendChild(v);
        card.appendChild(row);
      });

      var foot = el("div", "step");
      foot.appendChild(tx(el("span", "t"), hhmm(r.lastTs)));
      var state = el("span", "v");
      if (idle) {
        state.className = "v idle-note";
        tx(state, "idle " + ago(now - r.lastTs));
      } else if (ended) {
        tx(state, "turn finished");
      } else {
        var w = el("b");
        tx(w, "working");
        state.appendChild(w);
        var dots = el("span", "typing");
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        state.appendChild(dots);
      }
      foot.appendChild(state);
      card.appendChild(foot);

      host.appendChild(card);
    });

    if (!host.childNodes.length) {
      var p = el("div");
      p.style.cssText = "padding:16px;color:var(--faint);font-size:12.5px";
      tx(p, roster.length ? "nothing in this workspace yet" : "no agents yet");
      host.appendChild(p);
    }
  }

  function renderScope() {
    var repos = [];
    var branches = [];
    events.forEach(function (e) {
      if (e.repo && repos.indexOf(e.repo) < 0) repos.push(e.repo);
      if (e.branch && branches.indexOf(e.branch) < 0) branches.push(e.branch);
    });
    var label = selectedRepo || repos.join(", ");
    var br = selectedRepo
      ? (workspaces().find(function (w) { return w.repo === selectedRepo; }) || {}).branch
      : branches.length === 1 ? branches[0] : "";
    tx($("scope"), label ? label + (br ? "   " + br : "") : "");
  }

  function renderBlank() {
    if (roster.length) return false;
    var main = $("tree");
    main.textContent = "";
    var box = el("div", "blank");
    if (needsToken) {
      box.appendChild(tx(el("h2"), "Not signed in."));
      box.appendChild(tx(el("p"), "This board needs the shared token. Open the link you were sent, or ask whoever runs the hub for it."));
    } else if (conn === "down") {
      box.appendChild(tx(el("h2"), "Can't reach the hub."));
      box.appendChild(tx(el("p"), "Retrying on its own. If this stays red, the hub is probably off."));
    } else {
      box.appendChild(tx(el("h2"), "Connected. Nobody is working yet."));
      box.appendChild(tx(el("p"), "This is the hub working, not failing. Start an agent in a wired repo and the tree fills in with who is in which folder."));
      var p = el("p");
      p.appendChild(document.createTextNode("To wire a repo: "));
      p.appendChild(tx(el("code"), "node client/install.mjs <repo>"));
      box.appendChild(p);
    }
    main.appendChild(box);
    return true;
  }

  function render() {
    var now = serverNow();
    renderPresence(now);
    renderPeople(now);
    renderWorkspaces();
    renderCollisions(now);
    renderScope();
    if (!renderBlank()) { renderTree(now); renderDetail(now); }
    renderStreams(now);
  }

  function setConn(state, label) {
    conn = state;
    $("conn").dataset.state = state;
    tx($("connText"), label);
  }

  function connect() {
    var es = new EventSource("/events");
    es.addEventListener("hello", function (m) { setConn("live", "live"); applySnapshot(JSON.parse(m.data)); });
    es.addEventListener("activity", function (m) { pushEvent(JSON.parse(m.data)); });
    es.onopen = function () { setConn("live", "live"); render(); };
    es.onerror = function () {
      fetch("/api/state", { credentials: "same-origin" })
        .then(function (r) {
          if (r.status === 401) { es.close(); needsToken = true; setConn("down", "not signed in"); }
          else if (r.status === 429) { es.close(); setConn("down", "rate limited"); }
          else setConn("down", "reconnecting");
          render();
        })
        .catch(function () { setConn("down", "reconnecting"); render(); });
    };
  }

  // Cheap every second; a full render only when something actually changed,
  // or every 15s so idle transitions still surface.
  var lastFull = 0;
  setInterval(function () {
    tickAgo();
    if (serverNow() - lastFull > 15000) render();
  }, 1000);

  var _render = render;
  render = function () {
    lastFull = serverNow();
    _render();
  };

  render();
  refreshLocalWorkspaces();
  refreshLocalAgents();
  connect();
})();
</script>
</body>
</html>
