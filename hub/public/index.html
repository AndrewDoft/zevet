<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zevet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eae7e2'/%3E%3Cg fill='%232c2f44'%3E%3Ccircle cx='8' cy='4.5' r='2'/%3E%3Ccircle cx='4.5' cy='11.5' r='2'/%3E%3Ccircle cx='11.5' cy='11.5' r='2'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  /* Masora UI type, served locally; code and paths retain IBM Plex Mono. */
  @font-face {
    font-family: "Space Grotesk";
    src: url("/fonts/space-grotesk-variable.woff2") format("woff2");
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: light;

    /* Masora's paper and ink. Faint is for marks, subtle is readable text. */
    --paper: #eae7e2;
    --ink: #2c2f44;
    --muted: #5f6274;
    --faint: #9c9992;
    --subtle: #5b5e70;
    --line: #cfccc6;
    --fill: #dbdae1;

    /* Keep the bridge's accent token name for older desktop versions. */
    --cerulean: #2c2f44;
    --cerulean-soft: #dbdae1;
    --alert: #a23d2c;
    --success: #42693e;
    --raise-soft: #e3e0dc;
    --raise: #f0eeea;
    --raise-line: #e3e0dc;

    /* Stable collaborator hues, darkened enough for small name labels. */
    --who-0: #2b6280;
    --who-1: #874c30;
    --who-2: #42693e;
    --who-3: #715287;
    --who-4: #805725;
    --syntax-string: #42693e;
    --syntax-number: #874c30;
    --syntax-function: #715287;

    --rail: 258px;
    --tree: 286px;
    --streams: 340px;
    --talk: 300px;
    --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #24252c;
    --ink: #eae7e2;
    --muted: #b6b5bf;
    --faint: #85858f;
    --subtle: #b6b5bf;
    --line: #454750;
    --fill: #373943;
    --cerulean: #eae7e2;
    --cerulean-soft: #373943;
    --alert: #ed9d89;
    --success: #a4cd9d;
    --raise-soft: #2a2b33;
    --raise: #2d2f38;
    --raise-line: #2d2f38;
    --who-0: #96c5e0;
    --who-1: #dcad8d;
    --who-2: #a4cd9d;
    --who-3: #c3aed9;
    --who-4: #dfbd82;
    --syntax-string: #a4cd9d;
    --syntax-number: #dcad8d;
    --syntax-function: #c3aed9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    /* ONE ROW. The title bar and the status strip both used to live up here;
       the bar is gone (its wordmark, scope and presence chips all said things
       the left rail already says) and the strip moved into the rail. The row
       count and the child count must stay equal -- getting that wrong once put
       a 400px void above the panes, because the wrong child got the 1fr. */
    grid-template-rows: 1fr;
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cerulean); outline-offset: 2px; }

  /* ---- title bar ---------------------------------------------------- */
  /* ⚠️ THE COLUMN HEADERS ARE THE WINDOW'S DRAG HANDLE.
     The native caption is hidden so the OS accent bar is gone, which also means
     there is nothing to grab the window by. Removing the title bar took the
     last obvious candidate with it, so the job falls to the one strip of
     non-interactive chrome that runs across the top of every column: the pane
     titles. They are text nobody clicks, they are already at the top of the
     window, and a person dragging an app by its header is not surprised.
     Rejected: a thin invisible drag strip across the top. It is a 6px target
     that people miss, and an app you cannot reliably move is worse than one
     with a visible bar. */
  .pane-title { -webkit-app-region: drag; }
  .pane-title button, .pane-title a, .pane-title input, .pane-title select {
    -webkit-app-region: no-drag;
  }
  /* The window controls float over the top-right of the page, so the rightmost
     column's header has to get out from under them. `env(titlebar-area-width)`
     is published by the overlay and falls back to the full width in a browser
     tab, where the whole idea does not apply and this resolves to zero. */
  .streams > .pane-title { padding-right: calc(16px + 100vw - env(titlebar-area-width, 100vw)); }
  .wordmark { font-weight: 700; font-size: 17px; letter-spacing: -0.04em; text-transform: lowercase; }
  .scope { color: var(--muted); font-size: 12.5px; letter-spacing: 0.02em; }
  .spacer { flex: 1 1 auto; }

  .presence { display: flex; align-items: center; gap: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 9px; border-radius: 100px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid transparent;
  }
  .chip[data-active="true"] { color: var(--ink); border-color: var(--line); background: var(--raise-soft); }
  .chip .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .chip[data-active="false"] .bead { opacity: 0.32; }
  .chip[data-dim="true"] { color: var(--subtle); }

  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .conn[data-state="live"] .dot { background: var(--success); }
  .conn[data-state="down"] .dot { background: var(--alert); }

  /* ---- shell ---------------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: var(--rail) 1fr var(--streams);
    min-height: 0;
  }
  .middle { display: grid; grid-template-columns: var(--tree) 1fr; min-height: 0; min-width: 0; }
  .treecol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .rail { border-right: 1px solid var(--line); }
  .streams { border-left: 1px solid var(--line); }

  .pane-title {
    padding: 15px 16px 9px;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0;
    color: var(--subtle);
    display: flex; align-items: center; gap: 8px;
  }
  body[data-native-mac="true"] .rail > .pane-title:first-child { padding-left: 86px; }
  @media (max-width: 700px) {
    body[data-native-mac="true"] .treecol > .pane-title { padding-left: 86px; }
  }
  .pane-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* ---- people rail ---------------------------------------------------- */
  .person {
    display: grid; grid-template-columns: 10px 1fr; gap: 10px;
    align-items: start;
    width: 100%; text-align: left;
    padding: 9px 16px;
    border-left: 2px solid transparent;
  }
  .person:hover { background: var(--raise-soft); }
  .person[data-sel="true"] { background: var(--raise); border-left-color: var(--who); }
  .person .bead { width: 9px; height: 9px; border-radius: 50%; background: var(--who); margin-top: 5px; }
  .person[data-idle="true"] .bead { opacity: 0.3; }
  .person .nm { display: block; font-size: 13.5px; letter-spacing: 0.01em; }
  .person[data-idle="true"] .nm { color: var(--muted); }
  .person .sub {
    display: block;
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person .sub .verb { margin-right: 6px; }
  .person .sub .verb { color: var(--ink); }

  .ws { padding: 6px 16px 10px; }
  .ws-item {
    display: block; width: 100%; text-align: left;
    padding: 6px 0; font-size: 13px; color: var(--muted);
  }
  .ws-item[data-sel="true"] { color: var(--ink); }
  .ws-item .branch { font-size: 11px; color: var(--subtle); }

  .ws-add {
    display: block; width: 100%; text-align: left;
    padding: 8px 0 2px; font-size: 12.5px; color: var(--cerulean);
  }
  .ws-note { font-size: 11px; color: var(--subtle); padding-top: 6px; }

  /* ---- file tree ------------------------------------------------------ */
  .tree { padding: 2px 0 20px; }
  .node {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 4px 16px 4px 0;
    font-size: 13.5px;
  }
  .node[data-sel="true"] { background: var(--cerulean-soft); }
  .node[data-sel="true"][data-kind] .name { color: var(--ink); }
  .node:hover { background: var(--raise-soft); }
  .node .label { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; }
  .node .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node[data-kind="dir"] .name { color: var(--ink); }
  .node[data-kind="file"] .name { color: var(--muted); }
  .node[data-touched="true"][data-kind="file"] .name { color: var(--ink); }
  .caret { width: 9px; color: var(--subtle); flex: none; font-size: 9px; }
  .ficon { width: 13px; height: 13px; flex: none; opacity: 0.55; }

  .marks { display: flex; align-items: center; gap: 3px; flex: none; }
  .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--who); }
  .mark[data-stale="true"] { opacity: 0.28; }
  .node[data-collide="true"] { background: color-mix(in srgb, var(--alert) 9%, transparent); }
  .node[data-collide="true"] .name { color: var(--alert); }

  .empty-tree { padding: 30px 18px; color: var(--muted); font-size: 13px; max-width: 46ch; }

  /* ---- agent view --------------------------------------------------------
     The same board, rearranged for driving agents instead of typing.

     ⚠️ IT IS A LAYOUT, NOT A SECOND APP. Every pane below is the same element
     with the same state and the same sockets; only the grid and the type
     change. A second view that forked the data would be two boards to keep in
     step, and they would drift within a week. This is also why the console
     MOVES between columns rather than being drawn twice: one `#chat` host in
     agent view, one `#streams` host in ide view, and renderStreams picks.

     The shape, and why:

       rail | CONVERSATION | editor | teammates

     The conversation is the widest thing on screen because in this mode
     reading what the agent said is the work. The editor stays — a vibe coder
     still lands in a file eventually, and taking it away would mean switching
     views to read one function. The file TREE goes, because browsing a repo is
     exactly the activity this mode is not for; what replaces it is the changed
     -file list in the teammates column, which is the only part of a tree
     somebody driving an agent actually wants.

     `display: none` on the tree is deliberate rather than a narrower width: a
     vestigial 80px of file list would be worse than none. Switching back
     restores it with its selection intact, because nothing was torn down. */
  .chatcol {
    display: none; flex-direction: column;
    min-height: 0; min-width: 0;
    border-right: 1px solid var(--line);
  }
  body[data-view="agent"] .chatcol { display: flex; }
  /* The tree's BODY goes, not its column: the column is where the changed-file
     list lives. `#treeBody` is still rendered into and still holds its
     selection, so switching back is instant. */
  body[data-view="agent"] #treeBody { display: none; }
  /* ⚠️ THESE TRACKS ARE MATCHED TO DOM ORDER, WHICH IS treecol, chatcol,
     detail. There is no `grid-area` here, so the second track is whichever
     element comes second in the markup. Written the other way round once and
     the conversation — the widest thing this view has — came out 286px wide
     while the changed-file list got the 1.35fr. Moving an element inside
     .middle means re-reading this line. */
  body[data-view="agent"] .middle {
    grid-template-columns: var(--tree) minmax(0, 1fr);
  }
  body[data-view="agent"] .shell { grid-template-columns: var(--rail) 1fr var(--talk); }
  /* The chat column is the page's main surface here, so its right edge needs a
     rule: without one the conversation and the editor run together. */
  body[data-view="agent"] .chatcol { border-right: 1px solid var(--line); }
  /* Teammates keep a column, narrow. Dropping them entirely would have been
     simpler and would have made a multiplayer product single-player in one of
     its two modes. What they lose here is the per-turn detail, which the
     People rail already carries as "editing src/". */
  body[data-view="agent"] .streams .stream { padding: 10px 14px 12px; }
  body[data-view="agent"] .streams .bubble { font-size: 12px; }

  /* FOUR COLUMNS NEED ROOM, and they are dropped in order of what is repeated
     elsewhere on screen. Teammates go first: the People rail already says who
     is doing what. The editor goes second: a vibe coder can switch to ide view
     to read a file, and losing it is survivable in a way that losing the
     conversation or the changed list is not. Neither of those two is ever
     dropped, at any width. */
  @media (max-width: 1500px) {
    body[data-view="agent"] .streams { display: none; }
    body[data-view="agent"] .shell { grid-template-columns: var(--rail) 1fr; }
  }
  /* ⚠️ THE EDITOR IS NOT ALWAYS ON IN THIS VIEW — it appears when a file is
     picked and gives its width back when the file is closed.

     MEASURED, on a 1240px window: three permanent columns left the
     conversation 402px wide, which is NARROWER than it is in ide view, i.e.
     the opposite of the point of this mode. The first fix was a media query
     that dropped the editor under 1400px, and that was worse: it made clicking
     a file in the Changed list do nothing at all, silently, on exactly the
     window size most people have.
     Tying it to the selection instead means the conversation is full width
     while you are talking, the editor is there the moment you ask for a file,
     and no width ever makes a click a no-op. */
  body[data-view="agent"] .detail { display: none; }
  body[data-view="agent"][data-picked="true"] .detail { display: flex; }
  body[data-view="agent"][data-picked="true"] .middle {
    grid-template-columns: var(--tree) minmax(0, 1.05fr) minmax(0, 1fr);
  }

  /* ---- the conversation, when it is the main column ----------------------
     Same console element, different typography. In the rail it is a 340px
     monospace log, which is the right shape for glancing at. Here it is the
     thing being read for minutes at a time, so the agent's prose gets the
     page font at a size meant for reading, and the mono box around it goes:
     a scrolling bordered well inside a column that is already a scrolling
     bordered well is one frame too many. */
  .chatcol .console {
    background: none; border-left: 0; border-bottom: 0;
    padding: 6px 26px 18px;
    max-width: 78ch; margin: 0 auto; width: 100%;
  }
  .chatcol .console-out {
    max-height: none; overflow: visible;
    background: none; border: 0; padding: 0;
    font-family: var(--font-sans); font-size: 14.5px; line-height: 1.72;
  }
  /* What the agent said: prose, with space between paragraphs. */
  .chatcol .cline[data-kind="out"] {
    margin: 0 0 11px; color: var(--ink);
  }
  /* What you said: set apart, not indented into a chat bubble. A bubble would
     imply a messaging app and a per-message identity neither side has here. */
  .chatcol .cline[data-kind="you"] {
    margin: 18px 0 13px; padding: 9px 13px;
    background: var(--cerulean-soft); border-left: 2px solid var(--who);
    color: var(--ink); font-size: 14px;
  }
  /* What it DID: still monospace, still small. These are the lines you skim
     past when the prose is what you want, and they should read as machinery. */
  .chatcol .cline[data-kind="tool"],
  .chatcol .cline[data-kind="meta"],
  .chatcol .cline[data-kind="err"] {
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
    padding: 1px 0;
  }
  .chatcol .console-head { margin-bottom: 14px; }
  .chatcol .newagent { padding: 10px 26px 18px; max-width: 78ch; margin: 0 auto; }
  /* The composer sticks to the bottom of the column, where the hands are. */
  .chatcol .console-form {
    position: sticky; bottom: 0;
    margin-top: 14px; padding-top: 10px;
    background: linear-gradient(to bottom, transparent, var(--paper) 22%);
  }
  .chatcol .console-input { font-size: 14px; padding: 11px 13px; }

  .chat-empty {
    padding: 34px 26px; max-width: 60ch; margin: 0 auto;
    color: var(--muted); font-size: 14px; line-height: 1.65;
  }
  .chat-empty h2 { font-size: 17px; font-weight: 400; color: var(--ink); margin-bottom: 9px; }

  /* ---- what the agents changed -------------------------------------------
     Agent view's answer to the file tree. Not a tree: a flat list of the files
     that are different from HEAD right now, newest churn first, which is the
     only slice of a repo somebody driving an agent looks at. Clicking one
     opens it in the editor, exactly as a tree row does. */
  .changed { display: flex; flex-direction: column; }
  /* ⚠️ `display: flex` BEATS the UA stylesheet's `[hidden] { display: none }`,
     which is a specificity fact, not a bug in the browser. Without this line
     the changed list is visible in ide view underneath the tree. */
  .changed[hidden] { display: none; }
  .changed-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    align-items: baseline; width: 100%; text-align: left;
    padding: 6px 16px; font-size: 12.5px;
    border-left: 2px solid transparent;
  }
  .changed-row:hover { background: var(--fill); }
  .changed-row[data-sel="true"] { border-left-color: var(--cerulean); background: var(--fill); }
  .changed-row .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .changed-none { padding: 16px; color: var(--subtle); font-size: 12.5px; }

  /* ---- the rail's footer: theme, and a way into settings ------------------
     Above the Workspaces header, where Andrew asked for it. */
  .railfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--line);
  }

  /* ---- the update row ----------------------------------------------------
     Above the theme toggle, at the bottom of the rail: present enough to be
     seen on the next glance at the window, quiet enough not to interrupt. It
     is NOT a modal. A dialog in front of the board would stop somebody's work
     to tell them about a version they can install whenever they like. */
  .updaterow {
    display: flex; flex-direction: column; gap: 6px;
    padding: 11px 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .updaterow[hidden] { display: none; }
  .updaterow .hd { color: var(--ink); font-size: 12.5px; }
  .updaterow .sub { color: var(--subtle); font-size: 11px; }
  .updaterow .go {
    align-self: flex-start;
    padding: 4px 12px; border: 1px solid var(--cerulean); color: var(--cerulean);
    border-radius: 4px; font-size: 12px;
  }
  .update-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .updaterow .go:disabled { opacity: .6; cursor: default; }
  .updaterow .go:hover { background: var(--cerulean); color: var(--paper); }
  /* A real bar, not a spinner: the length of this download is known, so the
     progress can be honest about how far through it is. */
  .updaterow .bar { height: 3px; background: var(--fill); overflow: hidden; }
  .updaterow .bar i { display: block; height: 100%; background: var(--cerulean); transition: width 300ms; }
  /* The same theme control and saved preference, in Masora's neutral palette. */
  .themer {
    display: inline-flex; align-items: center; gap: 9px;
    min-height: 32px; padding: 0; border: 0; background: none;
  }
  .themer .lbl { font-size: 12px; color: var(--muted); }
  .sky {
    position: relative; display: block; width: 42px; height: 24px;
    border: 1px solid var(--muted); border-radius: 20px;
    background: var(--fill); flex: none;
  }
  .sky-circle {
    position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--ink);
    transition: transform 180ms ease;
  }
  .themer[aria-pressed="true"] .sky-circle { transform: translateX(18px); }
  .themer:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .themer * { transition: none !important; }
  }
  .settings-link {
    font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em;
    transition: color 200ms;
  }
  .settings-link:hover { color: var(--ink); }

  /* ---- settings ----------------------------------------------------------
     A sheet over the board rather than a route, because the board has no
     router and adding one for a panel of six rows would be the larger change. */
  .sheet-back {
    position: fixed; inset: 0; z-index: 40;
    background: color-mix(in srgb, var(--ink) 34%, transparent);
  }
  .sheet {
    position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 92vw);
    background: var(--paper); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow-y: auto;
    box-shadow: -18px 0 40px -30px var(--ink);
  }
  .sheet-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { margin: 0; font-size: 15px; font-weight: 400; letter-spacing: 0.02em; }
  .sheet-close { font-size: 12px; color: var(--muted); }
  .sheet-close:hover { color: var(--ink); }
  .sset { padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .sset h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 500;
    letter-spacing: 0; color: var(--subtle);
  }
  .srow { display: flex; gap: 14px; align-items: baseline; padding: 3px 0; font-size: 12.5px; }
  .srow .k { color: var(--muted); flex: 0 0 140px; }
  .srow .v { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .srow .v.mono { font-family: var(--font-mono); font-size: 11.5px; }
  .snote { font-size: 11.5px; color: var(--muted); line-height: 1.65; margin-top: 8px; max-width: 52ch; }
  .sbtn {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 2px;
    border: 1px solid var(--line); background: var(--fill); color: var(--ink);
    transition: border-color 200ms;
  }
  .sbtn:hover:not(:disabled) { border-color: var(--cerulean); }
  .sbtn:disabled { color: var(--subtle); cursor: default; }
  .sbar { height: 3px; background: var(--fill); margin-top: 10px; overflow: hidden; }
  .sbar span { display: block; height: 100%; background: var(--cerulean); transition: width 200ms; }

  /* ---- the status strip -------------------------------------------------
     Andrew's own Claude Code status line, brought inside zevet. Segments
     separated by a dim pipe, monospace numerals, nothing that reflows when a
     number changes width -- it updates constantly and a strip that jitters is
     a strip you learn to ignore. */
  /* In the rail, not across the top. Andrew: "it belongs unified there."
     A 260px column cannot hold eight segments on one line, so they stack --
     which turns out to read better anyway: each fact gets its own row and the
     eye can scan down them instead of along. The pipes are hidden rather than
     removed from the DOM, so the same renderStrip() serves both shapes. */
  .strip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    flex: none; padding: 12px 16px 12px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  .strip .sep { display: none; }
  .strip::-webkit-scrollbar { display: none; }
  /* Nothing to say, no bar. In a plain browser tab there is no agent stream and
     no machine to probe, so the strip is empty -- and an empty 10px bar with a
     rule under it reads as a rendering fault rather than as an absence.
     ⚠️ COLLAPSED, NOT `display: none`. Removing it from the layout takes it out
     of the body grid too, which leaves three declared rows with two children:
     the shell then lands on an auto row instead of the 1fr one and stops
     halfway down the window. Zero height keeps the slot and shows nothing. */
  .strip:empty { height: 0; padding: 0; border-top: 0; }
  .strip .seg { display: inline-flex; align-items: baseline; gap: 5px; }
  .strip .sep { color: var(--line); padding: 0 10px; }
  .strip .k { color: var(--subtle); }
  .strip .v { color: var(--ink); }
  .strip .ok { color: var(--success); }
  .strip .warn { color: var(--who-4); }
  .strip .bad { color: var(--alert); }
  .strip .dim { color: var(--subtle); }
  /* The bar is drawn with block characters rather than a div, so it sits on the
     same baseline as the number beside it and needs no vertical alignment
     fiddling at 10px. */
  .strip .bar { letter-spacing: -0.5px; }

  /* ---- tree badges: how long a file is, and what git thinks changed -----
     Pushed to the right with margin-left:auto so the names stay a clean
     left-hand column and the numbers a clean right-hand one; a badge inline
     after the name would ragged-edge every row. Tabular numerals so 9 and 412
     occupy the same column and the eye can compare them. */
  .node .stat { margin-left: auto; display: flex; align-items: baseline; gap: 7px; flex: none;
                font-family: var(--font-mono); font-size: 10px; font-variant-numeric: tabular-nums; }
  .stat .loc { color: var(--subtle); }
  .stat .add { color: var(--success); }
  .stat .del { color: var(--alert); }
  .stat .new { color: var(--cerulean); }
  .node[data-sel="true"] .stat .loc { color: var(--subtle); }
  /* A directory gets no badge. Summing a folder's lines invites the question
     of whether it counts what is collapsed underneath it, and either answer is
     wrong half the time. */

  /* ---- the editor -------------------------------------------------------
     CodeMirror is given no theme of its own beyond this: the board already has
     a palette and a mono face, and a second one fighting it would be obvious.
     Everything below is either "inherit" or an existing token. */
  .ed { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; min-width: 0; }
  .ed-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 18px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted); flex: none;
  }
  .ed-bar .grow { flex: 1 1 auto; }
  .ed-state { display: inline-flex; align-items: center; gap: 6px; }
  .ed-state .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .ed-state[data-state="open"] .dot { background: var(--success); }
  .ed-state[data-state="connecting"] .dot,
  .ed-state[data-state="retrying"] .dot { background: var(--who-4); }
  .ed-state[data-state="error"] .dot,
  .ed-state[data-state="undecipherable"] .dot { background: var(--alert); }
  .ed-saved { color: var(--subtle); }
  .ed-saved[data-dirty="true"] { color: var(--who-4); }

  .ed-host { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .cm-editor { height: 100%; }
  /* Bigger, with the room the title bar gave back. The editor is the thing
     you look at longest, so it gets the increase first. */
  .cm-editor .cm-scroller { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; }
  .cm-editor.cm-focused { outline: none; }
  .cm-gutters { background: transparent; border-right: 1px solid var(--line); color: var(--subtle); }
  .cm-activeLine { background: var(--raise-line); }
  .cm-activeLineGutter { background: transparent; color: var(--muted); }
  .cm-selectionBackground, .cm-editor ::selection { background: var(--cerulean-soft); }
  /* y-codemirror.next draws remote carets and a name flag; both take the
     colour from the inline style it sets per user, which is the teammate hue
     handed to awareness. Only the typography is ours. */
  .cm-ySelectionInfo { font-family: var(--font-sans); font-size: 9.5px; letter-spacing: 0.04em; }

  /* ---- the riders -------------------------------------------------------
     One figure per agent or teammate, floated over the editor's left margin at
     the line they are on. `pointer-events: none` throughout: these are a
     readout, and a sprite that swallowed a click on the gutter would be
     maddening. The transition is on transform only — animating `top` would
     make every one of them a layout pass on every keystroke. */
  .riders { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .rider {
    /* ⚠️ PINNED TO THE RIGHT EDGE, NOT THE LEFT, and it is not a preference.
       On the left the figure and its name sit directly on top of the code --
       which is precisely the line you are being told somebody is editing, so
       the readout obscures the thing it is pointing at. Seen immediately the
       first time two real windows were put side by side.
       `row-reverse` so the name reads inward, toward the code, rather than
       trailing off the edge of the pane. */
    position: absolute; right: 10px; top: 0;
    display: flex; flex-direction: row-reverse; align-items: center; gap: 5px;
    transform: translateY(-100px);
    transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
    /* A hairline of the teammate's colour behind it, so a figure over a busy
       line still reads as one object rather than as pixels in the code. */
    padding: 0 4px; border-radius: 3px;
    background: var(--paper);
  }
  .rider .who {
    font-family: var(--font-sans); font-size: 9.5px; letter-spacing: 0.05em;
    color: var(--ink); white-space: nowrap;
  }
  .rider[data-fading="true"] { opacity: 0; transition: transform 320ms, opacity 900ms; }

  .ed-note { padding: 10px 18px; font-size: 11.5px; color: var(--muted); }
  .ed-note b { font-weight: 500; color: var(--ink); }

  /* ---- agent streams --------------------------------------------------- */
  .stream {
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 14px;
  }
  .stream-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .stream-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .stream-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .dwho > span + span { margin-left: 0; }
  .stream-head .agent {
    font-size: 11px; letter-spacing: 0;
    color: var(--subtle); margin-left: auto;
  }
  .bubble {
    background: var(--raise); border: 0;
    border-left: 2px solid var(--who);
    padding: 8px 11px; margin-bottom: 7px;
    font-size: 13px; line-height: 1.55;
  }
  .bubble.prompt { background: var(--cerulean-soft); border-color: transparent; border-left-color: var(--who); }
  .step {
    display: grid; grid-template-columns: 78px 1fr; gap: 10px;
    align-items: baseline; padding: 2.5px 0; font-size: 12px;
  }
  .step .t { color: var(--subtle); font-size: 11px; letter-spacing: 0; }
  .step .v { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .v b { font-weight: 400; color: var(--ink); }
  /* The house "working" mark. No spinners: a spinner claims progress it
     cannot measure, and this one is measured — it is on while a turn is. */
  .typing { display: inline-flex; gap: 3px; align-items: center; margin-left: 2px; }
  .typing i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--who);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.7; } }

  .idle-note { font-size: 12px; color: var(--subtle); }

  /* ---- your own agent, running here ------------------------------------ */
  .newagent { display: flex; flex-direction: column; gap: 9px; padding: 4px 16px 16px; }
  .launch-controls { display: flex; gap: 8px; }
  .launch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  /* ⚠️ `appearance: none` IS THE POINT OF THIS RULE. Without it a <select> is
     drawn by the operating system: Segoe UI on Windows, a grey gradient, a
     blue focus ring and a chevron nobody chose -- three of which contradict
     the one-family, one-colour rule the rest of this page is built on, and
     none of which follow the theme. The chevron is drawn back as an inline SVG
     with `currentColor` so it takes --muted in both modes; a background-image
     with a hardcoded fill would be invisible in one of them. */
  .launch-select, .launch-model {
    font: inherit; font-size: 12px; font-weight: 400; letter-spacing: 0.01em;
    padding: 6px 9px; border-radius: 2px;
    border: 1px solid var(--line); background: var(--fill); color: var(--ink);
    appearance: none; -webkit-appearance: none;
    transition: border-color 200ms, background-color 200ms;
  }
  .launch-select:hover, .launch-model:hover { border-color: var(--muted); }
  .launch-select:focus-visible, .launch-model:focus-visible {
    outline: 2px solid var(--cerulean); outline-offset: 1px; border-color: var(--cerulean);
  }
  .launch-model::placeholder { color: var(--subtle); }
  .launch-select {
    padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='currentColor' stroke-width='1.2'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    background-size: 9px 6px;
  }
  /* The popup list itself is the OS's and cannot be styled; giving the OPTIONS
     the theme's colours is the most that can be done, and on Windows it is
     honoured. */
  .launch-select option { background: var(--paper); color: var(--ink); }
  .launch-select { flex: 0 0 auto; }
  .launch-model { flex: 1 1 auto; min-width: 0; }
  .launch-warn { font-size: 11.5px; color: var(--alert); }
  .newagent-btn[data-danger="true"] { border-color: var(--alert); color: var(--alert); }
  .newagent-btn[data-danger="true"]:hover { background: var(--alert); color: var(--paper); }
  .posture { margin-left: 8px; font-size: 11px; color: var(--subtle); }
  .posture[data-danger="true"] { color: var(--alert); }
  .newagent-btn {
    padding: 6px 13px; border: 1px solid var(--cerulean);
    color: var(--cerulean); font-size: 12.5px; border-radius: 4px;
  }
  .newagent-btn:hover { background: var(--cerulean); color: var(--paper); }
  .newagent-none { font-size: 12px; color: var(--subtle); }
  .signin-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--who-4); margin-left: 7px; vertical-align: middle;
  }

  .console { border-bottom: 1px solid var(--line); padding: 12px 16px 14px; background: var(--raise-soft); }
  .console-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .console-head .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); flex: none; }
  .console-head .nm { font-size: 13px; letter-spacing: 0.02em; }
  .console { border-left: 2px solid var(--who); }
  .console-head .where { font-size: 11px; color: var(--subtle); }
  .console-stop {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px;
  }
  .console-stop:hover { color: var(--alert); border-color: var(--alert); }
  .console-err { font-size: 12px; color: var(--alert); margin-bottom: 8px; }
  .console-out {
    max-height: 300px; overflow-y: auto;
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
    background: var(--raise); border: 0; padding: 8px 10px;
  }
  .cline { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cline b { font-weight: 500; color: var(--ink); }
  /* Inline code keeps the mono face even where the surrounding line is prose,
     which is the only reason it is worth marking up at all. */
  .cline code {
    font-family: var(--font-mono); font-size: 0.88em; color: var(--ink);
    background: var(--fill); border: 0;
    border-radius: 2px; padding: 0 4px;
  }
  .cline[data-kind="you"]   { color: var(--cerulean); }
  .cline[data-kind="tool"]  { color: var(--muted); }
  .cline[data-kind="err"]   { color: var(--alert); }
  .cline[data-kind="meta"]  { color: var(--subtle); }
  .console-form { margin-top: 8px; }
  .console-input {
    display: block; width: 100%; padding: 7px 10px;
    border: 1px solid var(--line); background: var(--paper);
    font: inherit; font-size: 12.5px; line-height: 1.5; color: var(--ink);
    /* A textarea, made to behave. `resize: none` because it sizes itself to
       its content (see fit()), and a drag handle in the corner would fight
       that. `overflow: auto` matters: `hidden` would swallow the scrollbar
       once a prompt passes the height ceiling. */
    resize: none; overflow: auto; min-height: 34px;
  }
  .console-input::placeholder { color: var(--subtle); }
  .console-input:focus { outline: 2px solid var(--cerulean); outline-offset: -1px; border-color: transparent; }

  /* ---- collisions ------------------------------------------------------ */
  .collide-bar {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 9px 16px;
    background: color-mix(in srgb, var(--alert) 8%, var(--paper));
    border-bottom: 1px solid color-mix(in srgb, var(--alert) 28%, var(--line));
    font-size: 12.5px;
  }
  .collide-bar .file { color: var(--alert); }
  .collide-bar .who-list { color: var(--subtle); display: flex; gap: 14px; }
  .collide-bar b { font-weight: 400; color: var(--who); }

  /* ---- file detail ----------------------------------------------------- */
  .detail-who { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 18px 14px; }
  .dwho {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 0; border-radius: 4px;
    font-size: 12.5px; background: var(--raise-soft);
  }
  .dwho .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--who); }
  .dwho .when { color: var(--subtle); font-size: 11.5px; margin-left: 2px; }
  .detail-events { padding: 0 18px 24px; }
  .detail-events.after-code { padding-top: 16px; }
  .devent {
    display: grid; grid-template-columns: 70px 90px 74px 1fr;
    gap: 12px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .devent .dt { color: var(--subtle); font-size: 11px; }
  .devent .da { color: var(--who); }
  .devent .dv { color: var(--ink); }
  .devent .dd { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the file viewer ------------------------------------------------- */
  .viewer { padding: 0 18px 20px; min-width: 0; }
  .viewer.loading, .viewer.err { color: var(--muted); font-size: 12.5px; padding: 8px 18px 20px; }
  .viewer.err { color: var(--alert); }
  .viewer .code {
    margin: 0; padding: 12px 14px;
    background: var(--raise); border: 0;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.65;
    color: var(--ink);
    /* Scrolls sideways only. The pane it sits in already scrolls vertically,
       and two nested vertical scrollbars means the wheel does the wrong thing
       depending on where the pointer happens to be. */
    overflow-x: auto; overflow-y: hidden;
    white-space: pre;
    tab-size: 2;
  }
  .viewer-note { font-size: 11px; color: var(--subtle); padding-top: 6px; }
  /* Syntax colours drawn from the same six tokens, so code does not become a
     second palette living inside the first. */
  .tok-com  { color: var(--subtle); font-style: italic; }
  .tok-str  { color: var(--syntax-string); }
  .tok-num  { color: var(--syntax-number); }
  .tok-kw   { color: var(--cerulean); }
  .tok-fn   { color: var(--syntax-function); }
  .tok-attr { color: var(--syntax-number); }
  .tok-tag  { color: var(--cerulean); }
  .tok-punc { color: var(--muted); }

  /* ---- empty / onboarding --------------------------------------------- */
  .blank { padding: 56px 28px; max-width: 58ch; }
  .blank h2 { font-weight: 400; font-size: 26px; letter-spacing: 0.01em; margin: 0 0 12px; }
  .blank p { color: var(--muted); margin: 0 0 12px; line-height: 1.65; }
  .blank code {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--raise); border: 0; padding: 2px 6px;
  }

  @media (max-width: 1100px) {
    .shell, body[data-view="agent"] .shell { grid-template-columns: 180px 1fr; }
    .streams { display: none; }
  }
  @media (max-width: 1000px) {
    body[data-view="agent"] .middle,
    body[data-view="agent"][data-picked="true"] .middle {
      grid-template-columns: minmax(150px, 0.38fr) minmax(0, 1fr);
    }
    body[data-view="agent"][data-picked="true"] .middle {
      grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr);
    }
    body[data-view="agent"][data-picked="true"] .treecol { grid-row: 1 / 3; }
    body[data-view="agent"][data-picked="true"] .chatcol { grid-column: 2; grid-row: 1; border-right: 0; }
    body[data-view="agent"][data-picked="true"] .detail { grid-column: 2; grid-row: 2; border-top: 1px solid var(--line); }
  }
  @media (max-width: 700px) {
    .shell, body[data-view="agent"] .shell { grid-template-columns: 1fr; }
    .rail { display: none; }
  }
</style>
</head>
<body>
<!-- The title bar is gone (Andrew, 2026-09-18): the wordmark, the repo
     scope and the presence chips all repeated what the left rail already
     shows, and the connection state moved into the status block down there
     with everything else. What it cost is the window's drag handle, which the
     pane titles now provide -- see the CSS. -->
<div class="titlebar" hidden>
  <span class="wordmark">zevet</span>
  <span class="scope" id="scope"></span>
  <span class="spacer"></span>
  <span class="presence" id="presence"></span>
  <span class="conn" id="conn" data-state="init"><span class="dot"></span><span id="connText">connecting</span></span>
</div>

<div class="shell">
  <aside class="pane rail">
    <div class="pane-title">People</div>
    <div class="pane-body" id="people"></div>
    <div class="strip" id="strip"></div>
    <!-- Only ever shown when there is something to say. A permanent "you are
         up to date" row is a line of chrome that is right 99% of the time and
         therefore never read. -->
    <div class="updaterow" id="updateRow" hidden></div>
    <div class="railfoot">
      <button type="button" class="themer" id="themer" aria-label="Dark theme" aria-pressed="false" title="Light or dark">
        <span class="sky" aria-hidden="true"><span class="sky-circle"></span></span>
        <span class="lbl" id="themeLabel">Light</span>
      </button>
      <button type="button" class="settings-link" id="settingsLink">Settings</button>
    </div>
    <div class="pane-title" style="border-top:1px solid var(--line)">Workspaces</div>
    <div class="ws" id="workspaces"></div>
  </aside>

  <div class="middle">
    <div class="treecol">
      <div class="pane-title" id="filesTitle">Files</div>
      <div class="pane-body" id="treeBody"><div class="tree" id="tree"></div></div>
      <!-- Agent view puts the changed-file list in the tree's SLOT, because it
           is the tree's replacement: same column, same width, same click
           behaviour. It lived in the teammates column for one build, which
           also meant it disappeared with that column on a narrow window --
           taking the only way to reach a file with it. -->
      <div class="pane-body changed" id="changed" hidden></div>
    </div>
    <!-- Agent view's main column. Empty and `display: none` in ide view; the
         consoles are MOVED here rather than duplicated, so there is only ever
         one of each on the page. See renderStreams. -->
    <div class="chatcol">
      <div class="pane-title">Conversation</div>
      <div class="pane-body" id="chat"></div>
    </div>
    <main class="detail">
      <div id="collisions"></div>
      <div class="pane-title" id="detailTitle">Nothing selected</div>
      <div class="pane-body" id="detail"></div>
    </main>
  </div>

  <aside class="pane streams">
    <div class="pane-title" id="streamsTitle">Agents</div>
    <div class="pane-body" id="streams"></div>
  </aside>
</div>

<script src="/highlight.js"></script>
<!-- The editor bundle (CodeMirror 6 + Yjs) and the agent figures. Both are
     served by the hub as static files. They are loaded unconditionally but
     used only in the desktop app: a plain browser tab has no filesystem and
     nothing to edit, and `zevetEditor` simply goes unused there. -->
<script src="/agent-sprites.js"></script>
<script src="/editor.js"></script>
<script>
(function () {
  "use strict";

  var HUES = 5;
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var IDLE_FALLBACK = 90000;

  var events = [];
  var roster = [];
  var collisions = [];
  var idleAfterMs = IDLE_FALLBACK;
  var skewMs = 0;
  var conn = "init";
  var needsToken = false;
  var selectedActor = null;
  var selectedRepo = null;
  var collapsed = Object.create(null);
  var selectedPath = null;

  /**
   * Running inside the desktop app, where there is a real filesystem.
   *
   * In a browser the tree can only be built from the paths agents have named —
   * the hub holds nothing else, by design. In the app there is a disk, so the
   * tree is the REAL folder and the team's presence is overlaid on it. Same
   * board, two levels of truth, and it says which one you are looking at
   * rather than quietly showing a partial tree as if it were the whole repo.
   */
  var LOCAL = typeof window.zevetLocal === "object" && window.zevetLocal && window.zevetLocal.available;
  if (LOCAL && /Mac/.test(navigator.platform || "")) document.body.setAttribute("data-native-mac", "true");
  var localWorkspaces = [];

    // Full slugs: opencode needs provider/model, and these are today's free
    // ones. The free list churns weekly — free text wins, check the catalogue
    // before relying on one.
    opencode: ["", "openrouter/cohere/north-mini-code:free", "openrouter/poolside/laguna-s-2.1:free", "openrouter/nvidia/nemotron-3-super-120b-a12b:free"],

   * whole job is turning untrusted text into HTML, and the correct amount of

        b.addEventListener("click", function () {
          if (localRoot === w.dir) { localRoot = null; localEntries = null; localFile = null; }
          else openLocalRoot(w.dir);
          render();
        });
        host.appendChild(b);
      });
      var add = el("button", "ws-add");
      tx(add, "Open a folder…");
      add.addEventListener("click", function () {
        window.zevetLocal.addWorkspace().then(function (w) {
          if (w) { return refreshLocalWorkspaces().then(function () { openLocalRoot(w.dir); }); }
        });
      });
      host.appendChild(add);
      if (localError) {
        var note = el("div", "ws-note");
        tx(note, localError);
        host.appendChild(note);
      }
      return;
    }

    var list = workspaces();
    list.forEach(function (w) {
      var b = el("button", "ws-item");
      b.dataset.sel = String(selectedRepo === w.repo);
      b.appendChild(tx(el("span"), w.repo));
      if (w.branch) {
        b.appendChild(document.createElement("br"));
        b.appendChild(tx(el("span", "branch"), w.branch));
      }
      b.addEventListener("click", function () {
        selectedRepo = selectedRepo === w.repo ? null : w.repo;
        render();
      });
      host.appendChild(b);
    });
    if (!list.length) {
      var p = el("div");
      p.style.cssText = "color:var(--subtle);font-size:12.5px";
      tx(p, "none yet");
      host.appendChild(p);
    }
  }

  var FILE_SVG =
    '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">' +
    '<path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5L9 1.5Z"/>' +
    '<path d="M9 1.5V5a.5.5 0 0 0 .5.5H13"/></svg>';

  function renderTree(now) {
    var host = $("tree");
    host.textContent = "";
    var built = buildTree();
    var collide = collisionSet();
    var any = Object.keys(built.root.children).length > 0;

    tx($("filesTitle"), selectedRepo ? "Files — " + selectedRepo : "Files");

    if (!any) {
      var box = el("div", "empty-tree");
      tx(box, needsToken
        ? "Sign in to see what the team is working on."
        : "No files touched yet. The tree fills in as agents read and edit — it shows the part of the repo the team is actually in, never file contents.");
      host.appendChild(box);
      return;
    }

    function walk(node, depth, prefix) {
      var names = Object.keys(node.children).sort(function (a, b) {
        var A = node.children[a], B = node.children[b];
        if (A.kind !== B.kind) return A.kind === "dir" ? -1 : 1;
        return a.localeCompare(b);
      });
      names.forEach(function (name) {
        var child = node.children[name];
        var path = prefix ? prefix + "/" + name : name;
        var isDir = child.kind === "dir";
        var open = !collapsed[path];

        var row = el("button", "node");
        row.dataset.kind = child.kind;
        row.dataset.collide = String(Boolean(collide[path]));
        var actorsHere = Object.keys(child.who);
        row.dataset.touched = String(actorsHere.length > 0);
        row.style.paddingLeft = 16 + depth * 14 + "px";

        var label = el("span", "label");
        var caret = el("span", "caret");
        tx(caret, isDir ? (open ? "▾" : "▸") : "");
        label.appendChild(caret);
        if (!isDir) {
          var icon = el("span");
          icon.innerHTML = FILE_SVG;
          label.appendChild(icon.firstChild);
        }
        label.appendChild(tx(el("span", "name"), name));
        row.appendChild(label);

        // Lines and diff, files only. A folder gets none -- see the CSS.
        if (!isDir) {
          var badge = statBadge(path);
          if (badge) row.appendChild(badge);
        }

        var marks = el("span", "marks");
        actorsHere
          .filter(function (a) { return !selectedActor || a === selectedActor; })
          .sort(function (a, b) { return child.who[b] - child.who[a]; })
          .slice(0, 4)
          .forEach(function (a) {
            var m = el("span", "mark");
            m.style.setProperty("--who", hueOf(a));
            m.dataset.stale = String(now - child.who[a] > idleAfterMs);
            m.title = a + " · " + ago(now - child.who[a]) + " ago";
            marks.appendChild(m);
          });
        row.appendChild(marks);

        row.dataset.sel = String(!isDir && selectedPath === path);
        row.addEventListener("click", function () {
          if (isDir) collapsed[path] = open;
          else toggleSelection(path);
          render();
        });
        host.appendChild(row);

        if (isDir && open) walk(child, depth + 1, path);
      });
    }
    walk(built.root, 0, "");
  }

  /* ======================================================================
   * APPEARANCE AND SETTINGS
   * ====================================================================== */

  /**
   * Theme and view mode live in localStorage, not in config.json.
   *
   * They are per-VIEWER preferences, not machine configuration: two people
   * looking at the same hub from two machines should not have to agree about
   * dark mode, and nothing about them needs to survive a reinstall. That also
   * keeps them out of the file the hub's page can ask the main process for.
   *
   * ⚠️ EVERY ACCESS IS WRAPPED. localStorage throws outright in a private
   * window and when site data is blocked, and this runs before the board draws
   * anything -- an uncaught throw here is a blank app, not a missing
   * preference.
   */
  function pref(key, fallback) {
    try {
      var v = window.localStorage.getItem("zevet." + key);
      return v == null ? fallback : v;
    } catch (err) {
      return fallback;
    }
  }
  function setPref(key, value) {
    try {
      window.localStorage.setItem("zevet." + key, value);
    } catch (err) {
      // Nothing to do: the preference applies for this session and is forgotten.
    }
  }

  var theme = pref("theme", "light") === "dark" ? "dark" : "light";
  var viewMode = pref("view", "ide") === "agent" ? "agent" : "ide";

  /**
   * Applying the theme is three things, and the third is the one that is easy
   * to forget: the NATIVE WINDOW has to follow. Andrew's complaint was that the
   * app's outline is his machine's accent blue and stays visible in full
   * screen; the page cannot paint that, so the main process is told and sets
   * the title bar overlay and the window background itself.
   */
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var t = $("themer");
    if (t) t.setAttribute("aria-pressed", String(theme === "dark"));
    var l = $("themeLabel");
    if (l) tx(l, theme === "dark" ? "Dark" : "Light");
    if (LOCAL && typeof window.zevetLocal.chrome === "function") {
      // Read back from the stylesheet rather than repeating the hex here. One
      // definition of the palette, in :root, is the entire reason the theme is
      // nine token values and not a second stylesheet.
      var css = getComputedStyle(document.documentElement);
      window.zevetLocal.chrome({
        theme: theme,
        paper: (css.getPropertyValue("--paper") || "").trim(),
        ink: (css.getPropertyValue("--ink") || "").trim(),
        cerulean: (css.getPropertyValue("--cerulean") || "").trim(),
        line: (css.getPropertyValue("--line") || "").trim(),
      });
    }
  }

  function applyView() {
    document.body.setAttribute("data-view", viewMode);
    var st = $("streamsTitle");
    // In agent view this column is a summary of other people, not a place you
    // read a transcript. The heading should say which.
    if (st) tx(st, viewMode === "agent" ? "Teammates" : "Agents");
    // The console lives in a different column in each view, so a view change
    // has to re-render or the transcript stays in the column that is now
    // hidden — which looked exactly like the agent had died.
    render();
    // The editor measures itself on mount; a layout change under it leaves the
    // scroller the wrong height until something else forces a measure.
    if (ed && ed.view && ed.view.requestMeasure) {
      setTimeout(function () { try { ed.view.requestMeasure(); } catch (err) { /* torn down */ } }, 60);
    }
  }

  function setTheme(next) {
    theme = next === "dark" ? "dark" : "light";
    setPref("theme", theme);
    applyTheme();
    // CodeMirror's highlight style is not a CSS variable -- it is compiled into
    // the editor's own stylesheet -- so the open editor has to be told. It
    // swaps a compartment rather than rebuilding, keeping the cursor, the
    // selection, the scroll position and the undo history.
    if (ed && ed.setDark) ed.setDark(theme === "dark");
    // The riders' eye holes are painted in the surface colour behind them, and
    // that colour just changed.
    if (ed) drawRiders(ed);
  }

  function setView(next) {
    viewMode = next === "agent" ? "agent" : "ide";
    setPref("view", viewMode);
    applyView();
    render();
  }

  /* ---- the settings sheet ---------------------------------------------- */

  var sheetOpen = false;
  var sheetReturnFocus = null;
  var indexState = null;      // the last answer from indexStatus()
  var indexProgressText = "";
  var indexBarPct = 0;

  function openSettings() {
    if (!sheetOpen) sheetReturnFocus = document.activeElement;
    sheetOpen = true;
    refreshIndexStatus();
    refreshWhoami();
    renderSheet();
  }
  function closeSettings() {
    sheetOpen = false;
    renderSheet();
    var target = sheetReturnFocus && sheetReturnFocus.isConnected ? sheetReturnFocus : $("settingsLink");
    if (target) target.focus();
    sheetReturnFocus = null;
  }

  function sheetKeydown(ev) {
    if (ev.key === "Escape") {
      ev.preventDefault();
      ev.stopPropagation();
      closeSettings();
      return;
    }
    if (ev.key !== "Tab") return;
    var sheet = ev.currentTarget;
    var controls = Array.from(sheet.querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href], [tabindex='0']"))
      .filter(function (node) { return node.getClientRects().length; });
    var first = controls[0];
    var last = controls[controls.length - 1];
    if (!first) { ev.preventDefault(); sheet.focus(); return; }
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
      ev.preventDefault(); last.focus();
    } else if (!ev.shiftKey && (document.activeElement === last || document.activeElement === sheet)) {
      ev.preventDefault(); first.focus();
    }
  }

  function refreshIndexStatus() {
    if (!LOCAL || typeof window.zevetLocal.indexStatus !== "function") return;
    window.zevetLocal.indexStatus(localRoot).then(function (r) {
      if (r && r.ok) { indexState = r; if (sheetOpen) renderSheet(); }
    }, function () { /* the section simply says it cannot tell */ });
  }

  function srow(k, v, mono) {
    var row = el("div", "srow");
    row.appendChild(tx(el("span", "k"), k));
    var val = el("span", mono ? "v mono" : "v");
    if (typeof v === "string" || typeof v === "number") tx(val, String(v));
    else if (v) val.appendChild(v);
    row.appendChild(val);
    return row;
  }

  function section(title) {
    var box = el("div", "sset");
    box.appendChild(tx(el("h3"), title));
    return box;
  }

  function renderSheet() {
    var existing = $("sheet");
    var back = $("sheetBack");
    var active = document.activeElement;
    var focusId = existing && existing.contains(active) ? active.id : null;
    var invitation = $("settingsInvite");
    var draft = invitation ? { value: invitation.value, start: invitation.selectionStart, end: invitation.selectionEnd } : null;
    var scrollTop = existing ? existing.scrollTop : 0;
    if (existing) existing.remove();
    if (back) back.remove();
    var shell = document.querySelector(".shell");
    if (shell) shell.inert = sheetOpen;
    if (!sheetOpen) return;

    var b = el("div", "sheet-back");
    b.id = "sheetBack";
    b.addEventListener("click", closeSettings);
    document.body.appendChild(b);

    var sheet = el("div", "sheet");
    sheet.id = "sheet";
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-label", "Settings");
    sheet.setAttribute("aria-modal", "true");
    sheet.tabIndex = -1;
    sheet.addEventListener("keydown", sheetKeydown);

    var head = el("div", "sheet-head");
    head.appendChild(tx(el("h2"), "Settings"));
    var close = el("button", "sheet-close");
    close.type = "button";
    close.id = "settingsClose";
    tx(close, "Close");
    close.addEventListener("click", closeSettings);
    head.appendChild(close);
    sheet.appendChild(head);

    /* ---- appearance --------------------------------------------------- */
    var look = section("Appearance");
    var themeBtn = el("button", "sbtn");
    themeBtn.type = "button";
    themeBtn.id = "settingsTheme";
    tx(themeBtn, theme === "dark" ? "Switch to light" : "Switch to dark");
    themeBtn.addEventListener("click", function () {
      setTheme(theme === "dark" ? "light" : "dark");
      renderSheet();
    });
    look.appendChild(srow("Theme", themeBtn));
    sheet.appendChild(look);

    /* ---- view mode ------------------------------------------------------
     * Two ways to use the same board. IDE is what zevet has always been: a
     * tree, an editor, and the agents beside them. Agent view is for driving
     * the agents and reading what they say, with the editor out of the way.
     *
     * A MODE, not a separate app: both draw from the same state and the same
     * sockets, and switching is one attribute on <body>. A second layout that
     * forked the data would be two boards to keep in step.
     */
    var view = section("View");
    var modes = [
      ["ide", "IDE", "Files, editor and shared cursors."],
      ["agent", "Agent", "Agent conversations with a compact editor."],
    ];
    modes.forEach(function (m) {
      var btn = el("button", "sbtn");
      btn.type = "button";
      btn.id = "settingsView-" + m[0];
      btn.style.marginRight = "8px";
      btn.disabled = viewMode === m[0];
      tx(btn, m[1] + (viewMode === m[0] ? " · on" : ""));
      btn.addEventListener("click", function () { setView(m[0]); renderSheet(); });
      var row = el("div", "srow");
      row.appendChild(btn);
      var note = el("span", "v");
      note.style.color = "var(--muted)";
      note.style.fontSize = "11.5px";
      tx(note, m[2]);
      row.appendChild(note);
      view.appendChild(row);
    });
    sheet.appendChild(view);

    /* ---- what it can open ----------------------------------------------
     * ⚠️ THE HONEST HEADING IS "FOLDERS", NOT "GITHUB REPOS".
     *
     * Andrew asked for "a way to edit the github repos it can access (default
     * should be all, but that might mean we need to build in github oauth)".
     * zevet does not talk to GitHub at all -- not once, anywhere in the
     * codebase. What it can read is folders on THIS machine that were picked
     * with the native file dialog, and that list is the whole access model:
     * `knownRoot()` in main.js refuses every path that is not on it.
     *
     * So this section edits the real thing rather than a GitHub-shaped
     * illusion over it. "Default should be all" is answered honestly too: the
     * default is nothing until you pick a folder, because an app that could
     * read every repo on the disk the moment it started would be a worse
     * default than one that asks.
     */
    var repos = section("Folders");
    if (!LOCAL) {
      var noLocal = el("p", "snote");
      tx(noLocal, "Use the desktop app to open local folders.");
      repos.appendChild(noLocal);
    } else {
      if (!localWorkspaces.length) {
        var none = el("p", "snote");
        tx(none, "Add a folder to give zevet access.");
        repos.appendChild(none);
      }
      localWorkspaces.forEach(function (w) {
        var row = el("div", "srow");
        var k = el("span", "k");
        tx(k, w.name + (w.repo ? "" : "  (not a git repo)"));
        row.appendChild(k);
        var v = el("span", "v mono");
        tx(v, w.dir);
        row.appendChild(v);
        repos.appendChild(row);
      });
      var add = el("button", "sbtn");
      add.type = "button";
      tx(add, "Add a folder…");
      add.style.marginTop = "10px";
      add.addEventListener("click", function () {
        window.zevetLocal.addWorkspace().then(function () {
          refreshLocalWorkspaces().then(renderSheet);
        });
      });
      repos.appendChild(add);

      var note = el("p", "snote");
      tx(note, "GitHub sign-in identifies your account. Folder access is limited to the list above.");
      repos.appendChild(note);
    }
    sheet.appendChild(repos);

    /* ---- who is on this hub -------------------------------------------- */
    sheet.appendChild(accountSection());

    /* ---- the code index ------------------------------------------------ */
    sheet.appendChild(indexSection());

    /* ---- connection ---------------------------------------------------- */
    var conn = section("Connection");
    conn.appendChild(srow("Hub", (window.__zevetHub || location.origin), true));
    conn.appendChild(srow("You", myActor || "unknown"));
    conn.appendChild(srow("Credential", credentialLabel()));
    sheet.appendChild(conn);

    sheet.appendChild(versionSection());

    document.body.appendChild(sheet);
    var nextInvitation = $("settingsInvite");
    if (draft && nextInvitation) {
      nextInvitation.value = draft.value;
      nextInvitation.setSelectionRange(draft.start, draft.end);
    }
    var nextFocus = focusId && $(focusId);
    if (!nextFocus || !sheet.contains(nextFocus) || nextFocus.disabled) nextFocus = close;
    nextFocus.focus({ preventScroll: true });
    sheet.scrollTop = scrollTop;
  }

  /**
   * What version this is, and a way to ask now rather than wait for the timer.
   *
   * The button exists because the check runs 25 seconds after launch and then
   * every six hours, which is right for a background task and useless to
   * somebody who has just been told over chat that a new build is out.
   */
  function versionSection() {
    var box = section("Version");
    box.id = "versionSection";
    if (!LOCAL || typeof window.zevetLocal.updateStatus !== "function") {
      var na = el("p", "snote");
      tx(na, "Get the latest version at usemasora.com/zevet.");
      box.appendChild(na);
      return box;
    }
    var s = updateState || {};
    box.appendChild(srow("Installed", s.current || "unknown"));
    var status = srow("Status", updateStatusText(s));
    status.setAttribute("aria-live", "polite");
    box.appendChild(status);
    if (s.phase === "downloading") box.appendChild(updateProgress(s, "sbar"));

    var actions = el("div", "update-actions");
    if (canInstallUpdate(s)) actions.appendChild(updateInstallButton("sbtn"));
    if (typeof window.zevetLocal.updateCheck === "function") actions.appendChild(updateCheckButton("sbtn"));
    box.appendChild(srow("Updates", actions));
    appendUpdateFeedback(box, "snote");
    return box;
  }

  function credentialLabel() {
    var c = window.__zevetCfg;
    if (!c) return "unknown";
    if (c.legacy) return "legacy token · run setup for shared editing";
    // A GitHub session and the master secret normally sit side by side: the
    // session is what the hub checks, the secret is what the editor derives its
    // document key from. Naming only one of them makes the other look missing.
    if (c.session) return "GitHub sign-in" + (c.hasSecret ? " + team key" : " · team key missing");
    return c.hasSecret ? "team key" : "none configured";
  }

  /* ======================================================================
   * ACCOUNT — who is signed in, and who else may sign in
   *
   * Everything here comes from the hub's `/auth/whoami`, which the board can
   * reach with the cookie it already has. Nothing about the account lives in
   * the desktop bridge, on purpose: the allowlist is the hub's to enforce, and
   * a renderer that could edit it locally would be editing a copy.
   *
   * ⚠️ THE ADD/REMOVE CONTROLS ARE ONLY DRAWN FOR THE OWNER, and that is a
   * COURTESY, NOT THE CHECK. The hub answers 403 to anybody else whatever this
   * pane draws — hiding a button is a UI decision and never an authorisation
   * one. See /auth/allow in hub/server.mjs.
   * ==================================================================== */
  var whoState = null;
  var whoBusy = false;

  function refreshWhoami() {
    fetch("/auth/whoami", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (r) {
        if (r && r.ok) { whoState = r; if (sheetOpen) renderSheet(); }
      }, function () { /* the section says it cannot tell */ });
  }

  /**
   * Connect GitHub from Settings, without re-running setup.
   *
   * A machine set up with the team key (or before sign-in existed) had no way
   * back to the device flow: the Account section said "run setup", and setup
   * is a full re-onboarding. This runs the same three calls setup.html uses
   * (`githubStart` paints the code, `githubWait` resolves on Authorize,
   * `githubCancel` backs out) against the hub this board already shows.
   * Secrets never cross: start/wait return a code, a URL and a login, and the
   * main process writes the config — see preload.js. onDone(true) means
   * re-read whoami and the redacted config, because both changed under us.
   */
  function githubConnectBox(onDone) {
    var box = el("div", "srow");
    var btn = el("button", "sbtn");
    btn.type = "button";
    tx(btn, "Connect GitHub");
    var msg = el("span", "v");
    box.appendChild(btn);
    box.appendChild(msg);
    var waiting = false;

    function fail(text) {
      waiting = false;
      msg.textContent = "";
      tx(msg, text);
      btn.disabled = false;
      tx(btn, "Retry");
    }

    // One listener and a flag, never two handlers: cancelling must not also
    // start a second flow.
    btn.addEventListener("click", function () {
      if (waiting) {
        window.zevet.githubCancel();
        waiting = false;
        msg.textContent = "";
        tx(btn, "Connect GitHub");
        return;
      }
      btn.disabled = true;
      tx(btn, "Starting…");
      msg.textContent = "";
      var hub = (window.__zevetCfg && window.__zevetCfg.hub) || undefined;
      window.zevet.githubStart(hub).then(function (r) {
        if (!r || !r.ok) { fail((r && r.error) || "Could not start sign-in."); return; }
        waiting = true;
        btn.disabled = false;
        tx(btn, "Cancel");
        msg.textContent = "";
        tx(msg, "Approve on GitHub: " + r.userCode);
        window.zevet.githubWait().then(function (done) {
          waiting = false;
          if (!done || !done.ok) {
            if (done && done.cancelled) { msg.textContent = ""; tx(btn, "Connect GitHub"); return; }
            fail((done && done.error) || "Sign-in failed.");
            return;
          }
          msg.textContent = "";
          tx(msg, "Signed in as @" + done.login + ".");
          tx(btn, "Connect GitHub");
          if (typeof onDone === "function") onDone(true);
        }, function (err) {
          fail((err && err.message) || "Sign-in failed.");
        });
      }, function (err) {
        fail((err && err.message) || "Could not start sign-in.");
      });
    });
    return box;
  }

  function accountSection() {
    var box = section("Account");
    if (!whoState) {
      var loading = el("p", "snote");
      tx(loading, "Loading account…");
      box.appendChild(loading);
      return box;
    }

    box.appendChild(srow("Signed in as", whoState.login ? "@" + whoState.login : "not signed in"));

    if (whoState.shared) {
      // A hook-only machine, or an install that predates sign-in. It works; it
      // is just anonymous, and saying so beats showing a blank name.
      // The button runs the same device flow as setup — no re-onboarding — but
      // only where the desktop bridge exists to finish it. A plain browser tab
      // has no bridge and gets the note without the button.
      var canConnect = whoState.githubSignIn && LOCAL && window.zevet &&
        typeof window.zevet.githubStart === "function";
      var sh = el("p", "snote");
      tx(sh, "Connected with a team key." + (whoState.githubSignIn
        ? (canConnect ? "" : " Open the desktop app to sign in with GitHub.")
        : " GitHub sign-in is unavailable on this hub."));
      box.appendChild(sh);
      if (canConnect && !whoState.login) {
        box.appendChild(githubConnectBox(function () {
          refreshWhoami();
          if (window.zevet && typeof window.zevet.config === "function") {
            window.zevet.config().then(function (c) {
              if (c) window.__zevetCfg = c;
              if (sheetOpen) renderSheet();
            }, function () { if (sheetOpen) renderSheet(); });
          }
        }));
      }
    }

    var people = whoState.people || [];
    if (people.length) {
      var list = el("div");
      list.style.marginTop = "8px";
      people.forEach(function (p) {
        var row = el("div", "srow");
        var k = el("span", "k");
        tx(k, "@" + p.login + (p.owner ? "  · owner" : p.pending ? "  · invited" : ""));
        row.appendChild(k);
        var v = el("span", "v");
        if (whoState.owner && !p.owner) {
          var rm = el("button", "sbtn");
          rm.type = "button";
          rm.disabled = whoBusy;
          tx(rm, "Remove");
          rm.addEventListener("click", function () { changePeople("/auth/revoke", p.login); });
          v.appendChild(rm);
        }
        row.appendChild(v);
        list.appendChild(row);
      });
      box.appendChild(list);
    }

    if (whoState.owner) {
      var form = el("form", "row");
      form.style.marginTop = "10px";
      var input = el("input", "mono");
      input.type = "text";
      input.id = "settingsInvite";
      input.setAttribute("aria-label", "GitHub username");
      input.placeholder = "GitHub username";
      input.autocomplete = "off";
      input.spellcheck = false;
      var add = el("button", "sbtn");
      add.type = "submit";
      add.disabled = whoBusy;
      tx(add, "Invite");
      form.appendChild(input);
      form.appendChild(add);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var v = input.value.trim();
        if (v) changePeople("/auth/allow", v);
      });
      box.appendChild(form);

      var howto = el("p", "snote");
      tx(howto, "Send them this hub’s address. They can sign in with GitHub after installing zevet.");
      box.appendChild(howto);
    }

    if (whoErr) {
      var e = el("p", "snote");
      tx(e, whoErr);
      box.appendChild(e);
    }
    return box;
  }

  var whoErr = "";

  function changePeople(route, login) {
    whoBusy = true;
    whoErr = "";
    renderSheet();
    fetch(route, {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ login: login }),
    })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (r) {
        whoBusy = false;
        if (r.status === 200 && r.body.people) whoState.people = r.body.people;
        else whoErr = r.body.error || ("The hub answered " + r.status + ".");
        renderSheet();
      }, function (err) {
        whoBusy = false;
        whoErr = "Could not reach the hub: " + err.message;
        renderSheet();
      });
  }

  function indexSection() {
    var box = section("Code index");

    /* ⚠️ THE EXTERNAL INDEX WINS, AND IT IS CHECKED FIRST.
     *
     * There are two different things called "the code index" and this section
     * used to show only one of them. `machine.cindex` is status-sources.js's
     * liveness probe on a TCP port -- a SEPARATE index process the user runs
     * themselves, and the thing the status strip reports as "cindex on".
     * Everything below is zevet's OWN built-in index: a model to download, a
     * vector store, a button that spends minutes of CPU.
     *
     * Andrew, 2026-09-19: "the cindex build in settings shouldn't be available
     * if the user already has cindex on. it's downloaded on my machine and
     * zevet reads that and says cindex on, but i still have the download
     * option in settings." He is right, and the bug is not that the two are
     * the same -- index-capability.js is emphatic that they are not -- it is
     * that the UI showed one of them while the strip showed the other, six
     * inches apart, with no word connecting them. Offering an 86 MB download
     * to somebody who already has a working index is the app failing to read
     * its own status bar. */
    if (machine && machine.cindex === true) {
      box.appendChild(srow("Status", "external index running"));
      var ext = el("p", "snote");
      tx(ext, "External index on port " + (machine.cindexPort || 8080) + ". Stop it to use zevet’s built-in index.");
      box.appendChild(ext);
      return box;
    }

    if (!LOCAL || typeof window.zevetLocal.indexStatus !== "function") {
      var na = el("p", "snote");
      tx(na, "Not available in this build.");
      box.appendChild(na);
      return box;
    }
    if (!indexState) {
      var loading = el("p", "snote");
      tx(loading, "Checking this machine…");
      box.appendChild(loading);
      return box;
    }

    var m = indexState.measured || {};
    box.appendChild(srow("This machine", m.totalMemMB
      ? Math.round(m.totalMemMB / 1024) + " GB RAM · " + m.cores + " cores · " +
        Math.round((m.freeDiskMB || 0) / 1024) + " GB free"
      : "could not be measured"));

    if (!indexState.capable) {
      box.appendChild(srow("Status", "not enabled on this machine"));
      var why = el("p", "snote");
      // The reasons are the capability module's own words, chosen to be
      // actionable. Summarising them here would lose that.
      tx(why, indexState.reasons.join("  ·  "));
      box.appendChild(why);
      var stillFine = el("p", "snote");
      tx(stillFine, "Other features remain available.");
      box.appendChild(stillFine);
      return box;
    }

    var stats = indexState.stats;
    box.appendChild(srow("Model", indexState.model.present
      ? "downloaded (" + Math.round(indexState.model.bytes / 1048576) + " MB)"
      : "not downloaded yet (about 86 MB)"));
    box.appendChild(srow("Index", stats
      ? stats.files + " files · " + stats.chunks + " chunks"
      : "not built for this folder"));

    var btn = el("button", "sbtn");
    btn.type = "button";
    btn.style.marginTop = "10px";
    btn.disabled = !localRoot || indexState.building;
    tx(btn, indexState.building ? "Building…" : (stats ? "Refresh the index" : "Build the index"));
    btn.addEventListener("click", function () {
      indexProgressText = "starting…";
      indexBarPct = 0;
      renderSheet();
      window.zevetLocal.indexEnable(localRoot).then(function (r) {
        indexProgressText = r && r.ok
          ? "done — " + r.indexed + " indexed, " + r.skipped + " skipped"
          : "failed: " + ((r && r.error) || "unknown");
        refreshIndexStatus();
        renderSheet();
      });
    });
    box.appendChild(btn);

    if (!localRoot) {
      var pick = el("p", "snote");
      tx(pick, "Open a folder to build its index.");
      box.appendChild(pick);
    }

    if (indexProgressText) {
      var p = el("p", "snote");
      tx(p, indexProgressText);
      box.appendChild(p);
    }
    if (indexBarPct > 0 && indexBarPct < 100) {
      var bar = el("div", "sbar");
      var fill = el("span");
      fill.style.width = indexBarPct + "%";
      bar.appendChild(fill);
      box.appendChild(bar);
    }

    var cost = el("p", "snote");
    tx(cost, "The index is built and stored on this machine.");
    box.appendChild(cost);
    return box;
  }

  /* ======================================================================
   * THE STATUS STRIP
   *
   * Andrew asked for "all of the elements in my statusline, but built into the
   * zevet UI" (2026-09-18). The original is ~/.claude/statusline.py. Its nine
   * segments land here in three groups:
   *
   *   FROM THE AGENT STREAM, live, with no polling: model, context tokens,
   *   cache hit rate, cost. zevet already receives every stream-json line from
   *   the agents it launches -- `onAgentEvent` hands them over as
   *   {type:"agent", payload} -- and until now threw the usage away.
   *
   *   FROM THE MACHINE, on a timer: the vault graph, the code index probe, the
