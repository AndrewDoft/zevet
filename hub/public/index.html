   *   repo's branch and ahead/behind, and zevet's own hook health. Those come
   *   over `zevetLocal.status()`.
   *
   *   NOT AT ALL: the 5h and 7d rate-limit windows. They reach statusline.py
   *   because Claude Code hands them to the status line command in its payload;
   *   a headless agent's stream-json does not carry them, and there is nowhere
   *   else to get them. What is shown instead is "spent", zevet's own count of
   *   what the agents IT started have used. ⚠️ THAT IS NOT THE RATE LIMIT and
   *   must never be labelled as one -- see desktop/status-sources.js, which
   *   says the same thing twice because it matters.
   *
   * ⚠️ THE USAGE RULES ARE DUPLICATED, deliberately and in exactly two places:
   * here, for live display, and in desktop/status-sources.js, for the rolling
   * windows the main process keeps. They must agree. If you change what counts
   * as "context" in one, change it in the other -- and the rule is INPUT PLUS
   * BOTH CACHE FIELDS AND NOT OUTPUT, because this turn's output is already
   * inside next turn's input and adding it double-counts. statusline.py carries
   * a comment about having made that mistake; this is the second and third
   * place it could be made again.
   * ====================================================================== */

  var live = { model: null, context: 0, cacheHit: null, cost: null };
  var machine = null;          // the answer from zevetLocal.status(), or null
  var STATUS_EVERY_MS = 4000;

  /** The usage on one stream-json line, or null. See the warning above. */
  function usageOf(payload) {
    if (!payload || typeof payload !== "object") return null;
    var u = (payload.message && payload.message.usage) || payload.usage || null;
    // opencode `--format json` reports per-step tokens at part.tokens, with no
    // cache fields. Same rule as above: input, no output (next turn's input
    // already contains this turn's output). Must agree with usageFrom() in
    // desktop/status-sources.js — change one, change both.
    if ((!u || typeof u !== "object") && payload.part && payload.part.tokens && typeof payload.part.tokens === "object") {
      var ti = payload.part.tokens;
      var n2 = function (v) { return typeof v === "number" && isFinite(v) ? v : 0; };
      var cx = n2(ti.input);
      if (!cx && !n2(ti.output)) return null;
      return { context: cx, cacheHit: cx > 0 ? 0 : null, model: null };
    }
    if (!u || typeof u !== "object") return null;
    var n = function (v) { return typeof v === "number" && isFinite(v) ? v : 0; };
    var read = n(u.cache_read_input_tokens);
    var context = n(u.input_tokens) + read + n(u.cache_creation_input_tokens);
    if (!context && !n(u.output_tokens)) return null;
    return {
      context: context,
      // Null, not zero, when there was no input at all: "no data" and "nothing
      // was cached" are opposite readings, and one of them means this turn is
      // being paid for at full rate.
      cacheHit: context > 0 ? (read / context) * 100 : null,
      model: (payload.message && payload.message.model) || payload.model || null,
    };
  }

  /** Fold one agent event into the live figures. Called from onAgentEvent. */
  function noteAgentPayload(payload) {
    if (!payload) return;
    if (payload.type === "system" && typeof payload.model === "string") live.model = payload.model;
    var u = usageOf(payload);
    if (u) {
      live.context = u.context;
      if (u.cacheHit != null) live.cacheHit = u.cacheHit;
      if (u.model) live.model = u.model;
    }
    // total_cost_usd is a RUNNING SESSION TOTAL, reported on the result line.
    // It replaces; summing it multiplies the bill by the number of turns.
    if (typeof payload.total_cost_usd === "number") live.cost = payload.total_cost_usd;
    renderStrip();
  }

  function pollStatus() {
    if (!LOCAL || typeof window.zevetLocal.status !== "function") return;
    // The root is passed so the branch segment describes the workspace the
    // person is actually looking at, not whichever one was opened first.
    window.zevetLocal.status(localRoot).then(function (r) {
      if (!r || !r.ok) return;
      // `cindex` decides what the Code index section is allowed to offer, so a
      // flip while the sheet is open has to reach the sheet too -- otherwise
      // stopping the external index leaves a stale "already running" panel
      // that only a close-and-reopen clears.
      var was = machine && machine.cindex;
      machine = r;
      renderStrip();
      if (sheetOpen && was !== r.cindex) renderSheet();
    }, function () { /* a status probe that fails simply shows nothing */ });
  }

  /** Eight steps of block, the same device statusline.py uses. */
  var BLOCKS = "\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588";
  function bar(pct, width) {
    var w = width || 8;
    var filled = Math.max(0, Math.min(w, Math.round((pct / 100) * w)));
    var out = "";
    for (var i = 0; i < w; i++) out += i < filled ? BLOCKS[BLOCKS.length - 1] : BLOCKS[0];
    return out;
  }

  /** Tokens, at a width that does not make the strip jump. Past a million the
   *  thousands stop carrying information and start costing three characters:
   *  "3.9M" says the same thing as "3870k" and says it in a column that does
   *  not widen as the number grows. */
  function tokens(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
    return (n / 1000).toFixed(0) + "k";
  }

  /** Colour on ABSOLUTE size, not on a share of the window: cost scales with
   *  the tokens carried per turn, not with how much of a 1M window is left.
   *  Thresholds are statusline.py's, in thousands. */
  function tint(v, warn, bad) {
    return v >= bad ? "bad" : v >= warn ? "warn" : "ok";
  }

  function seg(parts) {
    var n = el("span", "seg");
    parts.forEach(function (p) {
      if (p == null) return;
      n.appendChild(typeof p === "string" ? tx(el("span"), p) : p);
    });
    return n;
  }
  function span(cls, text) { return tx(el("span", cls), text); }

  function renderStrip() {
    var host = $("strip");
    if (!host) return;
    var segs = [];

    if (live.model) segs.push(seg([span("dim", live.model)]));

    // repo:branch @sha ^ahead vbehind
    var repo = machine && machine.repo;
    if (repo && repo.branch) {
      var r = [span("v", repo.branch)];
      if (repo.sha) r.push(span("dim", "@" + repo.sha));
      // Nulls mean "no upstream" or "upstream gone" and are shown as nothing at
      // all. Zeros mean in step and are worth showing, quietly.
      if (repo.ahead) r.push(span("warn", "\u2191" + repo.ahead));
      if (repo.behind) r.push(span("warn", "\u2193" + repo.behind));
      segs.push(seg(r));
    }

    if (live.context) {
      var k = live.context / 1000;
      var c = tint(k, 180, 300);
      segs.push(seg([
        span("k", "ctx"),
        span(c, tokens(live.context)),
        // statusline.py fills the bar at `tokens / 3000`, i.e. full at 300k.
        // `k` is ALREADY in thousands, so the divisor here is 3 and not 3000 --
        // and not 30, which is what it was and which drew 197k as one block out
        // of eight.
        span("bar " + c, bar(Math.min(100, k / 3))),
      ]));
    }

    if (live.cacheHit != null) {
      // Inverted: high is cheap. A DROP is the interesting event.
      var h = live.cacheHit;
      segs.push(seg([span("k", "cache"), span(h < 50 ? "bad" : h < 85 ? "warn" : "ok", h.toFixed(0) + "%")]));
    }

    // Spent, NOT the rate limit. The label says "spent" for that reason.
    var burn = machine && machine.burn;
    if (burn) {
      var b = [span("k", "spent")];
      ["5h", "7d"].forEach(function (w) {
        if (burn[w] && burn[w].tokens) {
          b.push(span("dim", w));
          b.push(span("v", tokens(burn[w].tokens)));
        }
      });
      if (b.length > 1) segs.push(seg(b));
    }

    // The rolling total across every agent zevet has launched, when the main
    // process is keeping one; the current session's own figure otherwise. The
    // rolling one is the more useful of the two and the only one that survives
    // a console being closed.
    var cost = burn && typeof burn.cost === "number" && burn.cost > 0 ? burn.cost : live.cost;
    if (typeof cost === "number" && cost > 0) {
      segs.push(seg([span("dim", "$" + cost.toFixed(2))]));
    }

    // The hub connection. It used to be a dot in the title bar; that bar is
    // gone and this is the only place it is still said, so it leads.
    var cs = $("conn") && $("conn").dataset.state;
    if (cs) {
      segs.push(seg([
        span(cs === "live" ? "ok" : cs === "down" ? "bad" : "warn", cs === "live" ? "live" : cs),
      ]));
    }

    if (machine && typeof machine.cindex === "boolean") {
      segs.push(seg([span("k", "cindex"), span(machine.cindex ? "ok" : "warn", machine.cindex ? "on" : "off")]));
    }

    var g = machine && machine.graph;
    if (g && g.state !== "missing") {
      // The same precedence the original uses: errors, then open reports, then
      // staleness, then sync. Two readouts of one system that disagree about
      // which problem matters most are worse than one readout.
      var cls = g.state === "errors" ? "bad" : g.state === "ok" ? "ok" : "warn";
      var gs = [span("k", "graph")];
      if (g.state === "ok") {
        gs.push(span("ok", String(g.count == null ? "" : g.count)));
        if (g.head) gs.push(span("dim", g.head + (g.detail ? " " + g.detail : "")));
      } else {
        gs.push(span(cls, (g.count == null ? "" : g.count + " ") + g.detail));
      }
      segs.push(seg(gs));
    }

    var hook = machine && machine.hook;
    if (hook && hook.failedAgo != null) {
      // A hook that throws exits 0 and writes to stderr, which nothing displays,
      // so a broken hook silently does nothing indefinitely. Only recent
      // failures are shown: an old log is history, not a problem.
      segs.push(seg([span("bad", "hook fail"), span("dim", hook.failedAgo)]));
    }

    host.textContent = "";
    segs.forEach(function (n, i) {
      if (i) host.appendChild(span("sep", "|"));
      host.appendChild(n);
    });
  }

  /* ======================================================================
   * THE EDITOR
   *
   * One file at a time, opened from the tree. The document lives in a Y.Doc;
   * CodeMirror is bound to it; the main process carries sealed updates to and
   * from the hub. Disk stays the source of truth in the sense that matters:
   * everything typed here is written back to the file, and everything an agent
   * writes to the file is folded back into here.
   *
   * WARNING: THE ROOM NAME MUST BE IDENTICAL ON EVERY MACHINE, or two people
   * editing the same file sit in two different rooms and never see each other.
   * It is `<repo>:<repo-relative path>`, both of which the hook already
   * normalises for exactly this reason (see the note in client/hook.mjs about
   * Andrew's `C:\dev\masora\src\db.ts` and Kai's
   * `/Users/kai/code/masora/src/db.ts` being the same file). The repo name
   * comes from the event stream when there is one and from the folder name
   * when there is not, and THOSE TWO CAN DISAGREE -- a teammate who cloned
   * into a differently-named directory lands in a different room and sees an
   * empty file with nobody in it. Not fixed here. The fix is for the hook to
   * publish a repo identity that everyone derives the same way.
   * ====================================================================== */

  var ed = null;                          // the open editor, or null
  var docStatus = Object.create(null);    // room -> { state, detail }

  /** Yjs holds the text under this key. It is a constant shared by every
   *  client; changing it orphans every document already in a room. */
  var Y_TEXT = "content";

  /**
   * WARNING: A FIXED CLIENT ID FOR SEEDING, AND IT IS LOAD-BEARING.
   *
   * When a room is empty, somebody has to put the file's contents into it. If
   * two people open the same fresh file at the same moment, both find it empty
   * and both seed -- and because Yjs inserts are not idempotent, the room ends
   * up holding the file TWICE. Which then gets written to everyone's disk.
   *
   * Yjs deduplicates by (clientID, clock). So the seed is produced in a
   * throwaway doc whose clientID is this constant, which makes two independent
   * seeds of the same text byte-identical and therefore one operation after
   * the merge rather than two.
   *
   * The remaining hole, stated plainly: if the two machines' copies of the file
   * DIFFER, the two seeds collide on (clientID, clock) carrying different
   * content and one of them silently wins. That is a bad outcome. It is a far
   * better one than the document containing both copies concatenated, which is
   * what happens without this. The real fix is an acknowledgement from the hub
   * that a replay is complete, so a client can tell "this room is empty" from
   * "this room has not finished talking to me"; hub/server.mjs deliberately has
   * no such ack, and its own notes say so.
   */
  var SEED_CLIENT_ID = 1;

  /**
   * ⚠️ EVERY MESSAGE ON THE DOCUMENT CHANNEL CARRIES A ONE-BYTE TAG, because
   * two completely different protocols share that channel.
   *
   * This was missed the first time and the bug is worth recording: document
   * updates were transmitted and AWARENESS WAS NOT, at all. `yCollab` publishes
   * the local cursor into the Awareness instance quite happily, and nothing
   * ever put those bytes on the wire — so remote carets and the little figures
   * could never appear, on any machine, ever. Two real instances editing one
   * file synced their text perfectly and showed each other nothing, which is
   * exactly the kind of fault that survives a green test suite: awareness has
   * no effect a document assertion can see.
   *
   * Yjs document updates and awareness updates are separate wire formats with
   * separate apply functions. They cannot be told apart by inspection, so the
   * tag is not decoration — feeding an awareness update to `Y.applyUpdate`
   * throws, and feeding a document update to `applyAwarenessUpdate` is worse
   * because it may not.
   *
   * The tag sits INSIDE the sealed payload, so the hub cannot see even this.
   */
  var MSG_DOC = 0;
  var MSG_AWARENESS = 1;

  function tagged(kind, bytes) {
    var out = new Uint8Array(bytes.length + 1);
    out[0] = kind;
    out.set(bytes, 1);
    return out;
  }

  /**
   * How long to wait after joining before deciding a room is empty.
   *
   * There is no "replay finished" message, so a timer is the only signal
   * available. Too short and two people seed; too long and opening a file feels
   * broken. 500ms is informed by nothing but loopback latency and is the first
   * number to change when this misbehaves on a real network.
   */
  var SEED_GRACE_MS = 500;

  /** Saving is debounced, so a burst of keystrokes is one write and not forty. */
  var SAVE_AFTER_MS = 700;

  function roomFor(root, relPath) {
    var repo = selectedRepo;
    if (!repo && root) repo = String(root).replace(/[\\/]+$/, "").split(/[\\/]/).pop();
    return (repo || "repo") + ":" + relPath;
  }

  function closeEditor() {
    if (!ed) return;
    var e = ed;
    ed = null;
    clearTimeout(e.saveTimer);
    clearTimeout(e.seedTimer);
    (e.unsub || []).forEach(function (fn) { try { fn(); } catch (err) { /* already detached */ } });
    if (e.watching && typeof window.zevetLocal.unwatch === "function") {
      try { window.zevetLocal.unwatch(e.root, e.relPath); } catch (err) { /* nothing to undo */ }
    }
    if (CAN_SHARE && e.room) {
      // Announce the departure before dropping the socket, or this cursor and
      // its figure sit in everyone else's editor until they reload. Best
      // effort: if the socket has already gone there is nothing to be done and
      // the peers' own awareness timeouts will clear it eventually.
      try {
        if (e.awareness) {
          var bye = window.zevetEditor.awarenessProtocol.encodeAwarenessUpdate(
            e.awareness, [e.awareness.clientID],
          );
          window.zevetEditor.awarenessProtocol.removeAwarenessStates(
            e.awareness, [e.awareness.clientID], "local",
          );
          void bye;
          var gone = window.zevetEditor.awarenessProtocol.encodeAwarenessUpdate(
            e.awareness, [e.awareness.clientID],
          );
          window.zevetDoc.send(e.room, tagged(MSG_AWARENESS, gone));
        }
      } catch (err) { /* the socket is already gone; peers will time it out */ }
      try { window.zevetDoc.leave(e.room); } catch (err) { /* ditto */ }
    }
    if (e.destroyView) { try { e.destroyView(); } catch (err) { /* ditto */ } }
    if (e.ydoc) { try { e.ydoc.destroy(); } catch (err) { /* ditto */ } }
  }

  /**
   * Open `relPath` for editing.
   *
   * The read comes first and always. With no peers and no write capability
   * this still shows the file, which is exactly what the board did before there
   * was an editor at all -- the feature degrades to the thing it replaced.
   */
  function openEditor(relPath) {
    closeEditor();
    if (!LOCAL || !localRoot) return;
    var root = localRoot;

    ed = {
      root: root, relPath: relPath, room: roomFor(root, relPath),
      text: null, bom: false, eol: "lf", truncated: false,
      loading: true, error: null,
      dirty: false, saving: false, savedAt: 0, lastWritten: null,
      ydoc: null, awareness: null, view: null, destroyView: null,
      getText: null, setText: null,
      seeded: false, seedTimer: null, saveTimer: null,
      unsub: [], watching: false,
    };
    var mine = ed;

    window.zevetLocal.read(root, relPath).then(function (r) {
      if (ed !== mine) return;             // the user moved on while we read
      mine.loading = false;
      if (!r || !r.ok) {
        mine.error = (r && r.error) || "could not read it";
        return render();
      }
      mine.text = r.text;
      // Handed straight back on save. readTextFile strips a BOM and reports the
      // dominant line ending precisely so that a round trip does not rewrite a
      // file nobody edited.
      mine.bom = Boolean(r.bom);
      mine.eol = r.eol || "lf";
      mine.truncated = Boolean(r.truncated);
      mine.lastWritten = r.text;
      render();
      mountEditor(mine);                   // the host element exists only after render
    }, function (err) {
      if (ed !== mine) return;
      mine.loading = false;
      mine.error = String((err && err.message) || err);
      render();
    });
  }

  function mountEditor(e) {
    var host = $("edHost");
    if (!host || e !== ed || e.view) return;

    var E = window.zevetEditor;
    // WARNING: A TRUNCATED READ IS NEVER SHARED AND NEVER SAVED. readTextFile
    // caps at 512 KiB; sharing the first half of a file and then writing that
    // back would delete the rest of it, on every machine at once.
    var shareable = CAN_SHARE && !e.truncated;

    if (shareable) {
      e.ydoc = new E.Y.Doc();
      e.awareness = new E.Awareness(e.ydoc);
      e.awareness.setLocalStateField("user", {
        name: myActor || "me",
        color: cssColour(hueOf(myActor)),
        colorLight: cssColour(hueOf(myActor)) + "33",
      });
      joinRoom(e);
    }

    var handle = E.createEditor({
      parent: host,
      doc: shareable ? e.ydoc : null,
      awareness: shareable ? e.awareness : null,
      text: shareable ? "" : (e.text || ""),
      language: E.languageForPath(e.relPath),
      dark: theme === "dark",
      readOnly: !CAN_WRITE || Boolean(e.truncated),
      onChange: function () { onLocalEdit(e); },
    });
    e.view = handle.view;
    e.getText = handle.getText;
    e.setText = handle.setText;
    e.destroyView = handle.destroy;
    e.setDark = handle.setDark;

    // Solo: the disk text went straight in, because there is no room whose
    // contents might already be the authoritative ones.
    if (!shareable) e.seeded = true;

    watchFile(e);

    if (e.awareness) {
      var onAware = function () { if (ed === e) drawRiders(e); };
      e.awareness.on("change", onAware);
      e.unsub.push(function () { e.awareness.off("change", onAware); });
    }
    if (e.view) {
      // The riders are absolutely positioned over the scroller, so they have to
      // move when it scrolls. A scroll listener rather than a CodeMirror plugin
      // because this is chrome drawn over the editor, not part of its document.
      var sc = e.view.scrollDOM;
      var onScroll = function () { drawRiders(e); };
      sc.addEventListener("scroll", onScroll, { passive: true });
      e.unsub.push(function () { sc.removeEventListener("scroll", onScroll); });
    }
    drawRiders(e);
  }

  /** `hueOf` returns `var(--who-N)`; an awareness payload has to carry a real
   *  colour, because y-codemirror.next writes it into an inline style. */
  function cssColour(varExpr) {
    var m = /^var\((--[a-z0-9-]+)\)$/.exec(String(varExpr));
    if (!m) return String(varExpr);
    var v = getComputedStyle(document.documentElement).getPropertyValue(m[1]);
    return (v || "").trim() || "#2f6f8f";
  }

  function joinRoom(e) {
    var E = window.zevetEditor;

    e.unsub.push(window.zevetDoc.onMessage(function (m) {
      if (!ed || ed !== e || m.room !== e.room) return;
      if (m.kind === "ready") {
        // Our state goes out first, so a room that already has peers learns
        // about anything edited here while the socket was down.
        sendState(e);
        clearTimeout(e.seedTimer);
        e.seedTimer = setTimeout(function () { seedIfEmpty(e); }, SEED_GRACE_MS);
      } else if (m.kind === "update" && m.bytes && m.bytes.length) {
        var body = m.bytes.subarray(1);
        if (m.bytes[0] === MSG_AWARENESS) {
          // "remote" as the origin so the awareness observer below does not
          // rebroadcast what it just received, which is an echo loop between
          // every pair of participants.
          E.awarenessProtocol.applyAwarenessUpdate(e.awareness, body, "remote");
        } else {
          // Same reasoning for the document: "remote" is what stops this update
          // being echoed straight back out by the local-update handler below.
          E.Y.applyUpdate(e.ydoc, body, "remote");
        }
      } else if (m.kind === "snapshot-due") {
        sendState(e, true);
      }
    }));

    e.unsub.push(window.zevetDoc.onStatus(function (st) {
      docStatus[st.room] = { state: st.state, detail: st.detail };
      if (ed === e && st.room === e.room) render();
    }));

    var onUpdate = function (update, origin) {
      if (origin === "remote") return;
      window.zevetDoc.send(e.room, tagged(MSG_DOC, update));
      if (ed === e) scheduleSave(e);
    };
    e.ydoc.on("update", onUpdate);
    e.unsub.push(function () { e.ydoc.off("update", onUpdate); });

    /**
     * Awareness: who is here and where their cursor is.
     *
     * Sent on EVERY change including `removed`, so a teammate closing the file
     * takes their caret and their figure with them rather than leaving a ghost
     * parked on line 40 forever.
     *
     * Not debounced. A cursor move is a few dozen bytes and the whole value of
     * the thing is that it is immediate; a caret that lags by 200ms reads as
     * broken rather than as economical.
     */
    var onAwareness = function (changes, origin) {
      if (origin === "remote") return;
      var changed = changes.added.concat(changes.updated, changes.removed);
      if (!changed.length) return;
      var bytes = E.awarenessProtocol.encodeAwarenessUpdate(e.awareness, changed);
      window.zevetDoc.send(e.room, tagged(MSG_AWARENESS, bytes));
    };
    e.awareness.on("update", onAwareness);
    e.unsub.push(function () { e.awareness.off("update", onAwareness); });

    window.zevetDoc.join(e.room).then(function (r) {
      if (r && r.ok) return;
      // A refusal here is usually one of two completely different problems --
      // "re-run setup, this machine has no master secret" and "the hub is
      // unreachable" -- and the detail is the only thing that distinguishes
      // them, so it is shown verbatim rather than summarised.
      docStatus[e.room] = { state: "error", detail: (r && r.error) || "could not join" };
      if (ed === e) render();
    });
  }

  function sendState(e, snapshot) {
    if (!e.ydoc) return;
    var E = window.zevetEditor;
    window.zevetDoc.send(
      e.room,
      tagged(MSG_DOC, E.Y.encodeStateAsUpdate(e.ydoc)),
      snapshot ? { snapshot: true } : undefined,
    );
    // And our own presence, so somebody already in the room sees this cursor
    // without waiting for it to move. ⚠️ NOT part of a snapshot: a snapshot
    // replaces the room's whole log, and awareness is ephemeral state that
    // should never be replayed to a late joiner -- it would resurrect the
    // cursors of people who have since left.
    if (!snapshot && e.awareness) {
      var mine = E.awarenessProtocol.encodeAwarenessUpdate(e.awareness, [e.awareness.clientID]);
      window.zevetDoc.send(e.room, tagged(MSG_AWARENESS, mine));
    }
  }

  /** Put the file into an empty room. See SEED_CLIENT_ID for why this is not
   *  simply `ytext.insert(0, text)`. */
  function seedIfEmpty(e) {
    if (!ed || ed !== e || e.seeded || !e.ydoc) return;
    var E = window.zevetEditor;

    if (e.ydoc.getText(Y_TEXT).length > 0) {
      // Somebody got here first. Adopt what the room holds; if that differs
      // from this machine's disk, the save below writes the room's version out,
      // which is the behaviour you want -- while a room exists it is the shared
      // truth, and the alternative is every machine fighting over the file.
      e.seeded = true;
      scheduleSave(e);
      return;
    }

    var seed = new E.Y.Doc();
    seed.clientID = SEED_CLIENT_ID;
    seed.getText(Y_TEXT).insert(0, e.text || "");
    E.Y.applyUpdate(e.ydoc, E.Y.encodeStateAsUpdate(seed), "remote");
    seed.destroy();
    e.seeded = true;
    // Deliberately a normal update and not a snapshot: a snapshot replaces the
    // room's whole log, and if this raced with a peer's seed then the log is
    // precisely the thing worth keeping.
    sendState(e);
  }

  function onLocalEdit(e) {
    if (ed !== e) return;
    e.dirty = true;
    scheduleSave(e);
    paintSaveState(e);
    drawRiders(e);
  }

  function scheduleSave(e) {
    if (!CAN_WRITE || e.truncated) return;
    clearTimeout(e.saveTimer);
    e.saveTimer = setTimeout(function () { saveNow(e); }, SAVE_AFTER_MS);
  }

  function saveNow(e) {
    if (ed !== e || !CAN_WRITE || e.truncated) return;
    var text = e.getText ? e.getText() : null;
    if (text == null) return;
    // Writing an identical file still bumps its mtime, which the watcher sees,
    // which re-reads, which re-renders. A cheap loop, and easy to avoid.
    if (text === e.lastWritten) { e.dirty = false; return paintSaveState(e); }

    e.saving = true;
    paintSaveState(e);
    window.zevetLocal.write(e.root, e.relPath, text, { bom: e.bom, eol: e.eol }).then(function (r) {
      if (ed !== e) return;
      e.saving = false;
      if (r && r.ok) {
        e.lastWritten = text;
        e.dirty = false;
        e.savedAt = Date.now();
        e.error = null;
      } else {
        e.error = (r && r.error) || "could not save";
      }
      paintSaveState(e);
      // A save changes the line count and the diff, and those are the numbers
      // in the tree the person is looking at.
      refreshStats(false);
    });
  }

  /**
   * An agent changed the file on disk.
   *
   * This is the case the whole product exists for, so it gets the careful
   * treatment. The new text is folded into the shared document rather than
   * swapped into the buffer: `setText` replaces the document in one
   * transaction and Yjs diffs it against what was there, so a teammate's cursor
   * survives and an unsaved local edit is merged rather than discarded.
   */
  function onDiskChanged(e, payload) {
    if (ed !== e || payload.text == null) return;
    var current = e.getText ? e.getText() : null;
    if (current === payload.text) return;          // nothing actually differs
    if (payload.text === e.lastWritten) return;    // our own save, coming back around
    e.bom = Boolean(payload.bom);
    e.eol = payload.eol || e.eol;
    e.lastWritten = payload.text;
    e.setText(payload.text);
    refreshStats(false);
    drawRiders(e);
  }

  function watchFile(e) {
    if (!LOCAL) return;
    if (typeof window.zevetLocal.watch !== "function") return;
    if (typeof window.zevetLocal.onFileChanged !== "function") return;
    e.unsub.push(window.zevetLocal.onFileChanged(function (p) {
      if (!ed || ed !== e) return;
      if (p.root !== e.root || p.relPath !== e.relPath) return;
      onDiskChanged(e, p);
    }));
    window.zevetLocal.watch(e.root, e.relPath, e.lastWritten).then(function (r) {
      if (ed === e && r && r.ok) e.watching = true;
    }, function () { /* no watcher: an agent's edits simply will not appear live */ });
  }

  /* ---- the riders ------------------------------------------------------
   * One figure per other participant in this file, at the line their cursor is
   * on, in their colour, holding the tool their agent last used.
   *
   * Positions come from Yjs awareness, which is exact: it is the same source
   * y-codemirror.next draws the remote carets from, so the figure and the caret
   * cannot drift apart.
   *
   * WARNING: THERE IS DELIBERATELY NO FIGURE FOR AN AGENT SEEN ONLY OVER THE
   * BOARD'S EVENT STREAM. Those events carry a file but NO LINE NUMBER -- the
   * hook sends `{kind, tool, target, detail}` and nothing positional. Putting a
   * figure at line 1 because line 1 is all we know would be inventing a fact
   * and drawing it 40 lines from the truth. Teaching the hook to report a line
   * is the way to fix this, and it has not been done.
   */
  function drawRiders(e) {
    if (ed !== e || !e.view) return;
    var layer = $("riders");
    if (!layer) return;
    layer.textContent = "";
    if (!e.awareness) return;

    var localId = e.awareness.clientID;
    var scrolled = e.view.scrollDOM.scrollTop;
    var docLen = e.view.state.doc.length;

    e.awareness.getStates().forEach(function (state, clientId) {
      if (clientId === localId) return;
      var user = state && state.user;
      var cursor = state && state.cursor;
      // ⚠️ DO NOT ADD `typeof cursor.head !== "number"` BACK. It was here, and
      // it rejected every remote participant before `absolutePosition` below
      // ever ran -- awareness cursors are Yjs RELATIVE positions, which are
      // objects. The decoder was added and this line was left behind, so the
      // riders stayed invisible while the remote carets beside them worked
      // perfectly. Two real instances found it; no unit test would have.
      if (!user || !cursor || cursor.head == null) return;

      var head = absolutePosition(e, cursor.head);
      if (head == null) return;
      var pos = Math.max(0, Math.min(docLen, head));
      var block;
      try {
        block = e.view.lineBlockAt(pos);
      } catch (err) {
        return;   // a position from a document state we have not applied yet
      }

      var rider = el("div", "rider");
      rider.style.color = user.color || "var(--who-0)";
      // The eye holes take the surface behind them, and behind them here is the
      // editor's own background rather than the page's.
      rider.style.setProperty("--zevet-sprite-eye", "var(--paper)");
      rider.style.transform = "translateY(" + Math.round(block.top - scrolled) + "px)";
      rider.innerHTML = window.zevetSprites.spriteFor({ tool: toolOf(user.name), width: 35, height: 16 });
      rider.appendChild(tx(el("span", "who"), user.name || ""));
      layer.appendChild(rider);
    });
  }

  /**
   * An awareness cursor, turned into an offset in this document.
   *
   * WARNING: THESE ARE NOT NUMBERS. y-codemirror.next publishes the local
   * cursor as Yjs RELATIVE positions -- JSON objects that name an item and an
   * offset within it -- and not as an integer, precisely because an integer
   * would mean something different on every machine the moment anybody typed.
   * Reading `cursor.head` as a number therefore always fails, silently, and the
   * riders simply never appear. (They did not, in the first version of this.)
   *
   * `null` means the position cannot be resolved against the state this client
   * currently holds, which is normal and transient: a peer can publish a cursor
   * referring to an update that has not reached us yet.
   */
  function absolutePosition(e, raw) {
    if (raw == null) return null;
    if (typeof raw === "number") return raw;   // a peer on some future encoding
    var Y = window.zevetEditor.Y;
    try {
      var rel = Y.createRelativePositionFromJSON(raw);
      var abs = Y.createAbsolutePositionFromRelativePosition(rel, e.ydoc);
      return abs ? abs.index : null;
    } catch (err) {
      return null;
    }
  }

  /** The last tool this actor's agent used, off the board's own event feed.
   *  Null is a fine answer -- the figure is then simply empty-handed, which is
   *  honest about not knowing. */
  function toolOf(actor) {
    if (!actor) return null;
    var evs = scoped();
    for (var i = evs.length - 1; i >= 0; i--) {
      if (evs[i].actor === actor && evs[i].kind === "tool" && evs[i].tool) return evs[i].tool;
    }
    return null;
  }

  function paintSaveState(e) {
    var n = $("edSaved");
    if (!n || ed !== e) return;
    n.dataset.dirty = String(Boolean(e.dirty));
    tx(n, e.error ? e.error : e.saving ? "saving\u2026" : e.dirty ? "unsaved" : e.savedAt ? "saved" : "");
  }


  /**
   * The editor pane: one status bar and the editor under it.
   *
   * Built fresh on every render, EXCEPT the host element, which is reused
   * whenever an editor is already mounted in it. Re-creating it would destroy
   * and rebuild CodeMirror on every event that lands on the board -- losing the
   * cursor, the selection, the scroll position and the undo history several
   * times a second while a teammate's agent is working.
   */
  function editorPane(e) {
    var wrap = el("div", "ed");

    var bar = el("div", "ed-bar");
    bar.appendChild(tx(el("span"), e.relPath));

    if (e.truncated) {
      var big = el("span", "ed-note");
      tx(big, "too large to edit — showing the first part, read-only");
      bar.appendChild(big);
    }

    bar.appendChild(el("span", "grow"));

    var saved = el("span", "ed-saved");
    saved.id = "edSaved";
    bar.appendChild(saved);

    // The sharing state, which is the one thing about this pane a person needs
    // to be able to trust. An editor that has quietly stopped syncing while
    // looking fine is the failure this project calls its worst.
    var st = el("span", "ed-state");
    if (!CAN_SHARE) {
      st.dataset.state = "solo";
      st.appendChild(el("span", "dot"));
      tx(st.appendChild(el("span")), "on this machine only");
    } else {
      var s0 = docStatus[e.room] || { state: "connecting", detail: "" };
      st.dataset.state = s0.state;
      st.appendChild(el("span", "dot"));
      var label =
        s0.state === "open" ? "shared" :
        s0.state === "connecting" ? "connecting" :
        s0.state === "retrying" ? "reconnecting" :
        s0.state === "undecipherable" ? "a frame would not open" :
        s0.state === "error" ? (s0.detail || "not shared") : s0.state;
      tx(st.appendChild(el("span")), label);
      if (s0.detail) st.title = s0.detail;
    }
    bar.appendChild(st);
    wrap.appendChild(bar);

    if (e.loading) {
      var l = el("div", "ed-note");
      tx(l, "reading\u2026");
      wrap.appendChild(l);
      return wrap;
    }
    if (e.error && !e.view) {
      var err = el("div", "ed-note");
      tx(err, e.error);
      wrap.appendChild(err);
      return wrap;
    }

    var hostBox = el("div", "ed-host");
    hostBox.id = "edHost";
    // Reuse, do not rebuild. See the comment on this function.
    if (e.view && e.view.dom && e.view.dom.parentNode) {
      hostBox.appendChild(e.view.dom);
    }
    var riders = el("div", "riders");
    riders.id = "riders";
    hostBox.appendChild(riders);
    wrap.appendChild(hostBox);

    // The bar's contents are rebuilt, so the save state has to be repainted
    // onto the new node.
    setTimeout(function () { paintSaveState(e); drawRiders(e); }, 0);
    return wrap;
  }

  /**
   * What is known about one file.
   *
   * NOT its contents: the hub never receives a byte of anyone's source, by
   * design, and inventing a preview here would be a lie about what this
   * system holds. What it does know — and what you actually want when two
   * people are in one file — is who has been in it, when, and with which
   * tool. The desktop app can show real contents because it reads your own
   * disk; that is a separate surface and is marked as such.
   */
  function renderDetail(now) {
    var host = $("detail");
    host.textContent = "";
    if (!selectedPath) {
      tx($("detailTitle"), "Nothing selected");
      var hint = el("div", "blank");
      hint.appendChild(tx(el("h2"), "Pick a file."));
      hint.appendChild(tx(el("p"), "Select a file to see recent activity."));
      host.appendChild(hint);
      return;
    }

    tx($("detailTitle"), selectedPath);
    var touching = scoped().filter(function (e) { return e.target === selectedPath; });

    // In the app, the file itself — read from this machine's disk, never from
    // the hub, which has never held a byte of it in the clear.
    if (ed && ed.relPath === selectedPath) {
      host.appendChild(editorPane(ed));
      return;
    }

    if (LOCAL && localFile && localFile.path === selectedPath) {
      var viewer = el("div", "viewer");
      if (localFile.loading) {
        tx(viewer, "reading…");
        viewer.className = "viewer loading";
      } else if (localFile.error) {
        viewer.className = "viewer err";
        tx(viewer, localFile.error);
      } else {
        var pre = el("pre", "code");
        var lang = window.zevetHighlight ? window.zevetHighlight.languageFor(selectedPath) : "plain";
        if (window.zevetHighlight) pre.innerHTML = window.zevetHighlight.highlight(localFile.text, lang);
        else tx(pre, localFile.text);
        viewer.appendChild(pre);
        if (localFile.truncated) {
          var t = el("div", "viewer-note");
          tx(t, "truncated — showing the first part of the file");
          viewer.appendChild(t);
        }
      }
      host.appendChild(viewer);
    }

    var whoLast = Object.create(null);
    touching.forEach(function (e) {
      if (!whoLast[e.actor] || e.ts > whoLast[e.actor]) whoLast[e.actor] = e.ts;
    });

    var summary = el("div", "detail-who");
    Object.keys(whoLast)
      .sort(function (a, b) { return whoLast[b] - whoLast[a]; })
      .forEach(function (a) {
        var chip = el("span", "dwho");
        chip.style.setProperty("--who", hueOf(a));
        chip.appendChild(el("span", "bead"));
        chip.appendChild(tx(el("span"), a));
        chip.appendChild(agoEl(el("span", "when"), whoLast[a]));
        summary.appendChild(chip);
      });
    host.appendChild(summary);

    var list = el("div", LOCAL && localFile && !localFile.error ? "detail-events after-code" : "detail-events");
    touching.slice(-40).reverse().forEach(function (e) {
      var row = el("div", "devent");
      row.style.setProperty("--who", hueOf(e.actor));
      row.appendChild(tx(el("span", "dt"), hhmm(e.ts)));
      row.appendChild(tx(el("span", "da"), e.actor));
      row.appendChild(tx(el("span", "dv"), e.tool || verbFor(e)));
      row.appendChild(tx(el("span", "dd mono"), e.detail || ""));
      list.appendChild(row);
    });
    host.appendChild(list);
  }

  function renderCollisions(now) {
    var host = $("collisions");
    host.textContent = "";
    collisions
      .filter(function (c) { return !selectedRepo || !c.repo || c.repo === selectedRepo; })
      .slice(0, 3)
      .forEach(function (c) {
        var bar = el("div", "collide-bar");
        bar.appendChild(tx(el("span", "file mono"), c.target));
        var list = el("span", "who-list");
        (c.actors || []).forEach(function (a) {
          var s = el("span");
          s.style.setProperty("--who", hueOf(a.actor));
          var b = el("b");
          tx(b, a.label || a.actor);
          s.appendChild(b);
          s.appendChild(document.createTextNode(" "));
          s.appendChild(agoEl(el("span"), a.ts));
          list.appendChild(s);
        });
        bar.appendChild(list);
        host.appendChild(bar);
      });
  }

  /**
   * One card per person: their prompt, then the steps their agent has taken
   * since — which is what a Codex or Claude Code pane shows, except there are
   * three of them and each is somebody else.
   */
  function renderMyConsole(host) {
    if (!LOCAL) return;

    myConsoles.forEach(function (c) { renderOneConsole(host, c); });

    if (!localRoot) return;
    var bar = el("div", "newagent");
    var usable = localAgents.filter(function (a) { return a.ok; });
    if (!usable.length) {
      var none = el("div", "newagent-none");
      tx(none, localAgents.length ? "No agents found" : "looking for agents…");
      bar.appendChild(none);
      host.appendChild(bar);
      return;
    }

    var controls = el("div", "launch-controls");
    var modeSel = el("select", "launch-select");
    MODES.forEach(function (m) {
      var o = el("option");
      o.value = m.id;
      tx(o, m.label);
      if (m.id === launchMode) o.selected = true;
      modeSel.appendChild(o);
    });
    modeSel.addEventListener("change", function () { launchMode = modeSel.value; render(); });
    controls.appendChild(modeSel);

    var modelInput = el("input", "launch-model");
    modelInput.type = "text";
    modelInput.placeholder = "model (default)";
    modelInput.value = launchModel;
    modelInput.setAttribute("list", "zevet-models");
    modelInput.addEventListener("change", function () { launchModel = modelInput.value.trim(); });
    controls.appendChild(modelInput);

    var dl = el("datalist");
    dl.id = "zevet-models";
    var pool = [];
    usable.forEach(function (a) { pool = pool.concat(MODELS[a.name] || []); });
    pool.filter(Boolean).forEach(function (v) {
      var o = el("option");
      o.value = v;
      dl.appendChild(o);
    });
    controls.appendChild(dl);
    bar.appendChild(controls);

    var row = el("div", "launch-row");
    usable.forEach(function (a) {
      var b = el("button", "newagent-btn");
      tx(b, (myConsoles.length ? "Another " : "Start ") + a.name);
      if (!a.signedIn) {
        var warnDot = el("span", "signin-dot");
        warnDot.title = "no account found for " + a.name;
        b.appendChild(warnDot);
      }
      b.title = a.detail + (a.signedIn ? "  (signed in)" : "  (no account found)");
      b.dataset.danger = String(launchMode === "dangerous");
      b.addEventListener("click", function () { startAgent(a.name); });
      row.appendChild(b);
    });
    bar.appendChild(row);

    if (launchMode === "dangerous") {
      var warn = el("div", "launch-warn");
      tx(warn, "Runs commands and edits files without asking.");
      bar.appendChild(warn);
    }
    host.appendChild(bar);
  }

  function renderOneConsole(host, c) {
    var card = el("div", "console");
    card.style.setProperty("--who", "var(--who-" + c.hue + ")");

    var head = el("div", "console-head");
    head.appendChild(el("span", "bead"));
    head.appendChild(tx(el("span", "nm"), c.agent));
    var posture = el("span", "posture");
    posture.dataset.danger = String(c.mode === "dangerous");
    var modeLabel = (MODES.find(function (m) { return m.id === c.mode; }) || {}).label || c.mode;
    tx(posture, modeLabel + (c.model ? "  ·  " + c.model : ""));
    head.appendChild(posture);

    var stop = el("button", "console-stop");
    tx(stop, c.running ? "Stop" : "Close");
    stop.addEventListener("click", function () {
      if (c.running && c.id) window.zevetLocal.stopAgent(c.id);
      myConsoles = myConsoles.filter(function (x) { return x !== c; });
      // The draft belonged to a console that no longer exists; leaving the
      // pointer behind would restore it into whichever console rendered next.
      if (composingIn === c) { composingIn = null; composingText = ""; }
      render();
    });
    head.appendChild(stop);
    card.appendChild(head);

    if (c.error) {
      var e = el("div", "console-err");
      tx(e, c.error);
      card.appendChild(e);
    }

    var out = el("div", "console-out");
    c.lines.slice(-120).forEach(function (l) {
      var row = el("div", "cline");
      row.dataset.kind = l.kind;
      // Only what the agent SAID gets the inline formatting. A tool line, an
      // error and the turn footer are literal by nature: backticks in a file
      // path or a stack trace are part of the text, not markup.
      if (l.kind === "out") prose(row, l.text);
      else tx(row, l.text);
      out.appendChild(row);
    });
    card.appendChild(out);

    if (c.running) {
      var form = el("form", "console-form");
      // ⚠️ A TEXTAREA, NOT AN INPUT, IN BOTH VIEWS. A single-line input made
      // every prompt a single line: pasting a stack trace or writing a
      // paragraph of instructions meant losing the newlines, and the thing you
      // send an agent is very often multi-line. Enter still sends, because
      // that is what the one-line field taught; Shift+Enter is the newline.
      var input = el("textarea", "console-input");
      input.rows = 1;
      input.placeholder = "Tell it what to do…";
      input.setAttribute("aria-label", "Message " + c.agent);
      form.appendChild(input);
      // Sized once at mount, not only on input: an unsized textarea sits at
      // its min-height with its own content already overflowing it.
      setTimeout(function () { fit(); }, 0);

      /** Grow with the text, to a ceiling, so a long prompt is readable while
       *  being written without the composer eating the transcript. */
      function fit() {
        input.style.height = "auto";
        var want = input.scrollHeight;
        input.style.height = Math.min(want, 220) + "px";
        // Only scroll once the ceiling is reached. Leaving `overflow: auto` on
        // at all times drew a scrollbar over an empty one-line field, which on
        // Windows is a pair of little arrows in the corner of the composer.
        input.style.overflowY = want > 220 ? "auto" : "hidden";
      }
      input.addEventListener("input", fit);
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
          ev.preventDefault();
          // requestSubmit, not submit: submit() skips the submit handler on
          // some engines and would silently do nothing.
          if (typeof form.requestSubmit === "function") form.requestSubmit();
          else form.dispatchEvent(new Event("submit", { cancelable: true }));
        }
      });
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var text = input.value.trim();
        if (!text || !c.id) return;
        pushConsoleLine(c, "you", text);
        input.value = "";
        composingText = "";
        fit();
        window.zevetLocal.sendToAgent(c.id, text).then(function (r) {
          if (r && r.ok === false) pushConsoleLine(c, "err", r.error || "could not send");
          render();
        });
        render();
      });
      card.appendChild(form);
      // The whole card is rebuilt on every render, so focus has to be put back
      // or typing stops the moment a stream event lands. `composingIn` is the
      // console the person was last typing in; anything else would steal focus
      // from a second console the moment the first one printed a line.
      if (composingIn === c) {
        input.value = composingText;
        fit();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
      input.addEventListener("focus", function () { composingIn = c; });
      input.addEventListener("input", function () { composingIn = c; composingText = input.value; });
    }

    host.appendChild(card);
    var o = card.querySelector(".console-out");
    if (o) o.scrollTop = o.scrollHeight;
  }

  /**
   * Click a file row: open it, or close it if it was already the open one.
   *
   * Factored out of the tree because the changed-file list in agent view is a
   * second way to reach the same file and must behave identically. Two copies
   * of this would be two places for the editor/viewer fallback to drift.
   */
  function toggleSelection(path) {
    selectedPath = selectedPath === path ? null : path;
    if (selectedPath && LOCAL && localRoot) {
      // The editor supersedes the read-only viewer wherever it can run.
      // openLocalFile stays for the case it cannot: no editor bundle (an old
      // hub), or a file the editor declines to open.
      if (window.zevetEditor) openEditor(selectedPath);
      else openLocalFile(selectedPath);
    } else {
      localFile = null;
      closeEditor();
    }
  }

  /**
   * The changed-file list: agent view's replacement for the tree.
   *
   * Built from the same `stats.diff` the tree badges use, so there is no
   * second source of truth and no second IPC call. Sorted by churn rather than
   * by name: the file an agent has rewritten 200 lines of is the one worth
   * looking at, and alphabetical order would bury it under a config file it
   * touched one character of.
   *
   * `diff === null` means git could not be asked (not a repo, no git, a
   * timeout) and is a DIFFERENT thing from an empty diff, which means a clean
   * tree. They get different sentences; collapsing them would make "no git"
   * read as "your agent did nothing".
   */
  function renderChanged() {
    var host = $("changed");
    if (!host) return;
    var on = viewMode === "agent";
    host.hidden = !on;
    // The column keeps ONE heading, the tree's, relabelled. A second title
    // inside the list would put two uppercase headers in a 286px column.
    // Only written when this view owns the column: renderTree sets the same
    // element, with the repo name appended, and runs first.
    if (on) tx($("filesTitle"), "Changed");
    if (!on) { host.textContent = ""; return; }
    host.textContent = "";

    if (!LOCAL || !localRoot) {
      var noWs = el("div", "changed-none");
      tx(noWs, LOCAL ? "no workspace open" : "open zevet on your machine to see this");
      host.appendChild(noWs);
      return;
    }
    if (!stats.diff || stats.root !== localRoot) {
      var unknown = el("div", "changed-none");
      tx(unknown, stats.diff === null && stats.root === localRoot
        ? "git could not be read here"
        : "counting…");
      host.appendChild(unknown);
      return;
    }

    var rows = Object.keys(stats.diff).map(function (p) {
      var d = stats.diff[p];
      return { path: p, d: d, churn: (d.added || 0) + (d.removed || 0) };
    });
    // Untracked files have no counts at all, so churn sorting would drop them
    // to the bottom; a brand-new file is usually the most interesting thing in
    // the list. They sort as if large, and say "new" instead of a number.
    rows.sort(function (a, b) {
      var an = a.d.status === "untracked" ? Infinity : a.churn;
      var bn = b.d.status === "untracked" ? Infinity : b.churn;
      if (an !== bn) return bn - an;
      return a.path < b.path ? -1 : 1;
    });

    if (!rows.length) {
      var clean = el("div", "changed-none");
      tx(clean, "nothing changed since the last commit");
      host.appendChild(clean);
      return;
    }

    rows.slice(0, 60).forEach(function (r) {
      var b = el("button", "changed-row");
      b.dataset.sel = String(selectedPath === r.path);
      b.title = r.path;
      // `direction: rtl` on .p keeps the FILENAME visible when the path is too
      // long, ellipsing the directories instead. A left-ellipsed path is the
      // one you can still identify.
      b.appendChild(tx(el("span", "p"), r.path));
      var badge = statBadge(r.path);
      b.appendChild(badge || el("span"));
      b.addEventListener("click", function () { toggleSelection(r.path); render(); });
      host.appendChild(b);
    });
  }

  /**
   * The update row.
   *
   * ⚠️ THE STATE COMES FROM THE MAIN PROCESS AND IS NEVER COMPUTED HERE. This
   * page is served BY THE HUB — a remote origin — and the updater it reports on
   * downloads and runs an installer. The board's job is to draw a status and
   * to forward one click; it does not get to say what the version is, where
   * the file came from, or whether it is safe. Everything in `updateState`
   * arrives over IPC from desktop/app-update.js.
   *
   * The rail shows downloads, ready installers and failures. Settings shows
   * every phase and uses the same actions.
   */
  var updateState = null;
  var updateRevision = 0;
  var updateChecking = false;
  var updateInstalling = false;
  var updateInstallError = "";
  var updateNotice = "";

  function canInstallUpdate(s) {
    return s.phase === "ready" && s.canInstall === true &&
      typeof window.zevetLocal.updateInstall === "function";
  }

  function updateStatusText(s) {
    if (updateInstalling) return s.manual ? "Opening installer…" : "Restarting…";
    if (s.phase === "downloading") return "Downloading " + s.version + " · " + updatePercent(s) + "%";
    if (s.phase === "ready") return s.version + " ready to install";
    if (s.phase === "error") return s.error || "Update failed. Try again.";
    if (updateChecking || s.phase === "checking") return "Checking…";
    if (s.phase === "current") return "Up to date";
    return "Not checked yet";
  }

  function updatePercent(s) {
    return Math.max(0, Math.min(100, Math.floor(Number(s.percent) || 0)));
  }

  function updateProgress(s, className) {
    var bar = el("div", className);
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-label", "Update download");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", "100");
    bar.setAttribute("aria-valuenow", String(updatePercent(s)));
    var fill = el(className === "bar" ? "i" : "span");
    fill.style.width = updatePercent(s) + "%";
    bar.appendChild(fill);
    return bar;
  }

  function receiveUpdate(s) {
    if (!s || typeof s !== "object") return;
    if (!updateState || s.version !== updateState.version || s.phase === "checking") {
      updateInstallError = "";
      updateNotice = "";
    }
    updateState = s;
    updateRevision++;
    refreshUpdateViews();
  }

  function refreshUpdateViews() {
    renderUpdate();
    // Progress must not rebuild Account's form or discard a typed invitation.
    var version = $("versionSection");
    if (sheetOpen && version && version.parentNode) {
      version.parentNode.replaceChild(versionSection(), version);
    }
  }

  function updateCheckButton(className) {
    var btn = el("button", className);
    btn.type = "button";
    var s = updateState || {};
    btn.disabled = updateChecking || updateInstalling || s.phase === "checking" || s.phase === "downloading";
    tx(btn, updateChecking || s.phase === "checking" ? "Checking…" : "Check now");
    btn.addEventListener("click", checkForUpdates);
    return btn;
  }

  function checkForUpdates() {
    var s = updateState || {};
    if (updateChecking || updateInstalling || s.phase === "checking" || s.phase === "downloading") return;
    updateChecking = true;
    updateInstallError = "";
    updateNotice = "";
    refreshUpdateViews();
    return Promise.resolve().then(function () {
      return window.zevetLocal.updateCheck();
    }).then(function (r) {
      if (!r || typeof r.phase !== "string") throw new Error("No update status received. Try again.");
      receiveUpdate(r);
    }).catch(function (err) {
      receiveUpdate(Object.assign({}, updateState, {
        phase: "error", canInstall: false, error: (err && err.message) || "Update check failed. Try again.",
      }));
    }).finally(function () {
      updateChecking = false;
      refreshUpdateViews();
    });
  }

  function updateInstallButton(className) {
    var btn = el("button", className);
    btn.type = "button";
    btn.disabled = updateInstalling || updateChecking;
    var manual = updateState && updateState.manual;
    tx(btn, updateInstalling ? (manual ? "Opening…" : "Restarting…") : (manual ? "Open installer" : "Restart to install"));
    btn.addEventListener("click", installUpdate);
    return btn;
  }

  function installUpdate() {
    if (updateInstalling || updateChecking || !canInstallUpdate(updateState || {})) return;
    updateInstalling = true;
    updateInstallError = "";
    updateNotice = "";
    refreshUpdateViews();
    return Promise.resolve().then(function () {
      return window.zevetLocal.updateInstall();
    }).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.error) || "Installer could not open. Try again.");
      if (r.manual) {
        updateInstalling = false;
        updateNotice = "Installer opened. Quit zevet, replace it in Applications, then reopen.";
      }
    }).catch(function (err) {
      updateInstalling = false;
      updateInstallError = (err && err.message) || "Installer could not open. Try again.";
    }).finally(refreshUpdateViews);
  }

  function appendUpdateFeedback(host, className) {
    var s = updateState || {};
    var message = updateInstallError || updateNotice;
    if (!message || message === s.error) return;
    var note = tx(el("p", className), message);
    note.setAttribute("role", updateInstallError ? "alert" : "status");
    if (updateInstallError) note.style.color = "var(--alert)";
    host.appendChild(note);
  }

  function renderUpdate() {
    var host = $("updateRow");
    if (!host) return;
    var s = updateState || {};
    var show = s.phase === "downloading" || s.phase === "ready" || s.phase === "error";
    host.hidden = !show;
    host.textContent = "";
    if (!show) return;
    host.appendChild(tx(el("div", "hd"), updateStatusText(s)));
    if (s.phase === "downloading") {
      host.appendChild(updateProgress(s, "bar"));
    } else if (canInstallUpdate(s)) {
      if (s.notes) host.appendChild(tx(el("div", "sub"), s.notes));
      host.appendChild(updateInstallButton("go"));
    } else if (s.phase === "error" && typeof window.zevetLocal.updateCheck === "function") {
      host.appendChild(updateCheckButton("go"));
    }
    appendUpdateFeedback(host, "sub");
  }

  function startUpdates() {
    if (!LOCAL) return;
    var bridge = window.zevetLocal;
    if (typeof bridge.onUpdate === "function") bridge.onUpdate(receiveUpdate);
    if (typeof bridge.updateStatus !== "function") return;
    var revision = updateRevision;
    Promise.resolve().then(function () { return bridge.updateStatus(); }).then(function (s) {
      // A delayed initial snapshot must not replace a newer pushed status.
      if (revision === updateRevision) receiveUpdate(s);
    }, function (err) {
      if (revision === updateRevision) receiveUpdate({ phase: "error", error: (err && err.message) || "Update status unavailable." });
    });
  }

  function renderStreams(now) {
    // ⚠️ THE CONSOLE MOVES, IT IS NOT DUPLICATED. In agent view the thing you
    // are driving belongs in the wide middle column; in ide view it belongs in
    // the rail with the teammates. Rendering into both hosts would give two
    // live transcripts of one agent and two composers that could disagree.
    var agentView = viewMode === "agent";
    var chat = $("chat");
    var host = $("streams");

    // Stick to the bottom, but only if that is where the person already was.
    // In agent view the transcript is not in a fixed-height well — the COLUMN
    // scrolls — so the "scroll to the end" line at the bottom of
    // renderOneConsole does nothing here and this has to do it. Unconditional
    // scrolling would yank the page back down every time a line arrived while
    // somebody was reading what the agent said five minutes ago.
    var stick = chat && chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;

    host.textContent = "";
    if (chat) chat.textContent = "";

    var mineHost = agentView && chat ? chat : host;
    renderMyConsole(mineHost);
    if (agentView && chat && !myConsoles.length) {
      var box = el("div", "chat-empty");
      box.appendChild(tx(el("h2"), "Nothing running yet."));
      box.appendChild(tx(el("p"), LOCAL
        ? "Start an agent in the selected workspace."
        : "Use the desktop app to start an agent."));
      chat.appendChild(box);
    }

    var shown = roster.filter(function (r) { return !selectedActor || r.actor === selectedActor; });

    shown.forEach(function (r) {
      var mine = scoped().filter(function (e) { return e.actor === r.actor; });
      if (!mine.length) return;

      // Everything since this person's most recent prompt is the current turn.
      var startIdx = 0;
      for (var i = mine.length - 1; i >= 0; i--) {
        if (mine[i].kind === "prompt") { startIdx = i; break; }
      }
      var turn = mine.slice(startIdx);
      var prompt = turn[0] && turn[0].kind === "prompt" ? turn[0] : null;
      var steps = turn.filter(function (e) { return e.kind === "tool"; }).slice(-7);
      var ended = turn.some(function (e) { return e.kind === "turn_end"; });
      var idle = isIdle(r, now);

      var card = el("div", "stream");
      card.style.setProperty("--who", hueOf(r.actor));

      var head = el("div", "stream-head");
      head.appendChild(el("span", "bead"));
      head.appendChild(tx(el("span", "nm"), r.actor));
      var agentTag = el("span", "agent");
      tx(agentTag, (r.lastEvent && r.lastEvent.agent) || "");
      head.appendChild(agentTag);
      card.appendChild(head);

      if (prompt && prompt.detail) {
        var bub = el("div", "bubble prompt");
        tx(bub, prompt.detail);
        card.appendChild(bub);
      }

      steps.forEach(function (e) {
        var row = el("div", "step");
        row.appendChild(tx(el("span", "t"), e.tool || "tool"));
        var v = el("span", "v mono");
        tx(v, e.target || e.detail || "");
        row.appendChild(v);
        card.appendChild(row);
      });

      var foot = el("div", "step");
      foot.appendChild(tx(el("span", "t"), hhmm(r.lastTs)));
      var state = el("span", "v");
      if (idle) {
        state.className = "v idle-note";
        tx(state, "idle " + ago(now - r.lastTs));
      } else if (ended) {
        tx(state, "turn finished");
      } else {
        var w = el("b");
        tx(w, "working");
        state.appendChild(w);
        var dots = el("span", "typing");
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        dots.appendChild(el("i"));
        state.appendChild(dots);
      }
      foot.appendChild(state);
      card.appendChild(foot);

      host.appendChild(card);
    });

    if (!host.childNodes.length) {
      var p = el("div");
      p.style.cssText = "padding:16px;color:var(--subtle);font-size:12.5px";
      tx(p, roster.length ? "nothing in this workspace yet" : "no agents yet");
      host.appendChild(p);
    }

    if (agentView && chat && stick) chat.scrollTop = chat.scrollHeight;
  }

  function renderScope() {
    var repos = [];
    var branches = [];
    events.forEach(function (e) {
      if (e.repo && repos.indexOf(e.repo) < 0) repos.push(e.repo);
      if (e.branch && branches.indexOf(e.branch) < 0) branches.push(e.branch);
    });
    var label = selectedRepo || repos.join(", ");
    var br = selectedRepo
      ? (workspaces().find(function (w) { return w.repo === selectedRepo; }) || {}).branch
      : branches.length === 1 ? branches[0] : "";
    tx($("scope"), label ? label + (br ? "   " + br : "") : "");
  }

  function renderBlank() {
    if (roster.length) return false;
    // ⚠️ AND NOT WHEN THERE IS A WORKSPACE OPEN, WHICH IS NEW IN 0.2.0.
    //
    // This used to blank the tree whenever the ROSTER was empty, which was
    // right when the board was only a place to watch other people's agents:
    // with nobody working there was genuinely nothing to draw.
    //
    // It is wrong for an IDE. A person who installs zevet, opens a folder and
    // wants to read a file got "No activity yet" where the
    // file tree should be — the app refusing to show them their own checkout
    // until somebody else did something. Seen on the first launch against the
    // production hub after the 0.2.0 cutover, with a workspace selected and an
    // empty roster, which is exactly the state every new install starts in.
    if (LOCAL && localRoot) return false;
    var main = $("tree");
    main.textContent = "";
    var box = el("div", "blank");
    if (needsToken) {
      box.appendChild(tx(el("h2"), "Not signed in."));
      box.appendChild(tx(el("p"), "Open your invitation link or sign in through the desktop app."));
    } else if (conn === "down") {
      box.appendChild(tx(el("h2"), "Can't reach the hub."));
      box.appendChild(tx(el("p"), "Reconnecting… Check the hub if this continues."));
    } else {
      box.appendChild(tx(el("h2"), "No activity yet"));
      box.appendChild(tx(el("p"), "Open a folder or start an agent in a connected repo."));
      var p = el("p");
      p.appendChild(document.createTextNode("To wire a repo: "));
      p.appendChild(tx(el("code"), "node client/install.mjs <repo>"));
      box.appendChild(p);
    }
    main.appendChild(box);
    return true;
  }

  function render() {
    var now = serverNow();
    // Agent view uses this to decide whether the editor is on screen at all;
    // see the stylesheet. Written on every render rather than in
    // toggleSelection, because the selection is also cleared by switching
    // workspace, by a file going away, and by closeEditor.
    document.body.dataset.picked = String(!!selectedPath);
    renderPresence(now);
    renderPeople(now);
    renderWorkspaces();
    renderCollisions(now);
    renderScope();
    if (!renderBlank()) { renderTree(now); renderDetail(now); }
    renderChanged();
    renderStreams(now);
  }

  function setConn(state, label) {
    conn = state;
    $("conn").dataset.state = state;
    tx($("connText"), label);
  }

  function connect() {
    var es = new EventSource("/events");
    es.addEventListener("hello", function (m) { setConn("live", "live"); applySnapshot(JSON.parse(m.data)); });
    es.addEventListener("activity", function (m) { pushEvent(JSON.parse(m.data)); });
    es.onopen = function () { setConn("live", "live"); render(); };
    es.onerror = function () {
      fetch("/api/state", { credentials: "same-origin" })
        .then(function (r) {
          if (r.status === 401) { es.close(); needsToken = true; setConn("down", "not signed in"); }
          else if (r.status === 429) { es.close(); setConn("down", "rate limited"); }
          else setConn("down", "reconnecting");
          render();
        })
        .catch(function () { setConn("down", "reconnecting"); render(); });
    };
  }

  // Cheap every second; a full render only when something actually changed,
  // or every 15s so idle transitions still surface.
  var lastFull = 0;
  setInterval(function () {
    tickAgo();
    if (serverNow() - lastFull > 15000) render();
  }, 1000);

  var _render = render;
  render = function () {
    lastFull = serverNow();
    _render();
  };

  // Appearance first, before anything paints, so there is no flash of the
  // wrong theme on a machine set to dark.
  applyTheme();
  applyView();

  var themerEl = $("themer");
  if (themerEl) {
    themerEl.addEventListener("click", function () {
      setTheme(theme === "dark" ? "light" : "dark");
    });
  }
  var settingsEl = $("settingsLink");
  if (settingsEl) settingsEl.addEventListener("click", openSettings);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sheetOpen) closeSettings();
  });

  // Staying current. Both halves are guarded on the function existing: this
  // page is also served to a plain browser tab, and to desktop builds older
  // than the updater, and neither has it.
  startUpdates();

  if (LOCAL && typeof window.zevetLocal.onIndexEvent === "function") {
    window.zevetLocal.onIndexEvent(function (p) {
      if (!p) return;
      if (p.kind === "model" && p.total) {
        indexBarPct = Math.round((p.loaded / p.total) * 100);
        indexProgressText = "downloading the model \u2014 " + indexBarPct + "%";
      } else if (p.kind === "index") {
        indexProgressText = "indexing \u2014 " + (p.indexed || 0) + " files";
        indexBarPct = 0;
      } else if (p.kind === "done") {
        indexBarPct = 100;
      }
      if (sheetOpen) renderSheet();
    });
  }

  render();
  renderStrip();
  refreshLocalWorkspaces();
  refreshLocalAgents();
  connect();

  // The strip's machine-side figures — the graph, the code index, the branch,
  // hook health — are polled rather than pushed, because none of them has an
  // event to subscribe to. Its agent-side figures are NOT polled: they arrive
  // on the stream and repaint immediately, which is why `ctx` moves the instant
  // a turn lands rather than up to four seconds later.
  //
  // The timer is not unref'd and does not need clearing: it lives as long as
  // the window does, and the window closing takes it.
  if (LOCAL && typeof window.zevetLocal.status === "function") {
    pollStatus();
    setInterval(pollStatus, STATUS_EVERY_MS);
  }
})();
</script>
</body>
</html>
