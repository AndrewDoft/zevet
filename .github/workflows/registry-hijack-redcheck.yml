# One-off, workflow_dispatch-only: confirms scripts/repro-registry-hijack.mjs
# fails at the actual hijack assertion (not an infra crash) when
# app-update.js's QUIT_INSTALL_ARGS spawn omits winInstallArgs. Delete after
# this single confirming run.
name: registry-hijack-redcheck

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disable Windows Defender real-time scanning (CI runner only)
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build (Windows, unsigned unpacked app)
        working-directory: desktop
        run: node build.cjs -c electron-builder.config.js --win dir --publish never

      - name: Azure login (OIDC, Windows signing only)
        if: vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app executable(s)
        if: vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: desktop/out/win-unpacked
          files-folder-filter: exe
          file-digest: SHA256

      - name: Pack the NSIS installer from the signed app
        working-directory: desktop
        run: node build.cjs -c electron-builder.config.js --win nsis --prepackaged out/win-unpacked --publish never

      - name: Sign the NSIS installer
        if: vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: desktop/out
          files-folder-filter: exe
          file-digest: SHA256

      - name: Check out zevet 0.2.70 (old, unsigned, pre-dates installer.nsh)
        uses: actions/checkout@v4
        with:
          ref: v0.2.70
          path: old-build

      - name: Build zevet 0.2.70 (unsigned -- an old build already installed)
        working-directory: old-build/desktop
        run: |
          npm ci
          node make-icon.mjs
          node build.cjs -c electron-builder.config.js --win --publish never

      - name: Prove an update reaches the RUNNING install, not a phantom per-machine copy elsewhere
        working-directory: desktop
        run: node ../scripts/repro-registry-hijack.mjs "../old-build/desktop/out"
