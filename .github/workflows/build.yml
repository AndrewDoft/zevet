# Builds the downloadable apps.
#
# Exists because a .dmg cannot be produced on Windows: electron-builder needs
# macOS to make one, and both of Andrew's teammates are on Apple silicon. This
# runs the mac build on a mac runner and the Windows build on a Windows runner,
# and hands both back as artifacts.
#
# Run it from the Actions tab (workflow_dispatch), or push a v* tag.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: zevet-windows
          - os: macos-latest
            script: dist:mac
            artifact: zevet-macos
    runs-on: ${{ matrix.os }}
    # Only the Windows leg's federated credential is scoped to this environment
    # (repo:AndrewDoft/zevet:environment:signing); the macOS leg never reaches
    # azure/login so this costs it nothing.
    environment: signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build/icon.png is generated, not committed, and it must exist BEFORE the
      # suite runs because the packaging test reads its pixels.
      #
      # This step also fixes a silent defect: the Build step below called
      # `npx electron-builder` directly, which skips the `dist` npm script that
      # generates the icon -- so every build produced before 2026-09-18 shipped
      # with Electron's DEFAULT icon and nothing failed. Build now goes through
      # the npm script, and this step keeps the test honest.
      - name: Generate icon
        working-directory: desktop
        run: node make-icon.mjs

      # All three installed BEFORE Test: test/setup-window.test.mjs drives the
      # real Electron binary and imports root's playwright-core via
      # scripts/drive/drive.mjs, and editor/test/*.test.mjs imports yjs. None
      # of the three were hoisted here before.
      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install editor deps
        working-directory: editor
        run: npm ci

      # The hub and the client have no dependencies, so this is the whole suite.
      # It runs on both runners on purpose: the bugs this project keeps finding
      # are the ones that are correct on one platform and wrong on the other.
      #
      # `npm test`, not a raw `node --test`: scripts/run-tests.mjs is the one
      # place that reads node's "cancelled" line (a hook that threw before its
      # tests ran — e.g. Electron missing) and fails the job on it, since
      # "cancelled" is not "fail" and a green-looking "fail 0" can hide it.
      - name: Test
        run: npm test

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        # Signing is enabled when all publisher credentials are configured.
        # Otherwise the Mac bundle gets an ad-hoc integrity seal.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        # The npm script generates the app icon and fixes the native Finder
        # background bookmark before the DMG is finalized. Calling
        # electron-builder directly bypasses both steps.
        run: npm run ${{ matrix.script }}

      # ─────────────────────────────────────────────────────────────────────
      # Windows: two stages instead of one `npm run dist:win`.
      #
      # electron-builder 25.1.8's own Azure Trusted Signing path (win.azureSignOptions)
      # gates on AZURE_CLIENT_SECRET / AZURE_CLIENT_CERTIFICATE_PATH / username+password
      # (packages/app-builder-lib/out/codeSign/windowsSignAzureManager.js, verified by
      # reading the installed package) — no federated-token branch, so a GitHub OIDC
      # token satisfies none of the three and it throws before ever signing. Signing
      # instead runs as azure/artifact-signing-action steps, which do support OIDC
      # directly. The app exe has to be signed BEFORE the NSIS installer is packed, or
      # only the installer wrapper carries a signature and Program Files does not —
      # hence dir build, sign, then --prepackaged pack, then sign the installer too.
      - name: Build (Windows, unsigned unpacked app)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: node build.cjs -c electron-builder.config.js --win dir --publish never

      - name: Azure login (OIDC, Windows signing only)
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app executable(s)
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: desktop/out/win-unpacked
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the app executable signature
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem desktop/out/win-unpacked/*.exe
          if ($files.Count -eq 0) { throw "no exe found in desktop/out/win-unpacked" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch "CN=Andrew Doft") { throw "$($f.Name) signer is not Andrew Doft: $($sig.SignerCertificate.Subject)" }
          }

      - name: Pack the NSIS installer from the signed app
        if: runner.os == 'Windows'
        working-directory: desktop
        run: node build.cjs -c electron-builder.config.js --win nsis --prepackaged out/win-unpacked --publish never

      - name: Sign the NSIS installer
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: desktop/out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the installer signature
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem desktop/out/*.exe
          if ($files.Count -eq 0) { throw "no installer exe found in desktop/out" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch "CN=Andrew Doft") { throw "$($f.Name) signer is not Andrew Doft: $($sig.SignerCertificate.Subject)" }
          }

      # Exercise the final DMG, not just electron-builder's exit status. The
      # script checks the complete signature, every Mach-O architecture, the
      # packaged native ONNX/Transformers modules, and a normal app launch.
      # It isolates user data and never weakens the Chromium sandbox or macOS
      # Gatekeeper. Ad-hoc integrity is not Apple publisher trust/notarization.
      - name: Smoke the macOS app on Apple Silicon
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          ZEVET_EXPECT_SIGNED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && '1' || '0' }}
        run: npm run smoke:mac

      # Install -> update -> install-on-quit's own args -> launch, on a real
      # NSIS installer. Exists because of a real incident: an update silently
      # left Program Files\zevet empty, exit code 0 the whole way. See
      # scripts/smoke-windows.mjs and desktop/build/installer.nsh.
      - name: Smoke the Windows install/update cycle
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run smoke:win

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error
          retention-days: 30
# ---------------------------------------------------------------------------
# UNSIGNED, AND WHAT THAT COSTS
#
# Windows has no publisher signature. The macOS bundle is sealed ad-hoc to
# keep its final resources and native code internally consistent, but it has
# no Developer ID signature or notarization. Gatekeeper still rejects it as
# untrusted; recipients must use macOS's explicit per-app approval flow.
# The build and smoke test never remove quarantine or change Gatekeeper.
#
# Trusted distribution requires the publisher's Apple Developer identity and
# notarization, plus a Windows code-signing certificate. Those credentials are
# intentionally not created or purchased by this build.
