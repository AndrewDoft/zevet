# Builds the downloadable apps.
#
# Exists because a .dmg cannot be produced on Windows: electron-builder needs
# macOS to make one, and both of Andrew's teammates are on Apple silicon. This
# runs the mac build on a mac runner and the Windows build on a Windows runner,
# and hands both back as artifacts.
#
# Run it from the Actions tab (workflow_dispatch), or push a v* tag.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: zevet-windows
          - os: macos-latest
            script: dist:mac
            artifact: zevet-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build/icon.png is generated, not committed, and it must exist BEFORE the
      # suite runs because the packaging test reads its pixels.
      #
      # This step also fixes a silent defect: the Build step below called
      # `npx electron-builder` directly, which skips the `dist` npm script that
      # generates the icon -- so every build produced before 2026-09-18 shipped
      # with Electron's DEFAULT icon and nothing failed. Build now goes through
      # the npm script, and this step keeps the test honest.
      - name: Generate icon
        working-directory: desktop
        run: node make-icon.mjs

      # The hub and the client have no dependencies, so this is the whole suite.
      # It runs on both runners on purpose: the bugs this project keeps finding
      # are the ones that are correct on one platform and wrong on the other.
      - name: Test
        run: node --test "test/**/*.test.mjs"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        # CI has no publisher certificate. The custom macOS signer still
        # seals the finished bundle ad-hoc, so strict integrity checks work.
        # This does not establish publisher trust or notarize the app.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Via the npm script, NOT `npx electron-builder`: the script regenerates
        # the icon first, and calling the binary directly is exactly how the
        # icon went missing from every build without a single failure.
        run: npm run ${{ matrix.script }}

      # Exercise the final DMG, not just electron-builder's exit status. The
      # script checks the complete signature, every Mach-O architecture, the
      # packaged native ONNX/Transformers modules, and a normal app launch.
      # It isolates user data and never weakens the Chromium sandbox or macOS
      # Gatekeeper. Ad-hoc integrity is not Apple publisher trust/notarization.
      - name: Smoke the macOS app on Apple Silicon
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run smoke:mac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error
          retention-days: 30
# ---------------------------------------------------------------------------
# UNSIGNED, AND WHAT THAT COSTS
#
# Windows has no publisher signature. The macOS bundle is sealed ad-hoc to
# keep its final resources and native code internally consistent, but it has
# no Developer ID signature or notarization. Gatekeeper still rejects it as
# untrusted; recipients must use macOS's explicit per-app approval flow.
# The build and smoke test never remove quarantine or change Gatekeeper.
#
# Trusted distribution requires the publisher's Apple Developer identity and
# notarization, plus a Windows code-signing certificate. Those credentials are
# intentionally not created or purchased by this build.
