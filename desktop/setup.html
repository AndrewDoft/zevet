<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'" />
<title>Set up zevet</title>
<style>
  /* Self-hosted, same faces as the board. font-src 'self' in the CSP above. */
  @font-face {
    font-family: "Hanken Grotesk";
    src: url("fonts/hanken-grotesk-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --paper: #0d0a0a;
    --surface: #16110f;
    --line: #33221e;
    --grid: #1a1312;
    --ink: #f2e6e1;
    --muted: #8f7d78;
    --rust: #e07a62;
    --rust-deep: #b0523c;
    --rust-bright: #f09c86;
    --fill: #2e1611;
    --danger: #ef6a52;
    --ok: #74bd94;
    --font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    padding: 34px 30px 26px;
  }
  h1 { font-size: 23px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 26px; max-width: 46ch; }
  label { display: block; margin: 0 0 16px; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input {
    width: 100%; padding: 9px 11px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    font: inherit; font-size: 13px;
  }
  input:focus { outline: 2px solid var(--rust); outline-offset: 1px; border-color: transparent; }
  input.mono { font-family: var(--font-mono); font-size: 12px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

  .row { display: flex; gap: 9px; align-items: center; margin-top: 22px; }
  button {
    font: inherit; font-size: 13px; padding: 9px 15px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: opacity 140ms;
  }
  button:hover:not(:disabled) { border-color: var(--rust-deep); }
  button.primary { background: var(--rust-deep); border-color: var(--rust-deep); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--rust); border-color: var(--rust); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .note { margin-top: 20px; padding: 11px 13px; border-left: 3px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); border-radius: 0 4px 4px 0; }
  .note.bad { border-left-color: var(--danger); color: var(--ink); }
  .note.good { border-left-color: var(--ok); color: var(--ink); }
  .note.warn { border-left-color: #d9a430; }
  .note b { color: var(--ink); font-weight: 500; }
  .note code { font-family: var(--font-mono); font-size: 11px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Set up zevet</h1>
  <p class="lede">Connect to your team's hub.</p>

  <label>
    <span class="lbl">Hub address</span>
    <input id="hub" class="mono" placeholder="https://zevet.example.com" autocomplete="off" spellcheck="false" />
    <span class="hint">Use the address your team shared.</span>
  </label>

  <!-- ⚠️ THE GITHUB PATH IS THE DEFAULT AND THE SECRET IS FOLDED AWAY BEHIND IT.
       That ordering is the feature. Andrew, 2026-09-19: "people should be able
       to use the app without having to enter some long code." A pasted 48-char
       secret is still ACCEPTED -- hubs without an OAuth app configured, and the
       installs already in the field, both need it -- but it is no longer the
       thing a new person is shown first, because what people are shown first is
       what they do. -->
  <div class="row">
    <button id="gh" class="primary">Sign in with GitHub</button>
  </div>

  <div id="ghStep" class="note" hidden>
    <b>Approve sign-in on GitHub.</b> If the browser did not open, visit
    <code id="ghUrl"></code> and enter this code:
    <div id="ghCode" class="mono" style="font-size:22px;letter-spacing:3px;margin:10px 0 4px"></div>
    <div id="ghState" class="hint">Waiting for approval…</div>
    <div class="row">
      <button id="ghCancel">Cancel</button>
    </div>
  </div>

  <details id="manual">
    <summary style="cursor:pointer;font-size:12px;color:var(--dim);margin:14px 0 4px">
      Use a master secret instead
    </summary>
    <label>
      <span class="lbl">Master secret</span>
      <input id="token" class="mono" type="password" placeholder="Your team's master secret" autocomplete="off" spellcheck="false" />
      <!-- It is NOT "the token", and the difference is the whole security
           model: the hub is given SHA-256("zevet-auth" || this), and the key
           that encrypts shared editing is HKDF(this). The input id stays
           `token` so the script below keeps working. -->
      <span class="hint">The master secret is never sent to the hub.</span>
    </label>
    <div class="row">
      <button id="check">Connect</button>
    </div>
  </details>

  <label>
    <span class="lbl">Display name</span>
    <input id="actor" placeholder="kai" autocomplete="off" spellcheck="false" />
    <span class="hint">Defaults to your GitHub username.</span>
  </label>

  <div class="row">
    <button id="finish" class="primary" disabled>Open the board</button>
  </div>

  <div id="msg" class="note" hidden></div>

  <div id="repoStep" class="note" hidden>
    <b>Connect a folder</b> to share agent activity with your team.
    You can do this later from the menu.
    <div class="row">
      <button id="pick">Connect a folder…</button>
    </div>
    <div id="repoMsg" hidden style="margin-top:9px"></div>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var verified = false;

  function say(kind, html) {
    var m = $("msg");
    m.hidden = false;
    m.className = "note " + kind;
    m.innerHTML = html;
  }

  // Prefill when re-opened from the menu to change the hub.
  var q = new URLSearchParams(location.search);
  if (q.get("hub")) $("hub").value = q.get("hub");
  if (q.get("actor")) $("actor").value = q.get("actor");
  window.zevet.config().then(function (c) {
    if (!c) return;
    if (!$("hub").value) $("hub").value = c.hub || "";
    if (!$("actor").value) $("actor").value = c.actor || "";
  });

  /* ── The GitHub path ───────────────────────────────────────────────────────
   *
   * ⚠️ THE CONFIG IS WRITTEN BY THE MAIN PROCESS, NOT HERE. `githubWait`
   * resolves only after ~/.zevet/config.json has been saved, so this handler
   * has nothing to save and is never given the secret or the session to save it
   * with. That is the same redaction rule `config()` follows and it is why the
   * success branch below only enables a button.
   */
  function ghBusy(on) {
    $("gh").disabled = on;
    $("ghStep").hidden = !on;
  }

  $("gh").addEventListener("click", async function () {
    var hub = $("hub").value.trim();
    if (!hub) { say("bad", "Enter a hub address."); return; }
    if (!/^https?:\/\//i.test(hub)) { say("bad", "Start the hub address with https:// or http://."); return; }

    say("", "Starting sign-in…");
    ghBusy(true);
    var started = await window.zevet.githubStart(hub);
    if (!started.ok) {
      ghBusy(false);
      // The hub having no OAuth app is the likeliest failure on a self-hosted
      // hub, and it is not the user's fault -- point them at the fallback that
      // is sitting right there rather than leaving them at a dead end.
      say("bad", started.error + "<br><br>Use your team's master secret below.");
      $("manual").open = true;
      return;
    }

    $("ghCode").textContent = started.userCode;
    $("ghUrl").textContent = started.url;
    $("ghState").textContent = "Waiting for approval…";
    $("msg").hidden = true;

    var done = await window.zevet.githubWait();
    ghBusy(false);
    if (!done.ok) {
      if (done.cancelled) { say("", "Sign-in cancelled."); return; }
      say("bad", done.error);
      return;
    }

    verified = true;
    $("finish").disabled = false;
    if (!$("actor").value.trim()) $("actor").value = done.login;
    say("good", "Signed in as <b>" + done.login + "</b>." +
      (done.owner ? " You own this hub. Add teammates in Settings." : ""));
    $("repoStep").hidden = false;
  });

  $("ghCancel").addEventListener("click", function () {
    window.zevet.githubCancel();
    ghBusy(false);
    say("", "Sign-in cancelled.");
  });

  function invalid() {
    if (!$("hub").value.trim()) return "Enter a hub address.";
    if (!$("token").value) return "Enter your team's master secret.";
    if (!$("actor").value.trim()) return "Enter a display name.";
    if (!/^https?:\/\//i.test($("hub").value.trim())) return "Start the hub address with https:// or http://.";
    return null;
  }

  $("check").addEventListener("click", async function () {
    var bad = invalid();
    if (bad) { say("bad", bad); return; }
    $("check").disabled = true;
    say("", "Connecting…");
    var hub = $("hub").value.trim();
    var res = await window.zevet.test(hub, $("token").value);
    $("check").disabled = false;
    if (!res.ok) { verified = false; $("finish").disabled = true; say("bad", res.why); return; }

    verified = true;
    $("finish").disabled = false;
    var warn = "";
    if (/^http:\/\//i.test(hub) && !/^http:\/\/(127\.0\.0\.1|localhost)/i.test(hub)) {
      warn =
        "<br><br><b>This hub uses HTTP.</b> Your token and activity are unencrypted. " +
        "Anyone who can alter the traffic could run code on this computer. " +
        "Use HTTPS outside a trusted network.";
    }
    say(warn ? "warn" : "good", "Connected to zevet " + (res.version || "?") + "." + warn);
    await window.zevet.save(hub, $("token").value, $("actor").value.trim());
    $("repoStep").hidden = false;
  });

  $("pick").addEventListener("click", async function () {
    var repo = await window.zevet.pickRepo();
    if (!repo) return;
    var out = $("repoMsg");
    out.hidden = false;
    out.textContent = "Connecting " + repo + "…";
    var r = await window.zevet.install(repo);
    out.textContent = r.ok ? "Connected: " + repo : "Could not connect this folder: " + r.detail;
  });

  $("finish").addEventListener("click", async function () {
    if (!verified) return;
    // The name can be edited AFTER the credential was established -- that is
    // the normal order now, because signing in fills it in and the person then
    // shortens it. Saving again here is what makes that edit stick; passing an
    // empty credential is understood by `zevet:save` as "keep what you have".
    await window.zevet.save($("hub").value.trim(), $("token").value, $("actor").value.trim());
    window.zevet.done();
  });

  // ⚠️ `actor` IS NOT IN THIS LIST. It is a display name, not a credential:
  // typing it used to invalidate the connection check, which after GitHub
  // sign-in meant filling in your own name disabled the button that finishes
  // setup.
  ["hub", "token"].forEach(function (id) {
    $(id).addEventListener("input", function () {
      verified = false;
      $("finish").disabled = true;
    });
  });
</script>
</body>
</html>
