<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'" />
<title>Set up zevet</title>
<style>
  /* The same self-hosted face and palette as Masora's home page. */
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-variable.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --paper: #eae7e2;
    --ink: #2c2f44;
    --muted: #5f6274;
    --line: #cfccc6;
    --fill: #dbdae1;
    --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0 auto; min-height: 100vh; max-width: 620px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5; font-weight: 400;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    padding: 34px 36px 30px;
  }
  ::selection { background: var(--fill); color: var(--ink); }
  .heading { display: flex; align-items: center; gap: 9px; }
  .brand-mark { display: block; flex: none; width: 18px; height: 18px; }
  h1 { font-size: 23px; line-height: 1.3; font-weight: 500; margin: 0; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 8px 0 28px; max-width: 46ch; }
  label { display: block; margin: 0 0 16px; }
  .lbl { display: block; font-size: 12px; color: var(--ink); margin-bottom: 6px; }
  input {
    width: 100%; min-height: 40px; padding: 9px 11px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-bottom-color: var(--muted); border-radius: 2px;
    font: inherit; font-size: 13px;
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  input:focus { outline: 2px solid var(--ink); outline-offset: 2px; border-color: var(--ink); }
  .mono, code { font-family: var(--font-mono); }
  input.mono { font-size: 12px; }
  .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-top: 18px; }
  button {
    font: inherit; font-size: 13px; min-height: 36px; padding: 7px 0;
    border: 0; border-bottom: 1px solid var(--muted); border-radius: 0;
    background: transparent; color: var(--muted);
    cursor: pointer;
  }
  button.primary { color: var(--ink); border-bottom-color: var(--ink); }
  button:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--ink); }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
  button:disabled, button.primary:disabled { color: var(--muted); border-bottom-color: var(--line); cursor: not-allowed; }

  details { margin: 18px 0 26px; }
  summary { width: fit-content; max-width: 100%; cursor: pointer; font-size: 12px; color: var(--muted); }
  summary:hover { color: var(--ink); }
  details[open] summary { margin-bottom: 18px; }
  .note { margin-top: 22px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .note.bad, .note.warn { border-top-color: var(--ink); color: var(--ink); }
  .note.good { color: var(--ink); }
  .note b { color: var(--ink); font-weight: 500; }
  .note code { font-size: 12px; }
  #ghCode { font-size: 22px; letter-spacing: 3px; margin: 10px 0 4px; color: var(--ink); }
  #repoMsg { margin-top: 9px; }
  [hidden] { display: none !important; }
  @media (max-width: 400px) { body { padding: 28px 24px; } }
</style>
</head>
<body>
  <header class="heading">
    <svg class="brand-mark" width="18" height="18" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false" data-brand-mark="therefore">
      <circle cx="16" cy="8.2" r="3.5" />
      <circle cx="7" cy="23.8" r="3.5" />
      <circle cx="25" cy="23.8" r="3.5" />
    </svg>
    <h1>Set up zevet</h1>
  </header>
  <p class="lede">Connect to your team.</p>

  <label>
    <span class="lbl">Team address</span>
    <input id="hub" class="mono" placeholder="https://zevet.example.com" autocomplete="off" spellcheck="false" />
    <span class="hint">Use the address your team shared.</span>
  </label>

  <!-- ⚠️ THE GITHUB PATH IS THE DEFAULT AND THE SECRET IS FOLDED AWAY BEHIND IT.
       That ordering is the feature. Andrew, 2026-09-19: "people should be able
       to use the app without having to enter some long code." A pasted 48-char
       secret is still ACCEPTED -- hubs without an OAuth app configured, and the
       installs already in the field, both need it -- but it is no longer the
       thing a new person is shown first, because what people are shown first is
       what they do. -->
  <div class="row">
    <!-- Shown unconditionally. There is no way to ask a hub which providers it
         has before signing in — `/auth/whoami` is session-gated, and it is
         session-gated precisely so an unauthenticated stranger cannot enumerate
         the team. So a hub without Google answers the button with "Google
         sign-in is not configured for this hub", which is one wasted click and
         a sentence that names the cause. -->
    <button id="google" class="primary">Sign in with Google</button>
    <button id="gh" class="primary">Sign in with GitHub</button>
  </div>

  <div id="ghStep" class="note" hidden>
    <b>Approve on GitHub.</b> No browser? Visit
    <code id="ghUrl"></code>, enter this code:
    <div id="ghCode" class="mono"></div>
    <div id="ghState" class="hint">Waiting for approval…</div>
    <div class="row">
      <button id="ghCancel">Cancel</button>
    </div>
  </div>

  <!-- ⚠️ NO CODE HERE, AND THAT IS THE DIFFERENCE, NOT AN OMISSION. Google's
       web flow finishes in the browser and lands back on the hub, so there is
       nothing for the person to read or type. The URL is still shown, for the
       same reason the GitHub code is: a browser that opened on the wrong
       profile, or did not open at all, must not be a dead end. -->
  <div id="googleStep" class="note" hidden>
    <b>Finish in your browser.</b> Didn't it open?
    <code id="googleUrl"></code>
    <div id="googleState" class="hint">Waiting for your browser…</div>
    <div class="row">
      <button id="googleCancel">Cancel</button>
    </div>
  </div>

  <details id="manual">
    <summary>
      Use a team key instead
    </summary>
    <label>
      <span class="lbl">Team key</span>
      <input id="token" class="mono" type="password" placeholder="Your team key" autocomplete="off" spellcheck="false" />
      <!-- It is NOT "the token", and the difference is the whole security
           model: the hub is given SHA-256("zevet-auth" || this), and the key
           that encrypts shared editing is HKDF(this). The input id stays
           `token` so the script below keeps working. -->
      <span class="hint">Your team key stays on this device.</span>
    </label>
    <div class="row">
      <button id="check">Connect</button>
    </div>
  </details>

  <label>
    <span class="lbl">Display name</span>
    <input id="actor" placeholder="kai" autocomplete="off" spellcheck="false" />
    <span class="hint">Defaults to the account you signed in with.</span>
  </label>

  <div class="row">
    <button id="finish" class="primary" disabled>Open zevet</button>
  </div>

  <div id="msg" class="note" hidden></div>

  <div id="repoStep" class="note" hidden>
    <b>Connect a folder</b> to share agent activity. Or later, from the menu.
    <div class="row">
      <button id="pick">Connect a folder…</button>
    </div>
    <div id="repoMsg" hidden></div>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var verified = false;

  function say(kind, html) {
    var m = $("msg");
    m.hidden = false;
    m.className = "note " + kind;
    m.innerHTML = html;
  }

  // Prefill when re-opened from the menu to change the hub.
  var q = new URLSearchParams(location.search);
  if (q.get("hub")) $("hub").value = q.get("hub");
  if (q.get("actor")) $("actor").value = q.get("actor");
  window.zevet.config().then(function (c) {
    if (!c) return;
    if (!$("hub").value) $("hub").value = c.hub || "";
    if (!$("actor").value) $("actor").value = c.actor || "";
  });

  /* ── The GitHub path ───────────────────────────────────────────────────────
   *
   * ⚠️ THE CONFIG IS WRITTEN BY THE MAIN PROCESS, NOT HERE. `githubWait`
   * resolves only after ~/.zevet/config.json has been saved, so this handler
   * has nothing to save and is never given the secret or the session to save it
   * with. That is the same redaction rule `config()` follows and it is why the
   * success branch below only enables a button.
   */
  function ghBusy(on) {
    $("gh").disabled = on;
    $("google").disabled = on;
    $("ghStep").hidden = !on;
  }

  $("gh").addEventListener("click", async function () {
    var hub = $("hub").value.trim();
    if (!hub) { say("bad", "Enter a team address."); return; }
    if (!/^https?:\/\//i.test(hub)) { say("bad", "Team address needs https:// or http://."); return; }

    say("", "Starting sign-in…");
    ghBusy(true);
    var started = await window.zevet.githubStart(hub);
    if (!started.ok) {
      ghBusy(false);
      // The hub having no OAuth app is the likeliest failure on a self-hosted
      // hub, and it is not the user's fault -- point them at the fallback that
      // is sitting right there rather than leaving them at a dead end.
      say("bad", "Use your team key below.");
      $("manual").open = true;
      return;
    }

    $("ghCode").textContent = started.userCode;
    $("ghUrl").textContent = started.url;
    $("ghState").textContent = "Waiting for approval…";
    $("msg").hidden = true;

    var done = await window.zevet.githubWait();
    ghBusy(false);
    if (!done.ok) {
      if (done.cancelled) { say("", "Sign-in cancelled."); return; }
      say("bad", "Could not sign in.");
      return;
    }

    verified = true;
    $("finish").disabled = false;
    if (!$("actor").value.trim()) $("actor").value = done.login;
    say("good", "Signed in as <b>" + done.login + "</b>." +
      (done.owner ? " Owner. Invite teammates in Settings." : ""));
    $("repoStep").hidden = false;
  });

  $("ghCancel").addEventListener("click", function () {
    window.zevet.githubCancel();
    ghBusy(false);
    say("", "Sign-in cancelled.");
  });

  /* ── The Google path ───────────────────────────────────────────────────────
   *
   * The same three calls and the same rule about who writes the config. Two
   * differences, both consequences of the browser finishing the flow rather
   * than this window: there is no code to paint, and `googleWait` can sit for
   * ten minutes while somebody picks an account.
   */
  function googleBusy(on) {
    $("google").disabled = on;
    $("gh").disabled = on;
    $("googleStep").hidden = !on;
  }

  $("google").addEventListener("click", async function () {
    var hub = $("hub").value.trim();
    if (!hub) { say("bad", "Enter a team address."); return; }
    if (!/^https?:\/\//i.test(hub)) { say("bad", "Team address needs https:// or http://."); return; }

    say("", "Starting sign-in…");
    googleBusy(true);
    var started = await window.zevet.googleStart(hub);
    if (!started.ok) {
      googleBusy(false);
      // Same reasoning as the GitHub branch: a hub with no Google client is a
      // deployment problem, and the fallback is sitting right there.
      say("bad", "Use GitHub above, or your team key below.");
      return;
    }

    $("googleUrl").textContent = started.url;
    $("googleState").textContent = started.domain
      ? "Waiting for your browser — sign in with your " + started.domain + " account…"
      : "Waiting for your browser…";
    $("msg").hidden = true;

    var done = await window.zevet.googleWait();
    googleBusy(false);
    if (!done.ok) {
      if (done.cancelled) { say("", "Sign-in cancelled."); return; }
      say("bad", "Could not sign in.");
      return;
    }

    verified = true;
    $("finish").disabled = false;
    // The local part, not the whole address: a board full of rows labelled
    // "andrew@usemasora.com" is a board where the domain is repeated on every
    // line and the name is the part nobody can see. Still overridable.
    if (!$("actor").value.trim()) $("actor").value = String(done.login).split("@")[0];
    say("good", "Signed in as <b>" + done.login + "</b>." +
      (done.owner ? " Owner. Invite teammates in Settings." : ""));
    $("repoStep").hidden = false;
  });

  $("googleCancel").addEventListener("click", function () {
    window.zevet.googleCancel();
    googleBusy(false);
    say("", "Sign-in cancelled.");
  });

  function invalid() {
    if (!$("hub").value.trim()) return "Enter a team address.";
    if (!$("token").value) return "Enter your team key.";
    if (!$("actor").value.trim()) return "Enter a display name.";
    if (!/^https?:\/\//i.test($("hub").value.trim())) return "Team address needs https:// or http://.";
    return null;
  }

  $("check").addEventListener("click", async function () {
    var bad = invalid();
    if (bad) { say("bad", bad); return; }
    $("check").disabled = true;
    say("", "Connecting…");
    var hub = $("hub").value.trim();
    var res = await window.zevet.test(hub, $("token").value);
    $("check").disabled = false;
    if (!res.ok) { verified = false; $("finish").disabled = true; say("bad", "Could not connect."); return; }

    verified = true;
    $("finish").disabled = false;
    var warn = "";
    if (/^http:\/\//i.test(hub) && !/^http:\/\/(127\.0\.0\.1|localhost)/i.test(hub)) {
      warn =
        "<br><br><b>This connection is unencrypted.</b> " +
        "Anyone who can alter the traffic could run code on this computer. " +
        "Use HTTPS outside a trusted network.";
    }
    say(warn ? "warn" : "good", "Connected." + warn);
    await window.zevet.save(hub, $("token").value, $("actor").value.trim());
    $("repoStep").hidden = false;
  });

  $("pick").addEventListener("click", async function () {
    var repo = await window.zevet.pickRepo();
    if (!repo) return;
    var out = $("repoMsg");
    out.hidden = false;
    out.textContent = "Connecting…";
    var r = await window.zevet.install(repo);
    out.textContent = r.ok ? "Folder connected." : "Could not connect this folder.";
  });

  $("finish").addEventListener("click", async function () {
    if (!verified) return;
    // The name can be edited AFTER the credential was established -- that is
    // the normal order now, because signing in fills it in and the person then
    // shortens it. Saving again here is what makes that edit stick; passing an
    // empty credential is understood by `zevet:save` as "keep what you have".
    await window.zevet.save($("hub").value.trim(), $("token").value, $("actor").value.trim());
    window.zevet.done();
  });

  // ⚠️ `actor` IS NOT IN THIS LIST. It is a display name, not a credential:
  // typing it used to invalidate the connection check, which after GitHub
  // sign-in meant filling in your own name disabled the button that finishes
  // setup.
  ["hub", "token"].forEach(function (id) {
    $(id).addEventListener("input", function () {
      verified = false;
      $("finish").disabled = true;
    });
  });
</script>
</body>
</html>
