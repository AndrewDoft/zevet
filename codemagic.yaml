# macOS build on Codemagic's Apple Silicon machines -- the same steps as the macOS leg of
# .github/workflows/build.yml. Manual only: start it with `node scripts/codemagic.mjs`.
# Developer ID signed and notarized when the `apple_signing` secure group is present (see
# docs/RELEASING.md); ad-hoc sealed and loudly unsigned otherwise (forks/PRs have no group).
workflows:
  macos:
    name: macOS build and smoke
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      # apple_signing: CERTIFICATE_P12 (base64 .p12), CERTIFICATE_PASSWORD, APPLE_API_KEY
      # (base64 .p8 App Store Connect API key), APPLE_API_KEY_ID, APPLE_API_ISSUER.
      # CERTIFICATE_P12/PASSWORD map to electron-builder's CSC_LINK/CSC_KEY_PASSWORD;
      # APPLE_API_KEY is decoded to a file at build time (electron-builder needs a
      # path, not the base64 text). desktop/signing.js gates on all five being
      # present (ALL OR NONE) before signing or notarizing anything. Not an Apple
      # ID + app-specific password: that path locked the Apple ID twice on a bad
      # credential in one afternoon, and an API key structurally cannot.
      groups:
        - apple_signing
    scripts:
      - name: Generate icon
        script: cd desktop && node make-icon.mjs
      - name: Install root deps
        script: npm ci
      - name: Install desktop deps
        script: cd desktop && npm ci
      - name: Install editor deps
        script: cd editor && npm ci
      - name: Test
        script: node --test "test/**/*.test.mjs" "editor/test/**/*.test.mjs"
      - name: Import Apple's Developer ID intermediate CA
        script: |
          set -euo pipefail
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            # A fresh CI keychain has no path to Apple's Developer ID intermediate,
            # so `security find-identity` reports the imported cert as
            # CSSMERR_TP_NOT_TRUSTED even though it is perfectly valid -- verified
            # once on a real Codemagic build this session (electron-builder found
            # "1 identities found ... 0 valid identities found"). The root (Apple
            # Root CA) is already a trusted system anchor; only this intermediate
            # was missing from electron-builder's own bundled root cert keychain.
            curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import /tmp/DeveloperIDG2CA.cer -k ~/Library/Keychains/login.keychain-db
          fi
      - name: Build the .dmg
        script: |
          set -euo pipefail
          cd desktop
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            export CSC_LINK="$CERTIFICATE_P12"
            export CSC_KEY_PASSWORD="$CERTIFICATE_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            # Confirms --key/--key-id/--issuer are this notarytool's real flags,
            # in this build's own log, rather than trusting @electron/notarize's
            # source alone.
            xcrun notarytool submit --help
            # electron-builder's notarize path needs APPLE_API_KEY to be a
            # FILESYSTEM PATH to the .p8 (that's what @electron/notarize's
            # `appleApiKey` is and passes straight through as `--key`), not the
            # secure variable's base64 text -- decode it to a file and repoint
            # the env var at that path. App Store Connect API key, not an Apple
            # ID + app-specific password: that path locked the Apple ID twice on
            # a bad credential; an API key cannot.
            echo "$APPLE_API_KEY" | base64 --decode > /tmp/AuthKey.p8
            export APPLE_API_KEY=/tmp/AuthKey.p8
          fi
          npm run dist:mac
      - name: Smoke the app on Apple Silicon
        script: |
          cd desktop
          [ -n "${CERTIFICATE_P12:-}" ] && export ZEVET_EXPECT_SIGNED=1 || export ZEVET_EXPECT_SIGNED=0
          npm run smoke:mac
      - name: Arch and checksum
        script: |
          set -euo pipefail
          cd desktop/out
          DMG="$(ls zevet-*-macos-arm64.dmg)"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          lipo -archs "$MNT/zevet.app/Contents/MacOS/zevet"
          codesign -dv "$MNT/zevet.app" 2>&1 | grep -E "Signature|Identifier"
          hdiutil detach "$MNT" >/dev/null
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          stat -f "%z bytes" "$DMG"
      - name: Gatekeeper and notarization verify
        script: |
          set -euo pipefail
          cd desktop/out
          DMG="$(ls zevet-*-macos-arm64.dmg)"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          APP="$MNT/zevet.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            spctl -a -vvv "$APP"
            xcrun stapler validate "$APP"
          fi
          hdiutil detach "$MNT" >/dev/null
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            xcrun stapler validate "$DMG"
            # spctl assesses CODE SIGNATURES; a .dmg has none of its own to find,
            # under any -t policy -- confirmed empirically on a real Codemagic
            # build this session (every type rejected the SAME dmg that
            # `stapler validate` had just accepted, on zevet-voice's identical
            # check). A stapled ticket is not a code signature; stapler validate
            # is the correct tool for a dmg. spctl's job is the .app, above.
          fi
    artifacts:
      - desktop/out/*.dmg
      - desktop/out/*.dmg.sha256

  # Proves the macOS self-update path (desktop/app-update.js) end to end on
  # real Apple Silicon: builds X and X+0.0.1, installs X, serves X+1 through
  # the real feed/check/download/verify code, then exercises both the silent
  # install-on-quit path and the "Restart now" IPC hook. Manual only, and only
  # ever meant for a throwaway VM: it installs into ~/Applications and
  # launches the app for real. See scripts/test-macos-autoupdate.mjs.
  macos-autoupdate:
    name: macOS self-update proof
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      groups:
        - apple_signing
    scripts:
      - name: Generate icon
        script: cd desktop && node make-icon.mjs
      - name: Install root deps
        script: npm ci
      - name: Install desktop deps
        script: cd desktop && npm ci
      - name: Install editor deps
        script: cd editor && npm ci
      - name: Test
        script: node --test "test/**/*.test.mjs" "editor/test/**/*.test.mjs"
      - name: Import Apple's Developer ID intermediate CA
        script: |
          set -euo pipefail
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import /tmp/DeveloperIDG2CA.cer -k ~/Library/Keychains/login.keychain-db
          fi
      - name: Build X (.dmg)
        script: |
          set -euo pipefail
          cd desktop
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            export CSC_LINK="$CERTIFICATE_P12"
            export CSC_KEY_PASSWORD="$CERTIFICATE_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > /tmp/AuthKey.p8
            export APPLE_API_KEY=/tmp/AuthKey.p8
          fi
          npm run dist:mac
      - name: Bump to X+0.0.1 and build again
        script: |
          set -euo pipefail
          cd desktop
          npm version patch --no-git-tag-version
          if [ -n "${CERTIFICATE_P12:-}" ]; then
            export CSC_LINK="$CERTIFICATE_P12"
            export CSC_KEY_PASSWORD="$CERTIFICATE_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > /tmp/AuthKey.p8
            export APPLE_API_KEY=/tmp/AuthKey.p8
          fi
          npm run dist:mac
      - name: Build the local update feed for X+1
        script: |
          set -euo pipefail
          mkdir -p /tmp/zevet-feed
          X1_DMG="$(ls desktop/out/zevet-*-macos-arm64.dmg | sort -V | tail -1)"
          cp "$X1_DMG" /tmp/zevet-feed/
          node scripts/make-feed.mjs /tmp/zevet-feed
      - name: Prove the macOS self-update on real hardware
        script: |
          set -euo pipefail
          X_DMG="$(ls desktop/out/zevet-*-macos-arm64.dmg | sort -V | head -1)"
          node scripts/test-macos-autoupdate.mjs "$X_DMG" /tmp/zevet-feed
    artifacts:
      - desktop/out/*.dmg
